          return '<button type="button" class="option' + (on ? " is-on" : "") + '" role="radio" aria-checked="' + on + '" data-act="quiz-pick" data-arg="' + i + '"><span class="option-mark" aria-hidden="true">' + icon("check") + '</span><span class="option-text"><span class="option-label">' + t(o[1]) + "</span></span></button>";
        }).join("") + "</div>" +
        '<div class="row gap">' + (q.i > 0 ? '<button type="button" class="btn btn-line" data-act="quiz-back">' + icon("left") + t("Question précédente") + "</button>" : "") +
        '<button type="button" class="btn btn-quiet" data-act="quiz-cancel">' + t("Annuler") + "</button></div>" +
        '<p class="muted small">' + t("Réponds spontanément : il n'y a pas de bonne réponse.") + "</p></div>";
    }
    if (res && D.styles[res.primary]) return styleResult(res);
    return '<p class="lead">' + t("Dans Interviewology, Anna Papalia décrit quatre styles d'entretien, aussi bien chez les candidats que chez les recruteurs. Ce questionnaire t'aide à repérer le tien, sa force et son piège.") + "</p>" +
      '<ul class="style-mini">' + Object.keys(D.styles).map(k => '<li><span class="sm-name">' + t(D.styles[k].name) + '</span><span class="sm-want">' + t(D.styles[k].want) + "</span></li>").join("") + "</ul>" +
      '<button type="button" class="btn btn-primary btn-lg" data-act="quiz-start">' + t("Commencer le questionnaire") + icon("right") + "</button>" +
      '<p class="muted small">' + t("Version indicative en huit questions, écrite par La Générale. Ce n'est pas l'évaluation officielle d'Anna Papalia, l'Interviewology Profile.") + "</p>";
  }
  function styleResult(res) {
    const P = D.styles[res.primary];
    const Sx = res.secondary && D.styles[res.secondary];
    const scores = res.scores || {};
    const max = Math.max(1, ...Object.keys(D.styles).map(k => scores[k] || 0));
    return '<section class="style-card"><p class="h-label">' + t("Ton style dominant") + '</p><h2 class="style-name">' + t(P.name) + '</h2><p class="muted small">' + t("Dans le livre : " + P.en) + "</p>" +
      '<dl class="points"><dt>' + t("Ce que tu cherches") + "</dt><dd>" + t(P.want) + "</dd><dt>" + t("L'entretien, pour toi") + "</dt><dd>" + t(P.sees) + "</dd><dt>" + t("Tes forces") + "</dt><dd>" + t(P.forces.join(", ")) + "</dd><dt>" + t("Ton piège") + "</dt><dd><strong>" + t(P.piege) + "</strong></dd></dl>" +
      '<p class="h-label">' + t("En entretien, pense à…") + '</p><ul class="take">' + P.conseils.map(x => "<li>" + t(x) + "</li>").join("") + "</ul></section>" +
      (Sx ? '<p class="small">' + t("Ton second style : ") + "<strong>" + t(lcFirst(Sx.name)) + "</strong>. " + t("Son piège : " + lcFirst(Sx.piege)) + "</p>" : "") +
      '<div class="panel slim"><p class="h-label">' + t("Tes réponses, par style") + '</p><div class="style-bars">' + Object.keys(D.styles).map(k =>
        '<div class="sb-row"><span class="sb-label">' + t(D.styles[k].name) + '</span><span class="sb-track" aria-hidden="true"><span style="width:' + Math.round(((scores[k] || 0) / max) * 100) + '%"></span></span><span class="sb-val">' + (scores[k] || 0) + "</span></div>").join("") + "</div></div>" +
      '<h2 class="h-section">' + t("Face à ton recruteur") + '</h2><p class="muted">' + t("Ton recruteur a aussi un style. Repère-le dans les premières minutes.") + '</p><dl class="points">' +
      Object.keys(D.styles).map(k => "<dt>" + t("Un " + lcFirst(D.styles[k].name).replace(/^l'|^le /, "")) + "</dt><dd>" + t(D.styles[k].face) + "</dd>").join("") + "</dl>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-line" data-act="quiz-start">' + icon("reset") + t("Refaire le questionnaire") + '</button><button type="button" class="btn btn-quiet" data-act="open-lesson" data-arg="e-style" data-from="itw">' + t("Noter mon piège") + icon("right") + "</button></div>" +
      '<p class="muted small">' + t("Conseils de La Générale, d'après les quatre styles d'Interviewology. Version indicative, pas l'évaluation officielle d'Anna Papalia.") + "</p>";
  }

  /* ============================================================
     DÉCODER L'OFFRE
     ============================================================ */
  function jdLocal(S) {
    const app = cur(S);
    const jd = (app && app.jd) || "";
    if (!jd.trim()) return "";
    const kws = E.jdKeywords(jd, 18);
    return '<div class="panel slim"><p class="h-label">' + t("Les mots qui reviennent") + "</p>" +
      (kws.length ? '<div class="chips">' + kws.map(k => '<span class="chip">' + t(k.term) + ' <span class="chip-n">× ' + k.n + "</span></span>").join("") + "</div>" : '<p class="muted small">' + t("Aucun terme ne revient plusieurs fois. Repère les exigences à la lecture.") + "</p>") +
      '<p class="muted small">' + t("Repérage automatique : garde ceux qui décrivent une compétence ou une responsabilité.") + "</p></div>";
  }
  function offre(S, UI) {
    const app = cur(S) || {};
    const jd = app.jd || "";
    const ai = app.jdAI;
    const st = UI.jdState || { status: "idle" };
    const stories = it(S).stories || [];
    const comp = [0, 1, 2, 3, 4].map(i => (app.comp || [])[i] || {});
    const proven = comp.filter(c => c.name && c.story && stories.some(s => s.id === c.story));
    const missing = comp.filter(c => c.name && !(c.story && stories.some(s => s.id === c.story))).map(c => c.name);
    const list = a => Array.isArray(a) ? a.filter(x => x != null && String(typeof x === "object" ? x.nom || "" : x).trim()) : [];
    let aiHtml = "";
    if (UI.ai) {
      aiHtml = '<div class="panel coach"><h2 class="h-title">' + t("L'analyse du coach") + '</h2><p class="muted small">' + t("Le coach lit l'offre et en tire les exigences clés, les questions probables et les points où tu devras rassurer. Il ne reçoit que le texte de l'offre et ta fiche.") + "</p>" +
        '<div class="row gap"><button type="button" class="btn btn-primary btn-sm" data-act="jd-ai"' + (jd.trim().length >= 80 && st.status !== "wait" ? "" : " disabled") + ">" + icon("chat") + t(ai ? "Relancer l'analyse" : "Analyser l'offre") + "</button>" +
        (st.status === "wait" ? '<button type="button" class="btn btn-quiet btn-sm" data-act="coach-stop" data-arg="jd-ai">' + t("Arrêter") + "</button>" : "") + "</div>" +
        (jd.trim().length < 80 ? '<p class="muted small">' + t("Colle d'abord le texte complet de l'offre.") + "</p>" : "") +
        (st.status === "wait" ? '<div class="coach-out is-wait" aria-live="polite"><span class="dots" aria-hidden="true"></span>' + t("Le coach lit l'offre…") + "</div>" : "") +
        (st.status === "error" ? '<div class="coach-out is-error" role="status">' + t(st.error || "L'analyse n'a pas abouti.") + "</div>" : "");
      if (ai) {
        const comps = list(ai.competences);
        aiHtml += '<div class="jd-ai">' +
          (comps.length ? '<p class="h-label">' + t("Les exigences clés") + '</p><ol class="take">' + comps.map(c => "<li><strong>" + t(String(c.nom || c)) + "</strong>" + (c.pourquoi ? " : " + t(String(c.pourquoi)) : "") + "</li>").join("") + "</ol>" +
            '<button type="button" class="btn btn-line btn-sm" data-act="jd-use">' + icon("check") + t("Reprendre ces exigences dans mon tableau") + "</button>" : "") +
          (list(ai.questions).length ? '<p class="h-label">' + t("Les questions probables") + '</p><ul class="take">' + list(ai.questions).map(q => "<li>" + t(String(q)) + "</li>").join("") + '</ul><p class="muted small">' + t("Elles sont ajoutées à tes simulations.") + "</p>" : "") +
          (list(ai.motscles).length ? '<p class="h-label">' + t("Les mots à reprendre à l'oral") + '</p><div class="chips">' + list(ai.motscles).map(m => '<span class="chip">' + t(String(m)) + "</span>").join("") + "</div>" : "") +
          (list(ai.vigilance).length ? '<p class="h-label">' + t("Là où tu devras rassurer") + '</p><ul class="take">' + list(ai.vigilance).map(v => "<li>" + t(String(v)) + "</li>").join("") + "</ul>" : "") +
          "</div>";
      }
      aiHtml += "</div>";
    }
    return '<p class="lead">' + t("Anna Papalia conseille aux recruteurs de construire leurs questions à partir de la fiche de poste. Fais le même travail : chaque exigence de l'offre est une question qu'on te posera.") + "</p>" +
      '<div class="field"><label for="jd-text">' + t("L'offre d'emploi") + '</label><textarea id="jd-text" class="input" rows="8" data-app="jd" placeholder="' + esc("Colle ici le texte complet de l'annonce.") + '">' + esc(jd) + "</textarea></div>" +
      '<div id="jd-local">' + jdLocal(S) + "</div>" +
      aiHtml +
      '<section class="panel"><div class="panel-head"><h2 class="h-title">' + t("Tes cinq exigences clés") + '</h2><span class="muted small">' + t(proven.length + " sur 5 prouvées") + "</span></div>" +
      '<p class="muted small">' + t("Pour chaque exigence, choisis l'histoire de ta banque qui la prouve.") + "</p>" +
      '<ol class="comp-list">' + comp.map((c, i) => {
        const has = c.story && stories.some(s => s.id === c.story);
        return '<li><div class="comp-row"><label class="sr" for="comp-' + i + '">' + t("Exigence " + (i + 1)) + '</label><input id="comp-' + i + '" class="input" data-comp="' + i + '" value="' + esc(c.name || "") + '" placeholder="' + esc(i === 0 ? "Ex. : piloter un budget" : "Exigence " + (i + 1)) + '">' +
          '<label class="sr" for="comps-' + i + '">' + t("Preuve pour l'exigence " + (i + 1)) + '</label><select id="comps-' + i + '" class="input" data-comp-story="' + i + '"><option value="">' + esc(stories.length ? "Choisir une histoire…" : "Aucune histoire pour l'instant") + "</option>" +
          stories.map(s => '<option value="' + esc(s.id) + '"' + (c.story === s.id ? " selected" : "") + ">" + esc(s.title || "Sans titre") + "</option>").join("") + "</select>" +
          '<span class="comp-pill">' + (c.name ? pill(has ? { tone: "good", label: "Prouvée" } : { tone: "warn", label: "À prouver" }) : "") + "</span></div></li>";
      }).join("") + "</ol>" +
      (missing.length ? '<p class="small">' + t("Il te manque une preuve pour : " + missing.join(", ") + ".") + "</p>" : "") +
      '<button type="button" class="btn btn-line btn-sm" data-act="open-tool" data-arg="histoires">' + icon("stack") + t("Ouvrir ma banque d'histoires") + "</button></section>";
  }

  /* ============================================================
     « PARLEZ-MOI DE VOUS »
     ============================================================ */
  const PITCH = [
    ["itw.passe", "Passé", "Ce qui t'a amené à ce métier : une courte histoire, pourquoi ces études ou ce premier poste.", "J'ai découvert … quand …"],
    ["itw.present", "Présent", "Ce que tu fais aujourd'hui qui te qualifie pour ce poste, avec un résultat concret.", "Aujourd'hui, je … L'an dernier, j'ai …"],
    ["itw.futur", "Futur", "Pourquoi tu te vois chez eux : ce que tu sais du poste et de l'entreprise.", "Je cherche maintenant … et votre …"]
  ];
  function pitchText(S) { const n = S.notes || {}; return PITCH.map(p => String(n[p[0]] || "").trim()).filter(Boolean).join("\n\n"); }
  function pitchLive(S) {
    const txt = pitchText(S);
    const w = words(txt);
    const secs = Math.round((w / 130) * 60);
    const verdict = !w ? null : secs < 45 ? { tone: "warn", label: "Un peu court" } : secs <= 95 ? { tone: "good", label: "Bonne durée" } : { tone: "warn", label: "Trop long" };
    const pct = Math.min(100, (secs / 120) * 100);
    return '<p class="h-label">' + t("Durée estimée à l'oral") + '</p><p class="big-num">' + (w ? t(E.fmtDur(secs)) : "–") + " " + pill(verdict) + "</p>" +
      '<div class="dur-track" aria-hidden="true"><span class="dur-zone"></span><span class="dur-mark" style="left:' + pct.toFixed(1) + '%"></span></div>' +
      '<div class="dur-scale" aria-hidden="true"><span>0 s</span><span>60 s</span><span>90 s</span><span>2 min</span></div>' +
      '<p class="muted small">' + t("Cible : 60 à 90 secondes, à 130 mots par minute. " + plural(w, "mot") + ".") + "</p>" +
      (txt ? '<div class="pitch-preview">' + txt.split(/\n\n/).map(x => "<p>" + t(x) + "</p>").join("") + "</div>" : "");
  }
  function pitch(S, UI) {
    const n = S.notes || {};
    return '<p class="lead">' + t("La formule d'Anna Papalia, en trois temps. Écris des phrases simples, comme tu les dirais. Tu ne vas pas les réciter : les écrire t'aide à trier.") + "</p>" +
      '<div class="two-col"><div class="col-main">' + PITCH.map((p, i) =>
        '<div class="field pitch-field"><label for="' + fid(p[0]) + '"><span class="pf-num">' + (i + 1) + "</span>" + t(p[1]) + '</label><p class="muted small">' + t(p[2]) + "</p>" +
        '<textarea id="' + fid(p[0]) + '" class="input" rows="4" data-note="' + p[0] + '" placeholder="' + esc(p[3]) + '">' + esc(n[p[0]] || "") + "</textarea></div>").join("") + "</div>" +
      '<div class="col-side"><div class="panel" id="pitch-live">' + pitchLive(S) + "</div>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-primary" data-act="pitch-rehearse">' + icon("video") + t("Me filmer en le disant") + '</button><button type="button" class="btn btn-line" data-act="pitch-copy">' + icon("copy") + t("Copier") + "</button></div>" +
      (UI.ai ? coachPanel("pitch-coach", UI.pitchCoach, "L'avis du coach", "Ce qui marche, ce qu'il faut resserrer, et une version de 90 secondes, sans rien inventer.", "pitch-coach-out", !pitchText(S)) : "") +
      "</div></div>";
  }

  /* ============================================================
     BANQUE D'HISTOIRES
     ============================================================ */
  function storyLint(s) {
    const c = E.storyCheck(s || {});
    const status = c.ready ? { tone: "good", label: "Prête" } : c.complete ? { tone: "warn", label: "Sans chiffre" } : { tone: "info", label: "À compléter" };
    return '<div class="lint"><p class="small"><strong>' + t(c.words ? "≈ " + E.fmtDur(c.secs) + " à l'oral" : "Pas encore de texte") + "</strong> " + pill(status) + "</p>" +
      (c.tips.length ? '<ul class="lint-list">' + c.tips.map(x => "<li>" + t(x) + "</li>").join("") + "</ul>" : '<p class="small">' + t("Elle est prête : raconte-la à voix haute.") + "</p>") + "</div>";
  }
  function storyEditor(s, UI) {
    const c = E.storyCheck(s);
    const fld = (k, label, hint, rows) => '<div class="field"><label for="st-' + k + '">' + t(label) + "</label>" + (hint ? '<p class="muted small">' + t(hint) + "</p>" : "") +
      (rows ? '<textarea id="st-' + k + '" class="input" rows="' + rows + '" data-story="' + k + '">' + esc(s[k] || "") + "</textarea>" : '<input id="st-' + k + '" class="input" data-story="' + k + '" value="' + esc(s[k] || "") + '">') + "</div>";
    const confirm = UI.confirm === "story:" + s.id;
    return '<section class="panel story-editor" aria-labelledby="se-title"><div class="panel-head"><h2 class="h-title" id="se-title">' + t(s.title ? "Modifier l'histoire" : "Nouvelle histoire") + '</h2><span class="muted small">' + t("Enregistrée au fur et à mesure") + "</span></div>" +
      fld("title", "Un titre court", "Pour la retrouver : « Le retard des réclamations ».", 0) +
      fld("situation", "Situation", "Le contexte en une ou deux phrases : où, quand, quel enjeu.", 2) +
      fld("task", "Tâche", "Ton rôle, ton objectif, la difficulté.", 2) +
      fld("action", "Action", "Ce que tu as fait, toi. Dis « je ».", 4) +
      fld("result", "Résultat", "Un chiffre, une date, une conséquence mesurable.", 2) +
      fld("lesson", "Ce que tu en as retenu", "", 2) +
      '<div class="field"><span class="h-label" id="se-themes">' + t("Elle répond à quels thèmes ?") + '</span><div class="chips" role="group" aria-labelledby="se-themes">' +
      D.themes.map(th => { const on = (s.themes || []).indexOf(th.id) >= 0; return '<button type="button" class="chip chip-btn' + (on ? " is-on" : "") + '" aria-pressed="' + on + '" data-act="story-theme" data-arg="' + th.id + '">' + t(th.label) + "</button>"; }).join("") + "</div></div>" +
      '<div id="story-lint">' + storyLint(s) + "</div>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-primary" data-act="story-close">' + icon("check") + t("Terminer") + "</button>" +
      '<button type="button" class="btn btn-line" data-act="story-practice" data-arg="' + esc(s.id) + '">' + icon("video") + t("La raconter en me filmant") + "</button>" +
      (confirm ? '<button type="button" class="btn btn-danger btn-sm" data-act="story-del" data-arg="' + esc(s.id) + '">' + t("Supprimer") + '</button><button type="button" class="btn btn-quiet btn-sm" data-act="confirm-cancel">' + t("Annuler") + "</button>"
        : '<button type="button" class="btn btn-quiet" data-act="confirm" data-arg="story:' + esc(s.id) + '">' + icon("trash") + t("Supprimer") + "</button>") + "</div>" +
      (UI.ai ? coachPanel("story-coach", (UI.storyCoach || {})[s.id], "Muscler cette histoire", "Le coach propose une version orale de 120 à 150 mots, sans rien inventer.", "story-coach-out", !c.complete, s.id) : "") +
      "</section>";
  }
  function histoires(S, UI) {
    const list = it(S).stories || [];
    const editing = UI.storyEdit ? list.find(s => s.id === UI.storyEdit) : null;
    const app = cur(S);
    const isMgr = app && app.level === "manager";
    const covered = {};
    list.forEach(s => { if (E.storyCheck(s).complete) (s.themes || []).forEach(th => { covered[th] = (covered[th] || 0) + 1; }); });
    const themes = D.themes.filter(th => !th.manager || isMgr || covered[th.id]);
    const core = themes.filter(th => th.core);
    const missingCore = core.filter(th => !covered[th.id]);
    let h = '<p class="lead">' + t("Six histoires vécues, racontées en STAR, couvrent la plupart des questions « Racontez-moi une fois où… ». Une histoire bien préparée sert pour plusieurs questions.") + "</p>";
    if (editing) h += storyEditor(editing, UI);
    h += '<section class="panel"><div class="panel-head"><h2 class="h-title">' + t("Tes thèmes couverts") + '</h2><span class="muted small">' + t((core.length - missingCore.length) + " sur " + core.length + " essentiels") + "</span></div>" +
      '<ul class="theme-grid">' + themes.map(th => '<li class="' + (covered[th.id] ? "is-on" : "") + (th.core ? " is-core" : "") + '"><span class="th-mark" aria-hidden="true">' + (covered[th.id] ? icon("check") : "") + "</span><span>" + t(th.label) + "</span>" + (covered[th.id] ? '<span class="sr">' + t(" : couvert") + "</span>" : "") + "</li>").join("") + "</ul>" +
      (missingCore.length ? '<p class="small">' + t("Il te manque : " + missingCore.map(x => lcFirst(x.label)).join(", ") + ".") + "</p>" : '<p class="small">' + t("Les six thèmes essentiels sont couverts.") + "</p>") +
      "</section>";
    h += '<div class="section-head"><h2 class="h-section">' + t("Tes histoires") + '</h2><button type="button" class="btn btn-primary btn-sm" data-act="story-new">' + icon("plus") + t("Ajouter une histoire") + "</button></div>";
    if (!list.length) {
      h += '<div class="panel empty"><p class="h-title">' + t("Ta banque est vide") + '</p><p class="muted">' + t("Commence par ta plus belle réussite : où, quoi, ce que tu as fait, le résultat.") + '</p><button type="button" class="btn btn-primary" data-act="story-new">' + icon("plus") + t("Écrire ma première histoire") + "</button></div>";
    } else {
      h += '<ul class="story-list">' + list.map(s => {
        const c = E.storyCheck(s);
        const status = c.ready ? { tone: "good", label: "Prête" } : c.complete ? { tone: "warn", label: "Sans chiffre" } : { tone: "info", label: "À compléter" };
        const confirm = UI.confirm === "story:" + s.id;
        return '<li class="story-card' + (UI.storyEdit === s.id ? " is-editing" : "") + '"><div class="sc-main"><p class="sc-title">' + t(s.title || "Sans titre") + " " + pill(status) + "</p>" +
          (s.result ? '<p class="small sc-result">' + t(cut(s.result, 140)) + "</p>" : "") +
          ((s.themes || []).length ? '<div class="chips">' + s.themes.map(th => '<span class="chip">' + t(lab(D.themes, th)) + "</span>").join("") + "</div>" : "") +
          '<p class="muted small">' + t(c.words ? "≈ " + E.fmtDur(c.secs) + " à l'oral" : "Pas encore de texte") + "</p></div>" +
          '<div class="sc-actions"><button type="button" class="btn btn-line btn-sm" data-act="story-edit" data-arg="' + esc(s.id) + '">' + icon("edit") + t("Modifier") + "</button>" +
          '<button type="button" class="btn btn-quiet btn-sm" data-act="story-practice" data-arg="' + esc(s.id) + '">' + icon("video") + t("Raconter") + "</button>" +
          (confirm ? '<button type="button" class="btn btn-danger btn-sm" data-act="story-del" data-arg="' + esc(s.id) + '">' + t("Supprimer") + '</button><button type="button" class="btn btn-quiet btn-sm" data-act="confirm-cancel">' + t("Annuler") + "</button>"
            : '<button type="button" class="icon-btn" data-act="confirm" data-arg="story:' + esc(s.id) + '" aria-label="' + esc("Supprimer l'histoire " + (s.title || "")) + '">' + icon("trash") + "</button>") +
          "</div></li>";
      }).join("") + "</ul>";
    }
    return h;
  }

  /* ============================================================
     QUESTIONS DE RECRUTEUR
     ============================================================ */
  function forMe(S) {
    const app = cur(S);
    const w = new Set((app && app.worries) || []);
    const lvl = app && app.level, type = app && app.type;
    const set = new Set();
    D.questions.forEach(q => {
      if (q.core) set.add(q.id);
      if (q.worries && q.worries.some(x => w.has(x))) set.add(q.id);
      if (q.levels && lvl && q.levels.indexOf(lvl) >= 0 && lvl === "manager") set.add(q.id);
      if (q.types && (q.types.indexOf(type) >= 0 || w.has("technique"))) set.add(q.id);
      if (q.cat === "salaire" && (w.has("salaire") || type === "rh")) set.add(q.id);
    });
    return set;
  }
  function durTxt(ans) {
    const w = words(ans);
    if (!w) return "";
    const secs = Math.round((w / 130) * 60);
    return "≈ " + E.fmtDur(secs) + " à l'oral" + (secs > 120 ? " : c'est long, garde l'essentiel." : "");
  }
  function pqItem(q, S, UI) {
    const open = UI.pqOpen === q.id;
    const ready = !!(S.checks && S.checks["itwq:" + q.id]);
    const key = "itwq." + q.id;
    const ans = (S.notes || {})[key] || "";
    const head = '<button type="button" class="pq-head" aria-expanded="' + open + '" aria-controls="pq-' + q.id + '" data-act="pq-open" data-arg="' + q.id + '">' +
      '<span class="pq-q">' + t(q.q) + '</span><span class="pq-meta"><span class="tag tag-soft">' + t(lab(D.cats, q.cat)) + "</span>" + (q.papalia ? papTag() : "") + (ready ? pill({ tone: "good", label: "Prête" }) : "") + "</span>" +
      '<span class="pq-chev" aria-hidden="true">' + icon("right") + "</span></button>";
    if (!open) return '<li class="pq-item">' + head + "</li>";
    const lesson = q.lesson && E.LESSON[q.lesson];
    return '<li class="pq-item is-open">' + head + '<div class="pq-body" id="pq-' + q.id + '">' +
      '<dl class="pq-dl"><dt>' + t("Ce que le recruteur veut savoir") + "</dt><dd>" + t(q.intent) + "</dd><dt>" + t("Le piège") + "</dt><dd>" + t(q.trap) + "</dd><dt>" + t("Comment répondre") + "</dt><dd>" + t(q.how) + "</dd></dl>" +
      (q.ex ? '<div class="pq-ex"><p class="h-label">' + t("Exemple, à adapter") + '</p><p class="script">' + t(q.ex) + "</p></div>" : "") +
      field(key, "Tes idées clés", "Trois ou quatre points, pas un texte à réciter.", 4, ans) +
      '<p class="muted small" id="pq-dur-' + q.id + '">' + t(durTxt(ans)) + "</p>" +
      '<div class="row gap wrap"><button type="button" class="check check-inline' + (ready ? " is-on" : "") + '" role="checkbox" aria-checked="' + ready + '" data-act="check" data-arg="itwq:' + q.id + '"><span class="box" aria-hidden="true">' + icon("check") + "</span><span>" + t("Prête") + "</span></button>" +
      '<button type="button" class="btn btn-line btn-sm" data-act="pq-practice" data-arg="' + q.id + '">' + icon("video") + t("M'entraîner à l'oral") + "</button>" +
      (lesson ? '<button type="button" class="btn btn-quiet btn-sm" data-act="open-lesson" data-arg="' + q.lesson + '" data-from="itw">' + t("L'étape : " + lesson.title) + icon("right") + "</button>" : "") + "</div>" +
      (UI.ai ? coachPanel("pq-coach", (UI.pqCoach || {})[q.id], "L'avis du coach", "Le coach relit tes idées et propose une version orale de 80 à 120 mots.", "pq-coach-out-" + q.id, ans.trim().length < 20, q.id) : "") +
      "</div></li>";
  }
  function pieges(S, UI) {
    const mine = forMe(S);
    const filter = UI.pqFilter || "pourtoi";
    const Q = D.questions;
    const list = filter === "pourtoi" ? Q.filter(q => mine.has(q.id)) : filter === "toutes" ? Q : Q.filter(q => q.cat === filter);
    const readyN = Q.filter(q => S.checks && S.checks["itwq:" + q.id]).length;
    const custom = it(S).customQ || [];
    const chip = (id, label, n) => '<button type="button" role="radio" aria-checked="' + (filter === id) + '" class="chip chip-btn' + (filter === id ? " is-on" : "") + '" data-act="pq-filter" data-arg="' + id + '">' + t(label) + (n != null ? ' <span class="chip-n">' + n + "</span>" : "") + "</button>";
    return '<p class="lead">' + t("Pour chaque question : ce que le recruteur veut vraiment savoir, le piège, et la méthode. Note tes idées clés, pas un texte : Anna Papalia déconseille les réponses récitées.") + "</p>" +
      '<div class="progress-line"><div class="bar"><span style="width:' + Math.round((readyN / Q.length) * 100) + '%"></span></div><p class="small"><strong>' + readyN + "</strong> " + t("sur " + Q.length + " questions prêtes") + "</p></div>" +
      '<div class="chips scroll" role="radiogroup" aria-label="' + esc("Filtrer les questions") + '">' + chip("pourtoi", "Pour toi", mine.size) + chip("toutes", "Toutes", Q.length) +
      D.cats.map(c => { const n = Q.filter(q => q.cat === c.id).length; return n ? chip(c.id, c.label, n) : ""; }).join("") + "</div>" +
      '<ul class="pq-list">' + list.map(q => pqItem(q, S, UI)).join("") + "</ul>" +
      '<section class="panel"><h2 class="h-title">' + t("Tes propres questions") + '</h2><p class="muted small">' + t("Une question entendue en entretien, ou que tu redoutes ? Ajoute-la : elle entrera dans tes simulations.") + "</p>" +
      '<form class="row gap add-form" data-form="custom-q"><label class="sr" for="cq-new">' + t("Nouvelle question") + '</label><input id="cq-new" class="input" type="text" maxlength="200" placeholder="' + esc("Ex. : Pourquoi avoir choisi ce master ?") + '"><button type="submit" class="btn btn-line">' + icon("plus") + t("Ajouter") + "</button></form>" +
      (custom.length ? '<ul class="simple-list">' + custom.map((q, i) => '<li><span>' + t(q) + '</span><button type="button" class="icon-btn" data-act="cq-del" data-arg="' + i + '" aria-label="' + esc("Supprimer la question " + q) + '">' + icon("trash") + "</button></li>").join("") + "</ul>" : "") +
      "</section>";
  }

  /* ============================================================
     SIMULATEUR
     ============================================================ */
  function segBtns(values, cur, act, fmt, aria) {
    return '<div class="seg-choice" role="radiogroup" aria-label="' + esc(aria) + '">' + values.map(v => '<button type="button" role="radio" aria-checked="' + (v === cur) + '" class="' + (v === cur ? "is-on" : "") + '" data-act="' + act + '" data-arg="' + v + '">' + t(fmt(v)) + "</button>").join("") + "</div>";
  }
  function recentMocks(J) {
    const m = ((J && J.sessions) || []).filter(s => s.kind === "mock").slice(0, 3);
    if (!m.length) return "";
    return '<div class="panel slim"><p class="h-label">' + t("Tes dernières simulations") + '</p><ul class="simple-list">' + m.map(s =>
      "<li><span>" + t(fmtDay(new Date(s.at)) + " · " + (s.mode === "ia" ? "recruteur virtuel" : "roulette") + " · " + plural(s.n || 0, "question") + (s.score != null ? " · note " + s.score + "/10" : s.checksRate != null ? " · " + Math.round(s.checksRate * 100) + " %" : "")) + "</span></li>").join("") + "</ul></div>";
  }
  function simSetup(S, J, UI) {
    const c = UI.simCfg;
    const app = cur(S);
    const hasJd = !!(app && app.jdAI && (app.jdAI.questions || []).length);
    const mode = (k, title, desc, enabled) => '<button type="button" class="mode-card' + (c.mode === k ? " is-on" : "") + '" role="radio" aria-checked="' + (c.mode === k) + '" data-act="sim-mode" data-arg="' + k + '"' + (enabled ? "" : " disabled") + ">" +
      '<span class="mc-title">' + t(title) + '</span><span class="mc-desc">' + t(desc) + "</span></button>";
    return '<p class="lead">' + t("Mets-toi en situation : des questions que tu n'as pas choisies, un temps limité. Réponds à voix haute, comme en vrai.") + "</p>" +
      '<div class="mode-grid" role="radiogroup" aria-label="' + esc("Mode de simulation") + '">' +
      mode("roulette", "La roulette", "Des questions tirées au hasard, un temps de réflexion, un chrono. Tu t'évalues après chaque réponse.", true) +
      mode("ia", "Le recruteur virtuel", UI.ai ? "Le coach joue le recruteur : il relance si tu restes vague, puis t'évalue." : "Il a besoin du coach, qui n'est pas disponible ici.", UI.ai) + "</div>" +
      '<div class="field"><span class="h-label">' + t("Nombre de questions") + "</span>" + segBtns([5, 8, 12], c.n, "sim-n", v => v + " questions", "Nombre de questions") + "</div>" +
      (c.mode === "roulette"
        ? '<div class="field"><span class="h-label">' + t("Temps de réponse") + "</span>" + segBtns([60, 90, 120], c.time, "sim-time", v => E.fmtDur(v), "Temps de réponse") + "</div>"
        : '<div class="field"><span class="h-label">' + t("Ton recruteur") + "</span>" + segBtns(["bienveillant", "exigeant"], c.diff, "sim-diff", v => v === "exigeant" ? "Exigeant" : "Bienveillant", "Style du recruteur") + "</div>") +
      (hasJd ? '<button type="button" class="check check-inline' + (c.jd ? " is-on" : "") + '" role="checkbox" aria-checked="' + !!c.jd + '" data-act="sim-jd"><span class="box" aria-hidden="true">' + icon("check") + "</span><span>" + t("Inclure les questions tirées de ton offre") + "</span></button>" : "") +
      '<div class="tip">' + icon("video") + "<p>" + t(c.mode === "ia" ? "Avec le recruteur virtuel, tu réponds par écrit. Sur téléphone, la touche micro du clavier écrit ce que tu dis : tu parles vraiment, comme en entretien." : "Réponds à voix haute. Sur téléphone, le bouton « Filmer ma réponse » te permet de te revoir après chaque question.") + "</p></div>" +
      '<button type="button" class="btn btn-primary btn-lg" data-act="sim-start">' + icon("play") + t("Commencer la simulation") + "</button>" +
      recentMocks(J);
  }
  function simPhaseText(sm) {
    if (sm.step === "think") return "Respire. Pense à ta structure…";
    if (sm.step === "answer") return "À toi. Réponds à voix haute.";
    if (sm.step === "done") return "Temps écoulé. Coche ce que ta réponse contenait.";
    return "Prêt ? Cinq secondes pour respirer, puis " + E.fmtDur(sm.time) + " pour répondre.";
  }
  function simRun(S, UI) {
    const sm = UI.sim;
    const q = sm.list[sm.i];
    const libQ = q && D.questions.find(x => x.id === q.id);
    const catLabel = q.cat === "offre" ? "Tirée de ton offre" : q.cat === "perso" ? "Ta question" : lab(D.cats, q.cat);
    const checks = sm.checks[sm.i] || {};
    const clock = sm.step === "think" || sm.step === "answer" ? E.fmtClock(Math.ceil(sm.remaining)) : E.fmtClock(sm.time);
    return '<div class="sim-top"><span class="h-label">' + t("Question " + (sm.i + 1) + " sur " + sm.list.length) + '</span><span class="clock small-clock" id="sim-clock" role="timer">' + clock + "</span></div>" +
      '<div class="sim-dots" aria-hidden="true">' + sm.list.map((x, i) => '<span class="' + (i < sm.i ? "is-done" : i === sm.i ? "is-cur" : "") + '"></span>').join("") + "</div>" +
      '<div class="panel qa-card"><p><span class="tag tag-soft">' + t(catLabel) + "</span></p>" +
      '<p class="qa-q">' + t(q.q) + "</p>" +
      '<div class="bar"><span id="sim-bar" style="width:' + (sm.step === "answer" ? Math.round((1 - sm.remaining / sm.time) * 100) : sm.step === "done" ? 100 : 0) + '%"></span></div>' +
      '<p class="small" id="sim-phase" aria-live="polite">' + t(simPhaseText(sm)) + "</p>" +
      (sm.hint && libQ ? '<div class="pq-ex"><p class="h-label">' + t("Comment répondre") + "</p><p>" + t(libQ.how) + "</p></div>" : "") +
      '<div class="row gap wrap">' +
      (sm.step === "think" || sm.step === "answer" ? '<button type="button" class="btn btn-line" data-act="sim-stop">' + icon("stop") + t("Arrêter le chrono") + "</button>"
        : '<button type="button" class="btn btn-primary" data-act="sim-go">' + icon("play") + t(sm.step === "done" ? "Recommencer cette question" : "Lancer le chrono") + "</button>") +
      (libQ ? '<button type="button" class="btn btn-quiet" data-act="sim-hint">' + t(sm.hint ? "Masquer l'indice" : "Voir l'indice") + "</button>" : "") + "</div>" +
      takeBox(UI, "sim-" + sm.i, sm.time, "Filmer ma réponse") +
      '<p class="h-label sim-check-title">' + t("Ta réponse était…") + '</p><div class="chips" role="group" aria-label="' + esc("Auto-évaluation") + '">' +
      D.simChecks.map(([k, label]) => '<button type="button" class="chip chip-btn' + (checks[k] ? " is-on" : "") + '" aria-pressed="' + !!checks[k] + '" data-act="sim-check" data-arg="' + k + '">' + t(label) + "</button>").join("") + "</div></div>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-primary" data-act="sim-next">' + t(sm.i < sm.list.length - 1 ? "Question suivante" : "Voir mon bilan") + icon("right") + '</button><button type="button" class="btn btn-quiet" data-act="sim-finish">' + t("Terminer maintenant") + "</button></div>";
  }
  function simStats(sm) {
    const idx = sm.list.map((q, i) => i).filter(i => sm.answered[i] || Object.keys(sm.checks[i] || {}).some(k => sm.checks[i][k]));
    const rates = {};
    D.simChecks.forEach(([k]) => { rates[k] = idx.length ? idx.filter(i => (sm.checks[i] || {})[k]).length / idx.length : 0; });
    const avg = idx.length ? D.simChecks.reduce((a, [k]) => a + rates[k], 0) / D.simChecks.length : 0;
    let weakest = null;
    D.simChecks.forEach(([k]) => { if (weakest == null || rates[k] < rates[weakest]) weakest = k; });
    return { n: idx.length, rates, avg, weakest };
  }
  function simSummary(S, UI) {
    const sm = UI.sim;
    const st = simStats(sm);
    return '<section class="panel scorecard"><div class="sc-top"><div class="sc-note"><span class="sc-num">' + Math.round(st.avg * 100) + '</span><span class="sc-den">%</span></div>' +
      '<p class="sc-verdict">' + t(st.n ? "Auto-évaluation sur " + plural(st.n, "réponse") + "." : "Aucune réponse évaluée : coche ce que contenaient tes réponses pour obtenir un bilan.") + "</p></div>" +
      (st.n ? '<div class="style-bars">' + D.simChecks.map(([k, label]) => '<div class="sb-row"><span class="sb-label">' + t(label) + '</span><span class="sb-track" aria-hidden="true"><span style="width:' + Math.round(st.rates[k] * 100) + '%"></span></span><span class="sb-val">' + Math.round(st.rates[k] * 100) + " %</span></div>").join("") + "</div>" +
        '<div class="pq-ex"><p class="h-label">' + t("Ta priorité") + "</p><p>" + t(D.simAdvice[st.weakest]) + "</p></div>" : "") +
      "</section>" +
      '<div class="panel slim"><p class="h-label">' + t("Les questions de cette simulation") + '</p><ol class="take">' + sm.list.map((q, i) => {
        const tk = (UI.takes || {})["sim-" + i];
        return "<li>" + t(q.q) + (tk ? '<div class="take-mini">' + (tk.isVideo ? '<video src="' + esc(tk.url) + '" controls playsinline preload="none"></video>' : '<audio src="' + esc(tk.url) + '" controls preload="none"></audio>') + "</div>" : "") + "</li>";
      }).join("") + "</ol></div>" +
      '<div class="row gap wrap">' + (sm.saved ? '<span class="pill pill-good">' + t("Enregistrée dans ton journal") + "</span>" : '<button type="button" class="btn btn-primary" data-act="sim-save"' + (st.n ? "" : " disabled") + ">" + icon("check") + t("Enregistrer dans mon journal") + "</button>") +
      '<button type="button" class="btn btn-line" data-act="sim-reset">' + icon("reset") + t("Nouvelle simulation") + '</button><button type="button" class="btn btn-quiet" data-act="open-tool" data-arg="pieges">' + t("Retravailler mes réponses") + icon("right") + "</button></div>";
  }

  /* Recruteur virtuel */
  function chatLog(a) {
    const bubbles = a.msgs.map(m => '<div class="bubble ' + (m.who === "rec" ? "rec" : "me") + '"><span class="b-who">' + t(m.who === "rec" ? "Recruteur" : "Toi") + '</span><div class="b-text">' + t(m.text || "…").replace(/\n/g, "<br>") + "</div></div>").join("");
    const typing = a.status === "wait" && !a.streaming ? '<div class="bubble rec is-typing"><span class="b-who">' + t("Recruteur") + '</span><div class="b-text"><span class="dots" aria-hidden="true"></span>' + t("Le recruteur réfléchit…") + "</div></div>" : "";
    return bubbles + typing;
  }
  function answerEst(text) {
    const w = words(text);
    if (!w) return "";
    const secs = Math.round((w / 130) * 60);
    return "≈ " + E.fmtDur(secs) + " à l'oral" + (secs > 120 ? " : pense à couper" : "");
  }
  function scorecard(r) {
    const arr = a => Array.isArray(a) ? a.filter(x => x != null && String(typeof x === "object" ? JSON.stringify(x) : x).trim()) : [];
    const note = Math.max(1, Math.min(10, Math.round(Number(r.note) || 0)));
    const reps = arr(r.reponses).filter(x => typeof x === "object");
    const rw = r.reecriture && typeof r.reecriture === "object" ? r.reecriture : null;
    return '<section class="panel scorecard"><div class="sc-top"><div class="sc-note"><span class="sc-num">' + note + '</span><span class="sc-den">/10</span></div><p class="sc-verdict">' + t(String(r.verdict || "")) + "</p></div>" +
      '<div class="sc-cols"><div><p class="h-label">' + t("Tes points forts") + '</p><ul class="take">' + arr(r.forces).map(x => "<li>" + t(String(x)) + "</li>").join("") + "</ul></div>" +
      '<div><p class="h-label">' + t("Tes priorités") + '</p><ol class="take">' + arr(r.priorites).map(x => "<li>" + t(String(x)) + "</li>").join("") + "</ol></div></div>" +
      (reps.length ? '<div class="table-wrap"><table class="cmp"><thead><tr><th scope="col">' + t("Question") + '</th><th scope="col">' + t("Note") + '</th><th scope="col">' + t("Avis") + "</th></tr></thead><tbody>" +
        reps.map(x => "<tr><th scope=\"row\">" + t(String(x.question || "")) + "</th><td>" + esc(String(Math.max(1, Math.min(5, Math.round(Number(x.note) || 0))))) + "/5</td><td>" + t(String(x.avis || "")) + "</td></tr>").join("") + "</tbody></table></div>" : "") +
      (rw && rw.proposition ? '<div class="pq-ex"><p class="h-label">' + t("Une meilleure réponse à « " + String(rw.question || "ta réponse la plus faible") + " »") + '</p><p class="script">' + t(String(rw.proposition)) + "</p></div>" : "") +
      '<p class="muted small">' + t("Évaluation du coach, à prendre comme un avis : elle ne remplace pas le retour d'un vrai recruteur.") + "</p></section>";
  }
  function simaiRun(S, UI) {
    const a = UI.simai;
    const progress = a.phase === "run" ? "Question " + Math.max(1, Math.min(a.asked, a.target)) + " sur " + a.target : a.phase === "qa" ? "Tes questions au recruteur" : "Entretien terminé";
    let h = '<div class="sim-top"><span class="h-label">' + t("Recruteur virtuel · " + (a.diff === "exigeant" ? "exigeant" : "bienveillant")) + '</span><span class="muted small">' + t(progress) + "</span></div>" +
      '<div class="chat" id="simai-log" aria-live="polite">' + chatLog(a) + "</div>";
    if (a.status === "error") h += '<div class="notice is-error"><p>' + t(a.error || "Le recruteur n'a pas répondu.") + '</p><button type="button" class="btn btn-line btn-sm" data-act="simai-retry">' + icon("reset") + t("Réessayer") + "</button></div>";
    if (a.status === "wait") h += '<div class="row gap"><button type="button" class="btn btn-quiet btn-sm" data-act="simai-stop">' + icon("stop") + t("Arrêter") + "</button></div>";
    if ((a.phase === "run" || a.phase === "qa") && a.status !== "wait" && a.status !== "error" && a.msgs.length) {
      h += '<form class="chat-form" data-form="sim-answer"><label for="sim-ans" class="h-label">' + t(a.phase === "qa" ? "Tes questions au recruteur" : "Ta réponse") + "</label>" +
        '<textarea id="sim-ans" class="input" rows="5" placeholder="' + esc(a.phase === "qa" ? "Pose-lui deux ou trois questions…" : "Réponds comme à l'oral. Sur téléphone, utilise le micro du clavier.") + '">' + esc(a.draft || "") + "</textarea>" +
        '<p class="muted small" id="sim-ans-est">' + t(answerEst(a.draft || "")) + "</p>" +
        '<div class="row gap wrap"><button type="submit" class="btn btn-primary">' + icon("send") + t("Envoyer") + "</button>" +
        (a.phase === "run" ? '<button type="button" class="btn btn-quiet" data-act="simai-skip">' + t("Passer cette question") + "</button>" : "") +
        '<button type="button" class="btn btn-quiet" data-act="simai-end">' + t("Terminer l'entretien") + "</button></div></form>";
    }
    if (a.phase === "ended") {
      if (a.evalRes) {
        h += scorecard(a.evalRes) + '<div class="row gap wrap">' + (a.saved ? '<span class="pill pill-good">' + t("Enregistrée dans ton journal") + "</span>" : '<button type="button" class="btn btn-primary" data-act="simai-save">' + icon("check") + t("Enregistrer dans mon journal") + "</button>") +
          '<button type="button" class="btn btn-line" data-act="sim-reset">' + icon("reset") + t("Nouvelle simulation") + "</button></div>";
      } else if (a.evalStatus === "wait") {
        h += '<div class="coach-out is-wait" aria-live="polite"><span class="dots" aria-hidden="true"></span>' + t("Le coach relit l'entretien…") + "</div>";
      } else {
        h += (a.evalStatus === "error" ? '<div class="notice is-error"><p>' + t(a.evalError || "L'évaluation n'a pas abouti.") + "</p></div>" : "") +
          '<div class="row gap wrap"><button type="button" class="btn btn-primary" data-act="simai-eval"' + (a.msgs.some(m => m.who === "me") ? "" : " disabled") + ">" + icon("star") + t(a.evalStatus === "error" ? "Réessayer l'évaluation" : "Obtenir mon évaluation") + "</button>" +
          '<button type="button" class="btn btn-quiet" data-act="sim-reset">' + t("Nouvelle simulation") + "</button></div>";
      }
    }
    return h;
  }
  function simulateur(S, J, UI) {
    if (UI.sim) return UI.sim.phase === "summary" ? simSummary(S, UI) : simRun(S, UI);
    if (UI.simai && UI.simai.phase !== "setup") return simaiRun(S, UI);
    return simSetup(S, J, UI);
  }

  /* ============================================================
     QUESTIONS À POSER
     ============================================================ */
  function askList(S) {
    const sel = new Set(it(S).ask || []);
    const all = [];
    D.toAsk.forEach(g => g.items.forEach(x => { if (sel.has(x.id)) all.push(x.q); }));
    return all.concat(it(S).askCustom || []);
  }
  function aposer(S, UI) {
    const sel = new Set(it(S).ask || []);
    const custom = it(S).askCustom || [];
    const chosen = askList(S);
    return '<p class="lead">' + t("Pour Anna Papalia, un entretien va dans les deux sens. Pose tes questions au fil de l'échange, pas seulement à la fin : l'entretien devient une conversation, et tu parais préparé.") + "</p>" +
      '<section class="panel"><div class="panel-head"><h2 class="h-title">' + t("Ta liste") + '</h2><span class="muted small">' + t(plural(chosen.length, "question")) + "</span></div>" +
      (chosen.length ? '<ol class="take ask-chosen">' + chosen.map(q => "<li>" + t(q) + "</li>").join("") + '</ol><button type="button" class="btn btn-line btn-sm" data-act="ask-copy">' + icon("copy") + t("Copier ma liste") + "</button>"
        : '<p class="muted">' + t("Choisis tes questions ci-dessous : vise quatre ou cinq, dont deux à glisser pendant l'entretien.") + "</p>") + "</section>" +
      D.toAsk.map(g => '<h2 class="h-section h-sm">' + t(g.label) + '</h2><ul class="checks">' + g.items.map(x => {
        const on = sel.has(x.id);
        return '<li><button type="button" class="check' + (on ? " is-on" : "") + '" role="checkbox" aria-checked="' + on + '" data-act="ask-toggle" data-arg="' + x.id + '"><span class="box" aria-hidden="true">' + icon("check") + '</span><span class="ask-text"><span class="ask-q">' + t(x.q) + "</span>" + (x.papalia ? " " + papTag() : "") + (x.note ? '<span class="ask-note">' + t(x.note) + "</span>" : "") + "</span></button></li>";
      }).join("") + "</ul>").join("") +
      '<h2 class="h-section h-sm">' + t("Tes propres questions") + "</h2>" +
      '<form class="row gap add-form" data-form="ask-add"><label class="sr" for="ask-new">' + t("Ta question") + '</label><input id="ask-new" class="input" type="text" maxlength="200" placeholder="' + esc("Une question liée à ton enquête sur l'entreprise") + '"><button type="submit" class="btn btn-line">' + icon("plus") + t("Ajouter") + "</button></form>" +
      (custom.length ? '<ul class="simple-list">' + custom.map((q, i) => "<li><span>" + t(q) + '</span><button type="button" class="icon-btn" data-act="ask-del" data-arg="' + i + '" aria-label="' + esc("Supprimer la question " + q) + '">' + icon("trash") + "</button></li>").join("") + "</ul>" : "") +
      '<section class="panel slim"><p class="h-label">' + t("Pour conclure") + '</p><ul class="take">' +
      ["Redis ton intérêt pour le poste en une phrase.", "Demande les prochaines étapes et le calendrier.", "Demande où ce poste peut mener quelqu'un qui réussit.", "Si tu es en discussion ailleurs, dis-le, sans nommer les entreprises."].map(x => "<li>" + t(x) + "</li>").join("") + "</ul></section>" +
      '<section class="panel avoid"><h2 class="h-title">' + t("À éviter") + '</h2><ul class="avoid-list">' + D.avoid.map(a => '<li><span class="av-q">' + t(a[0]) + '</span><span class="av-why">' + t(a[1]) + "</span></li>").join("") + "</ul>" +
      '<p class="muted small">' + t("Liste inspirée d'une vidéo d'Anna Papalia, adaptée en français.") + "</p></section>";
  }

  /* ============================================================
     SALAIRE ET OFFRE
     ============================================================ */
  function salaryScripts(S) {
    const app = cur(S) || {};
    const c = E.salaryCalc(app.salary || {});
    const range = c.ask ? "entre " + E.fmtNum(c.ask.lo, c.ask.lo % 1 ? 1 : 0) + " et " + kEur(c.ask.hi) + " brut annuel" : "entre [ton objectif] et [ton objectif + 10 %] k€ brut annuel";
    return [
      { title: "On te demande tes prétentions", papalia: true, text: "Avant de parler chiffres, j'aimerais connaître la fourchette prévue pour ce poste. Quelle est-elle ?" },
      { title: "On insiste", papalia: true, text: "Vous avez certainement une fourchette pour ce poste : pouvez-vous me la donner ? Cela nous évitera de perdre du temps, à vous comme à moi." },
      { title: "La fourchette te convient", papalia: true, text: "Cette fourchette me convient." },
      { title: "On refuse de te répondre", papalia: true, text: "Ce poste m'intéresse vraiment. Je préfère qu'on parle de rémunération quand j'en saurai plus sur le rôle et ses responsabilités." },
      { title: "Tu dois donner un chiffre", text: "D'après mes recherches pour ce type de poste, je vise " + range + ", selon le périmètre et l'ensemble de la rémunération." },
      { title: "On te demande ton salaire actuel", papalia: true, text: "Je préfère qu'on parte de la rémunération prévue pour ce poste : quelle est votre fourchette ?" }
    ];
  }
  function offerScripts(S) {
    const app = cur(S) || {};
    const c = E.salaryCalc(app.salary || {});
    return [
      { title: "Quand l'offre arrive", papalia: true, text: "Merci beaucoup, cette proposition me fait vraiment plaisir. Puis-je vous donner ma réponse d'ici [jeudi] ?" },
      { title: "La question simple", papalia: true, text: "Est-ce que cette offre est négociable ?" },
      { title: "Ta contre-proposition", text: "Le poste me plaît beaucoup. Au vu de [mon expérience en …] et des salaires du marché pour ce poste, pourriez-vous aller jusqu'à " + (c.counter ? kEur(c.counter) : "[ton chiffre] k€") + " brut annuel ?" },
      { title: "La question calibrée", voss: true, text: "Comment pourrions-nous nous rapprocher de " + (c.target ? kEur(c.target) : "[ton objectif]") + " ?" },
      { title: "Si le fixe est bloqué", text: "Je comprends. Pouvons-nous regarder d'autres éléments : [le variable, le télétravail, une prime d'arrivée, la date d'arrivée] ?" }
    ];
  }
  function scriptsHtml(list, prefix) {
    return '<div class="scripts">' + list.map((s, i) => '<div class="script-card"><div class="sc-head"><p class="h-label">' + t(s.title) + "</p>" +
      (s.papalia ? papTag() : s.voss ? '<span class="tag tag-soft">' + t("D'après Chris Voss") + "</span>" : "") + "</div>" +
      '<p class="script">' + t(s.text) + '</p><button type="button" class="btn btn-quiet btn-sm" data-act="script-copy" data-arg="' + prefix + ":" + i + '">' + icon("copy") + t("Copier") + "</button></div>").join("") + "</div>";
  }
  function salaireLive(S) {
    const app = cur(S) || {};
    const c = E.salaryCalc(app.salary || {});
    let h = "";
    const vals = [c.low, c.high, c.target, c.floor, c.ask && c.ask.hi].filter(v => v);
    if (vals.length) {
      const min = Math.min.apply(null, vals) * 0.9, max = Math.max.apply(null, vals) * 1.06;
      const pos = v => Math.max(0, Math.min(100, ((v - min) / Math.max(1e-6, max - min)) * 100));
      const desc = [c.low && c.high ? "marché de " + kEur(c.low) + " à " + kEur(c.high) : null, c.target ? "objectif " + kEur(c.target) : null, c.floor ? "plancher " + kEur(c.floor) : null].filter(Boolean).join(", ");
      h += '<div class="sal-bar" role="img" aria-label="' + esc(desc) + '">' +
        (c.low && c.high && c.high >= c.low ? '<span class="sb-market" style="left:' + pos(c.low).toFixed(1) + "%;width:" + (pos(c.high) - pos(c.low)).toFixed(1) + '%"></span>' : "") +
        (c.ask ? '<span class="sb-ask" style="left:' + pos(c.ask.lo).toFixed(1) + "%;width:" + Math.max(1, pos(c.ask.hi) - pos(c.ask.lo)).toFixed(1) + '%"></span>' : "") +
        (c.floor ? '<span class="sb-mark sb-floor" style="left:' + pos(c.floor).toFixed(1) + '%"></span>' : "") +
        (c.target ? '<span class="sb-mark sb-target" style="left:' + pos(c.target).toFixed(1) + '%"></span>' : "") + "</div>" +
        '<ul class="legend">' +
        (c.low && c.high ? '<li><span class="lg lg-market"></span>' + t("le marché : " + kEur(c.low) + " à " + kEur(c.high)) + "</li>" : "") +
        (c.ask ? '<li><span class="lg lg-ask"></span>' + t("à annoncer si on insiste : " + E.fmtNum(c.ask.lo, c.ask.lo % 1 ? 1 : 0) + " à " + kEur(c.ask.hi)) + "</li>" : "") +
        (c.target ? '<li><span class="lg lg-target"></span>' + t("ton objectif : " + kEur(c.target)) + "</li>" : "") +
        (c.floor ? '<li><span class="lg lg-floor"></span>' + t("ton plancher : " + kEur(c.floor)) + "</li>" : "") + "</ul>";
      if (c.target) {
        h += '<p class="small">' + t("Ton objectif représente environ ") + "<strong>" + t(euros(c.net(c.target)) + " net par mois") + "</strong>" + t(" avant impôt" + (c.floor ? " ; ton plancher, environ " + euros(c.net(c.floor)) + "." : ".")) + "</p>" +
          '<p class="muted small">' + t("Estimation : environ 78 % du brut, sur 12 mois. Le montant exact dépend de ta mutuelle, de ta prévoyance et de ton statut.") + "</p>";
      }
      if (c.warn.length) h += '<ul class="warn-list">' + c.warn.map(w => "<li>" + t(w) + "</li>").join("") + "</ul>";
      if (c.converted) h += '<p class="muted small">' + t("Les montants saisis en euros sont lus en k€ : 48000 compte pour 48.") + "</p>";
    } else {
      h += '<p class="muted small">' + t("Remplis tes chiffres : la barre et les phrases se mettent à jour.") + "</p>";
    }
    h += '<h3 class="h-label scripts-title">' + t("Tes phrases") + "</h3>" + scriptsHtml(salaryScripts(S), "s");
    return h;
  }
  function offerLive(S) {
    const app = cur(S) || {};
    const c = E.salaryCalc(app.salary || {});
    let h = "";
    if (c.offer) {
      const vs = c.target ? Math.round(((c.offer - c.target) / c.target) * 100) : null;
      h += '<p class="small">' + t("L'offre : " + kEur(c.offer) + ", soit environ " + euros(c.net(c.offer)) + " net par mois.") + (vs != null ? " " + t(vs === 0 ? "C'est ton objectif." : vs > 0 ? "C'est " + vs + " % au-dessus de ton objectif." : "C'est " + Math.abs(vs) + " % sous ton objectif.") : "") + "</p>" +
        (c.counter ? '<p class="small">' + t("Une contre-proposition raisonnable : ") + "<strong>" + t(kEur(c.counter)) + "</strong>" + t(", soit environ 7 % au-dessus de l'offre, sans descendre sous ton objectif. Appuie-la sur le marché et ton expérience.") + "</p>" : "");
      if (c.floor && c.offer < c.floor) h += '<ul class="warn-list"><li>' + t("L'offre est sous ton plancher.") + "</li></ul>";
    }
    h += scriptsHtml(offerScripts(S), "o");
    return h;
  }
  function salaire(S, UI) {
    const app = cur(S) || {};
    const sal = app.salary || {};
    const levers = sal.levers || [];
    const inp = (k, label, ph) => '<div class="field"><label for="sal-' + k + '">' + t(label) + '</label><div class="input-unit"><input id="sal-' + k + '" class="input" type="text" inputmode="decimal" data-sal="' + k + '" value="' + esc(sal[k] || "") + '" placeholder="' + esc(ph) + '"><span class="unit">' + t("k€ brut / an") + "</span></div></div>";
    return '<p class="lead">' + t("La règle d'Anna Papalia : ne donne pas ton chiffre en premier, demande la fourchette du poste. Prépare quand même tes chiffres : en France, la question arrive souvent dès le premier appel.") + "</p>" +
      '<section class="panel"><h2 class="h-title">' + t("Tes chiffres") + '</h2><p class="muted small">' + t("Pour la fourchette du marché : les annonces de postes comparables qui affichent un salaire, les études de rémunération (l'Apec pour les cadres), ton réseau.") + "</p>" +
      '<div class="sal-grid">' + inp("low", "Marché, bas", "Ex. : 42") + inp("high", "Marché, haut", "Ex. : 52") + inp("target", "Ton objectif", "Ex. : 48") + inp("floor", "Ton plancher", "Ex. : 44") + "</div>" +
      '<p class="muted small">' + t("Ton plancher : en dessous, tu dis non. Ne l'annonce jamais.") + "</p>" +
      '<div id="sal-live">' + salaireLive(S) + "</div></section>" +
      '<aside class="panel slim info-box"><p class="h-label">' + t("Transparence salariale : où en est la France ?") + '</p><p class="small">' +
      t("La directive européenne 2023/970 prévoit que l'employeur indique la rémunération ou sa fourchette avant l'entretien, et lui interdit de demander ton salaire actuel ou passé. Les États avaient jusqu'au 7 juin 2026 pour l'appliquer. En France, le projet de loi a été déposé au Sénat le 10 septembre 2026 : ces règles ne s'appliquent pas encore. Vérifie où en est le texte avant ton entretien.") + "</p></aside>" +
      '<section class="panel"><h2 class="h-title">' + t("L'offre") + '</h2><p class="muted small">' + t("Anna Papalia conseille de ne jamais accepter une offre sur-le-champ : les entreprises commencent rarement par leur meilleure proposition.") + "</p>" +
      '<div class="sal-grid sal-one">' + inp("offer", "Offre reçue", "Ex. : 46") + "</div>" +
      '<div id="sal-offer-live">' + offerLive(S) + "</div>" +
      '<h3 class="h-label scripts-title">' + t("Si le fixe est bloqué, négocie autre chose") + '</h3><ul class="checks">' + D.levers.map((x, i) => {
        const on = levers.indexOf(i) >= 0;
        return '<li><button type="button" class="check' + (on ? " is-on" : "") + '" role="checkbox" aria-checked="' + on + '" data-act="sal-lever" data-arg="' + i + '"><span class="box" aria-hidden="true">' + icon("check") + "</span><span>" + t(x) + "</span></button></li>";
      }).join("") + "</ul>" +
      '<p class="muted small">' + t("Une fois d'accord, demande l'offre par écrit avant de démissionner.") + "</p></section>";
  }

  /* ============================================================
     REMERCIEMENT ET RELANCE
     ============================================================ */
  function merciText(S) {
    const app = cur(S) || {};
    const m = app.merci || {};
    const name = String(m.name || "").trim();
    const parts = name.split(/\s+/).filter(Boolean);
    let greet = "Bonjour,";
    if (name) {
      if (m.civ === "prenom") greet = "Bonjour " + parts[0] + ",";
      else greet = "Bonjour " + (m.civ === "monsieur" ? "Monsieur" : "Madame") + " " + parts[parts.length - 1] + ",";
    }
    const when = m.when === "hier" ? "hier" : "aujourd'hui";
    const role = app.role || "[poste]";
    const company = app.company || "[entreprise]";
    const sign = String(m.sign || (S.profile && S.profile.name) || "").trim() || "[Prénom Nom]";
    const lines = [greet, ""];
    let first = "Merci pour le temps que vous m'avez accordé " + when + " pour le poste de " + role + ".";
    if (m.moment && String(m.moment).trim()) first += " J'ai particulièrement apprécié " + endDot(lcFirst(String(m.moment).trim()));
    lines.push(first);
    if (m.lien && String(m.lien).trim()) lines.push("", endDot(ucFirst(String(m.lien).trim())));
    lines.push("", "Notre échange confirme mon envie de rejoindre " + company + ". Pourriez-vous me dire quelles sont les prochaines étapes ?");
    if (m.oubli && String(m.oubli).trim()) lines.push("", "Un point que je n'ai pas eu le temps d'évoquer : " + endDot(lcFirst(String(m.oubli).trim())));
    lines.push("", "Bien cordialement,", sign);
    return { subject: "Merci pour notre échange : " + role, body: lines.join("\n") };
  }
  function merciLive(S) {
    const mt = merciText(S);
    return '<p class="h-label">' + t("Ton mail") + '</p><div class="email"><p class="email-subj"><span>' + t("Objet") + "</span> " + t(mt.subject) + '</p><div class="email-body">' + mt.body.split("\n").map(l => l ? "<p>" + t(l) + "</p>" : '<p class="gap-line"></p>').join("") + "</div></div>" +
      '<div class="row gap"><button type="button" class="btn btn-primary btn-sm" data-act="merci-copy">' + icon("copy") + t("Copier le mail") + "</button></div>";
  }
  function relanceText(S) {
    const app = cur(S) || {};
    const m = app.merci || {};
    const name = String(m.name || "").trim();
    const parts = name.split(/\s+/).filter(Boolean);
    const greet = !name ? "Bonjour," : m.civ === "prenom" ? "Bonjour " + parts[0] + "," : "Bonjour " + (m.civ === "monsieur" ? "Monsieur" : "Madame") + " " + parts[parts.length - 1] + ",";
    const d = app.date ? E.parseDay(app.date) : null;
    let dateTxt = "récemment";
    if (d) { try { dateTxt = "le " + new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" }).format(d); } catch (e) { dateTxt = "récemment"; } }
    const sign = String(m.sign || (S.profile && S.profile.name) || "").trim() || "[Prénom Nom]";
    return [greet, "", "Je me permets de revenir vers vous au sujet du poste de " + (app.role || "[poste]") + ", dont nous avons parlé " + dateTxt + ". Ce poste m'intéresse toujours beaucoup : avez-vous des nouvelles sur la suite du processus ?", "", "Bien cordialement,", sign].join("\n");
  }
  function apres(S, UI) {
    const app = cur(S) || {};
    const m = app.merci || {};
    const inp = (k, label, ph, area) => '<div class="field"><label for="me-' + k + '">' + t(label) + "</label>" +
      (area ? '<textarea id="me-' + k + '" class="input" rows="2" data-merci="' + k + '" placeholder="' + esc(ph) + '">' + esc(m[k] || "") + "</textarea>"
        : '<input id="me-' + k + '" class="input" type="text" data-merci="' + k + '" value="' + esc(m[k] || "") + '" placeholder="' + esc(ph) + '">') + "</div>";
    const seg = (key, list, aria, def) => '<div class="seg-choice" role="radiogroup" aria-label="' + esc(aria) + '">' + list.map(([v, l]) => { const on = (m[key] || def) === v; return '<button type="button" role="radio" aria-checked="' + on + '" class="' + (on ? "is-on" : "") + '" data-act="merci-pick" data-field="' + key + '" data-arg="' + v + '">' + t(l) + "</button>"; }).join("") + "</div>";
    const ready = !!(m.moment && String(m.moment).trim());
    return '<p class="lead">' + t("Anna Papalia conseille de l'envoyer le jour même, en trois parties : merci et un moment précis de l'échange, un point abordé relié à ta compétence, ton intérêt et la suite. En bonus : ce que tu as oublié de dire.") + "</p>" +
      '<div class="two-col"><div class="col-main">' +
      inp("name", "Ton interlocuteur", "Ex. : Claire Martin") +
      '<div class="field"><span class="h-label">' + t("Formule") + "</span>" + seg("civ", [["madame", "Madame"], ["monsieur", "Monsieur"], ["prenom", "Par le prénom"]], "Formule d'appel", "madame") + "</div>" +
      '<div class="field"><span class="h-label">' + t("L'entretien a eu lieu") + "</span>" + seg("when", [["aujourdhui", "Aujourd'hui"], ["hier", "Hier"]], "Date de l'entretien", "aujourdhui") + "</div>" +
      inp("moment", "Un moment précis de l'échange", "Ex. : votre présentation du projet d'entrepôt automatisé", true) +
      inp("lien", "Un point abordé, relié à ta compétence", "Ex. : J'ai déjà conduit la migration d'un entrepôt vers un nouveau logiciel de gestion, et j'aimerais beaucoup y contribuer.", true) +
      inp("oubli", "Ce que tu as oublié de dire (facultatif)", "Ex. : j'ai aussi la certification CACES 3", true) +
      inp("sign", "Ta signature", "Prénom Nom") +
      '</div><div class="col-side"><div class="panel" id="merci-live">' + merciLive(S) + "</div>" +
      (UI.ai ? coachPanel("merci-coach", UI.merciCoach, "Rendre le mail plus naturel", "Le coach reformule ton brouillon en 120 mots au plus, sans rien inventer.", "merci-coach-out", !ready) : "") +
      "</div></div>" +
      '<section class="panel"><h2 class="h-title">' + t("La relance") + "</h2><p>" + t("Anna Papalia conseille de ne rien faire après le mail de remerciement : relancer donne l'air pressé. En France, une relance courtoise, une seule, quelques jours après la date annoncée, reste courante. Dans tous les cas, continue tes autres candidatures jusqu'à ce que tu aies signé.") + "</p>" +
      '<div class="script-card"><div class="sc-head"><p class="h-label">' + t("Si tu relances") + '</p></div><div class="email-body">' + relanceText(S).split("\n").map(l => l ? "<p>" + t(l) + "</p>" : '<p class="gap-line"></p>').join("") + "</div>" +
      '<button type="button" class="btn btn-quiet btn-sm" data-act="script-copy" data-arg="r:0">' + icon("copy") + t("Copier") + "</button></div></section>" +
      '<section class="panel"><h2 class="h-title">' + t("Lire les signaux") + '</h2><div class="two-lists"><div><p class="h-label">' + t("Plutôt bon signe") + '</p><ul class="take">' + D.signals.good.map(x => "<li>" + t(x) + "</li>").join("") + "</ul></div>" +
      '<div><p class="h-label">' + t("Plutôt mauvais signe") + '</p><ul class="take">' + D.signals.bad.map(x => "<li>" + t(x) + "</li>").join("") + "</ul></div></div>" +
      '<p class="muted small">' + t("D'après Anna Papalia. Des indices, pas des certitudes : un recruteur pressé n'est pas forcément un recruteur déçu.") + "</p>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-line btn-sm" data-act="open-lesson" data-arg="e-signaux" data-from="itw">' + t("Écrire mon débrief") + icon("right") + '</button><button type="button" class="btn btn-quiet btn-sm" data-act="open-tool" data-arg="candidatures">' + t("Mettre à jour ma candidature") + icon("right") + "</button></div></section>";
  }

  /* ============================================================
     CANDIDATURES
     ============================================================ */
  function candidatures(S, UI) {
    const I = it(S);
    const apps = (I.apps || []).slice().sort((a, b) => {
      const da = a.date || "9999", db = b.date || "9999";
      return da < db ? -1 : da > db ? 1 : (b.createdAt || 0) - (a.createdAt || 0);
    });
    const closed = new Set(["acceptee", "refus", "abandon"]);
    const open = apps.filter(a => !closed.has(a.stage));
    const upcoming = apps.filter(a => { const d = E.itwDays(a); return d != null && d >= 0; });
    const offers = apps.filter(a => a.stage === "offre" || a.stage === "acceptee");
    let h = '<p class="lead">' + t("Toutes tes candidatures au même endroit. Anna Papalia le répète : ne mets jamais ta recherche en pause tant que tu n'as pas signé une offre avec une date d'arrivée.") + "</p>" +
      '<div class="stats stats-3">' + stat(String(open.length), "en cours") + stat(String(upcoming.length), upcoming.length > 1 ? "entretiens à venir" : "entretien à venir") + stat(String(offers.length), offers.length > 1 ? "offres" : "offre") + "</div>" +
      '<div class="row gap"><button type="button" class="btn btn-primary" data-act="fiche-new">' + icon("plus") + t("Ajouter une candidature") + "</button></div>";
    if (!apps.length) return h + '<div class="panel empty"><p class="h-title">' + t("Aucune candidature pour l'instant") + '</p><p class="muted">' + t("Ajoute ton prochain entretien : le programme s'y adaptera.") + "</p></div>";
    const today = new Date();
    h += '<ul class="app-list">' + apps.map(a => {
      const isCur = a.id === I.current;
      const d = E.itwDays(a);
      const when = whenLabel(d);
      const meta = [dateLabel(a), when && d >= 0 ? when : null, lab(D.types, a.type)].filter(Boolean).join(" · ");
      const nd = a.nextDate ? E.parseDay(a.nextDate) : null;
      const overdue = nd && E.daysUntil(a.nextDate, today) < 0 && !closed.has(a.stage);
      const stg = D.stages.find(s => s.id === a.stage) || D.stages[1];
      const confirm = UI.confirm === "app:" + a.id;
      return '<li class="app-card' + (isCur ? " is-current" : "") + '"><div class="ac-main"><p class="ac-title">' + t((a.role || "Poste à préciser") + (a.company ? " · " + a.company : "")) + " " + '<span class="pill pill-' + stg.tone + '">' + t(stg.label) + "</span></p>" +
        (meta ? '<p class="muted small">' + t(meta) + "</p>" : "") +
        (a.next ? '<p class="small">' + t("Prochaine action : " + a.next + (nd ? " · " + fmtDay(nd) : "")) + (overdue ? " " + pill({ tone: "warn", label: "En retard" }) : "") + "</p>" : "") + "</div>" +
        '<div class="ac-side"><label class="sr" for="stage-' + esc(a.id) + '">' + t("Étape de la candidature") + '</label><select id="stage-' + esc(a.id) + '" class="input input-sm" data-change="app-stage" data-id="' + esc(a.id) + '">' +
        D.stages.map(s => '<option value="' + s.id + '"' + (a.stage === s.id ? " selected" : "") + ">" + esc(s.label) + "</option>").join("") + "</select>" +
        '<div class="row gap">' + (isCur ? '<span class="pill pill-accent">' + t("En préparation") + "</span>" : '<button type="button" class="btn btn-line btn-sm" data-act="app-prepare" data-arg="' + esc(a.id) + '">' + t("Préparer") + "</button>") +
        '<button type="button" class="btn btn-quiet btn-sm" data-act="app-edit" data-arg="' + esc(a.id) + '">' + icon("edit") + t("Modifier") + "</button>" +
        (confirm ? '<button type="button" class="btn btn-danger btn-sm" data-act="app-del" data-arg="' + esc(a.id) + '">' + t("Supprimer") + '</button><button type="button" class="btn btn-quiet btn-sm" data-act="confirm-cancel">' + t("Annuler") + "</button>"
          : '<button type="button" class="icon-btn" data-act="confirm" data-arg="app:' + esc(a.id) + '" aria-label="' + esc("Supprimer la candidature " + (a.role || "")) + '">' + icon("trash") + "</button>") +
        "</div></div></li>";
    }).join("") + "</ul>";
    return h;
  }

  /* ============================================================ */
  function tool(id, S, J, UI) {
    switch (id) {
      case "style": return style(S, UI);
      case "offre": return offre(S, UI);
      case "pitch": return pitch(S, UI);
      case "histoires": return histoires(S, UI);
      case "pieges": return pieges(S, UI);
      case "simulateur": return simulateur(S, J, UI);
      case "aposer": return aposer(S, UI);
      case "salaire": return salaire(S, UI);
      case "apres": return apres(S, UI);
      case "candidatures": return candidatures(S, UI);
    }
    return "";
  }

  return {
    hub, fiche, tool, jdLocal, pitchLive, pitchText, storyLint, salaireLive, offerLive, salaryScripts, offerScripts,
    merciText, merciLive, relanceText, askList, chatLog, answerEst, durTxt, scorecard, simStats, dateLabel, credit
  };
})();
</script>
<script>/* ============================================================
   LA GÉNÉRALE · application (DOM, stockage, coach, audio)
   ============================================================ */
(() => {
  "use strict";

    for (let c = 0; c < ch; c++) { const d = ab.getChannelData(c); for (let i = 0; i < n; i++) out[i] += d[i] / ch; }
    return out;
  }
  async function runAnalysis(samples, sr, st, token) {
    st.status = "analyzing"; st.progress = 0.1;
    renderStatus();
    let res = null;
    try {
      res = await E.analyze(samples, sr, p => { if (token === st.token) { st.progress = p; updateProg(); } });
    } catch (e) { res = null; }
    if (token !== st.token || UI.studio !== st) return;
    if (!res) { st.status = "error"; st.error = "L'analyse a échoué sur ce fichier. Essaie un autre format ou un enregistrement plus court."; renderStatus(); return; }
    st.result = res;
    st.status = "done";
    if (st.transcript) st.text = E.analyzeText(st.transcript, res.ok ? res.active : chronoElapsed(st.timer));
    if (res.ok) { S.lastRecs = E.recommend(res, st.text); saveSession(true); }
    renderStatus();

  /* Analyse en temps réel, si le fichier ne se décode pas */
  function closeLive() {
    const st = UI.studio;
    if (!st) return;
    if (st.status === "live") st.status = "need-live";
    if (st.liveStop) { const f = st.liveStop; st.liveStop = null; f(); }
    if (st.liveCtx) { try { st.liveCtx.close(); } catch (e) { /* rien */ } }
    st.liveCtx = null; st.liveGain = null; st.liveProc = null;
  }
  async function liveCapture() {
    const st = UI.studio;
    const media = $("#st-media");
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!st || !media || !AC) { st.status = "error"; st.error = "Ce navigateur ne permet pas cette analyse."; renderStatus(); return; }
    const token = st.token;
    try {
      if (!st.liveCtx) {
        const ctx = new AC();
        const src = ctx.createMediaElementSource(media);
        const gain = ctx.createGain();
        src.connect(gain); gain.connect(ctx.destination);
        const proc = ctx.createScriptProcessor(4096, 1, 1);
        src.connect(proc); proc.connect(ctx.destination);
        st.liveCtx = ctx; st.liveGain = gain; st.liveProc = proc;
      }
      await st.liveCtx.resume();
    } catch (e) {
      st.status = "error"; st.error = "Ce fichier ne peut pas être analysé ici. Essaie un enregistrement audio (M4A ou MP3)."; renderStatus(); return;
    }
    const chunks = [];
    st.liveProc.onaudioprocess = ev => { if (!media.paused && !media.ended) chunks.push(new Float32Array(ev.inputBuffer.getChannelData(0))); };
    st.status = "live"; st.progress = 0; renderStatus();
    media.muted = false; st.liveGain.gain.value = 1;
    try { media.currentTime = 0; await media.play(); }
    catch (e) { st.status = "need-live"; renderStatus(); return; }
    const onTime = () => { st.progress = media.duration ? media.currentTime / media.duration : 0; updateProg(); };
    media.addEventListener("timeupdate", onTime);
    await new Promise(res => { st.liveStop = res; media.addEventListener("ended", () => res(), { once: true }); });
    st.liveStop = null;
    media.removeEventListener("timeupdate", onTime);
    if (st.liveProc) st.liveProc.onaudioprocess = null;
    media.pause();
    if (token !== st.token || UI.studio !== st || !st.liveCtx) return;
    const n = chunks.reduce((a, c) => a + c.length, 0);
    if (n < st.liveCtx.sampleRate * 2) { st.status = "need-live"; renderStatus(); return; }
    const all = new Float32Array(n);
    let o = 0;
    chunks.forEach(c => { all.set(c, o); o += c.length; });
    await runAnalysis(all, st.liveCtx.sampleRate, st, token);
  }

  function drawScore(canvas, r) {
    if (!canvas || !r) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = canvas.clientWidth || 600, h = canvas.clientHeight || 200;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const g = canvas.getContext("2d");
    if (!g) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const cs = getComputedStyle(document.documentElement);
    const C = n => (cs.getPropertyValue(n) || "").trim() || "#888";
    const font = getComputedStyle(document.body).fontFamily || "sans-serif";
    const padL = 8, padR = 8, padT = 14, padB = 24;
    const T = Math.max(1, r.duration);
    const X = tt => padL + (tt / T) * (w - padL - padR);
    const top = padT, bottom = h - padB, mid = (top + bottom) / 2, half = (bottom - top) / 2;
    const R = 9;
    const Y = v => mid - (Math.max(-R, Math.min(R, v)) / R) * half;

    (r.monotone || []).forEach(m => {
      const x0 = X(m[0]), x1 = Math.max(X(m[0]) + 2, X(m[1]));
      g.save();
      g.globalAlpha = 0.14; g.fillStyle = C("--warn"); g.fillRect(x0, top, x1 - x0, bottom - top);
      g.beginPath(); g.rect(x0, top, x1 - x0, bottom - top); g.clip();
      g.globalAlpha = 0.32; g.strokeStyle = C("--warn"); g.lineWidth = 1; g.beginPath();
      for (let x = x0 - (bottom - top); x < x1; x += 7) { g.moveTo(x, bottom); g.lineTo(x + (bottom - top), top); }
      g.stroke(); g.restore();
    });

    g.strokeStyle = C("--line"); g.lineWidth = 1;
    [-8, -4, 0, 4, 8].forEach(v => { const y = Math.round(Y(v)) + 0.5; g.beginPath(); g.moveTo(padL, y); g.lineTo(w - padR, y); g.stroke(); });

    if (r.env && r.env.length) {
      g.save(); g.globalAlpha = 0.55; g.fillStyle = C("--line"); g.beginPath(); g.moveTo(X(0), bottom);
      r.env.forEach(p => g.lineTo(X(p[0]), bottom - p[1] * 16));
      g.lineTo(X(T), bottom); g.closePath(); g.fill(); g.restore();
    }

    g.font = "600 11px " + font;
    g.textAlign = "center";
    (r.pauses || []).forEach(p => {
      const cx = X(p[0] + p[1] / 2);
      const long = p[1] >= 2;
      g.fillStyle = long ? C("--warn") : C("--ink-2");
      g.fillRect(Math.round(cx - 5), Math.round(Y(0)) - 5, 10, 5);
      if (p[1] >= 1 && (w / T) * p[1] > 22) g.fillText(E.fmtNum(p[1], 1) + " s", cx, Y(0) - 9);
    });

    g.strokeStyle = C("--accent"); g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath();
    let prev = null;
    (r.pitch || []).forEach(p => {
      const x = X(p[0]), y = Y(p[1]);
      if (prev && p[0] - prev[0] < 0.07) g.lineTo(x, y); else { g.moveTo(x, y); g.lineTo(x + 0.6, y); }
      prev = p;
    });
    g.stroke();

    g.fillStyle = C("--ink-3"); g.font = "11px " + font;
    const step = T <= 30 ? 5 : T <= 90 ? 15 : T <= 300 ? 30 : 60;
    for (let s = 0; s <= T + 0.01; s += step) g.fillText(E.fmtClock(s), Math.min(w - 16, Math.max(16, X(s))), h - 6);
  }
  const DEMO = (() => {
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const duration = 40;
    const pauses = [[6.2, 0.9], [13.8, 1.4], [21.1, 0.8], [31.6, 2.2]];
    const monotone = [[22.4, 29.6]];
    const inPause = tt => pauses.some(p => tt >= p[0] && tt < p[0] + p[1]);
    const pitch = [], env = [];
    for (let tt = 0.4; tt < 39.4; tt += 0.03) {
      if (inPause(tt) || Math.sin(tt * 29) > 0.86) continue;
      const k = pauses.filter(p => p[0] < tt).length;
      const start = k ? pauses[k - 1][0] + pauses[k - 1][1] : 0.4;
      const loc = tt - start;
      let v;
      if (tt >= 22.4 && tt <= 29.6) v = -0.8 + 0.4 * Math.sin(tt * 7) + (rnd() - 0.5) * 0.5;
      else v = 3.4 * Math.sin(loc * 1.6 + k * 1.3) - loc * 0.32 + 1.4 + (rnd() - 0.5) * 0.9;
      pitch.push([+tt.toFixed(2), +Math.max(-8.5, Math.min(8.5, v)).toFixed(2)]);
    }
    for (let i = 0; i <= 400; i++) {
      const tt = i * 0.1;
      env.push([tt, inPause(tt) || tt < 0.4 || tt > 39.4 ? 0.04 : 0.42 + 0.34 * Math.abs(Math.sin(tt * 5.1)) - (tt > 22.4 && tt < 29.6 ? 0.12 : 0)]);
    }
    return { duration, pitch, env, pauses, monotone };
  })();
