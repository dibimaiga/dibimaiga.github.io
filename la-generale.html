    return f === "tics" || f === "pauses" || (S.profile && (S.profile.challenges || []).indexOf("tics") >= 0);
  }

  function studioPlayer(S, J, UI) {
    const st = UI.studio;
    if (!st.file) return "";
    const v = st.file.isVideo;
    const pass = (k, ic, label) => '<button type="button" class="pass-btn' + (st.pass === k ? " is-on" : "") + '" data-act="st-pass" data-arg="' + k + '" aria-pressed="' + (st.pass === k) + '">' + icon(ic) + "<span>" + t(label) + "</span></button>";
    const media = v
      ? '<div class="media-box"><video id="st-media" src="' + esc(st.file.url) + '" controls playsinline preload="metadata"></video><div class="cover" id="st-cover" hidden>' + icon("headphones") + "<span>" + t("Image cachée : écoute seulement ta voix") + "</span></div></div>"
      : '<div class="media-box is-audio"><audio id="st-media" src="' + esc(st.file.url) + '" controls preload="metadata"></audio></div>';
    return '<div class="panel player">' +
      '<div class="panel-head"><h2 class="h-title">' + icon(v ? "eye" : "headphones") + t(v ? "Revois-toi" : "Réécoute-toi") + '</h2><button type="button" class="btn btn-quiet btn-sm" data-act="st-new">' + icon("reset") + t("Recommencer") + "</button></div>" +
      media +
      (v ? '<div class="pass-row" role="group" aria-labelledby="pass-l"><p class="muted small" id="pass-l">' + t("Revois-toi une deuxième fois autrement :") + '</p><div class="pass-btns">' + pass("son", "headphones", "Le son seul") + pass("image", "eye", "L'image seule") + "</div></div>" : "") +
      (wantsTics(S, st) ? ticBox(st) : "") +
      '<div id="st-status">' + studioStatus(UI) + "</div></div>";
  }
  function progressBlock(label, p) {
    return '<div class="progress" role="status"><span class="small">' + t(label) + '</span><div class="bar"><span id="st-prog" style="width:' + Math.round((p || 0) * 100) + '%"></span></div></div>';
  }

  /* Après l'analyse : ce qu'on a remarqué, un conseil, la suite */
  function studioResults(S, J, UI) {
    const st = UI.studio;
    const r = st.result;
    if (!r) return "";
    if (!r.ok) {
      const msg = r.reason === "short"
        ? "Ton enregistrement dure moins de 3 secondes. Recommence en parlant au moins 20 secondes."
        : "On n'entend pas ta voix sur cet enregistrement. Vérifie que le son n'est pas coupé, rapproche-toi du téléphone, puis recommence.";
      return '<div class="panel verdict is-error"><p class="verdict-title">' + t("L'analyse n'a pas pu se faire") + "</p><p>" + t(msg) + '</p><button type="button" class="btn btn-primary" data-act="st-new">' + icon("reset") + t("Recommencer") + "</button></div>";
    }
    return '<div id="st-verdict">' + studioVerdict(S, J, UI) + "</div>" +
      '<div id="st-coach">' + studioCoach(S, J, UI) + "</div>" +
      '<div id="st-save">' + recEnd(S, J, UI) + "</div>" +
      recDetails(S, J, UI);
  }
  function studioVerdict(S, J, UI) {
    const st = UI.studio;
    const r = st.result;
    if (!r || !r.ok) return "";
    const ctx = st.ctx || {};
    const F = E.findings(r, { target: ctx.target || (st.timer && st.timer.target), manualTics: st.manualTics, text: st.text });
    const base = baselineOf(J);
    const since = base && ctx.kind !== "baseline" && base.id !== st.savedId
      ? E.compare(base, sessionFromStudio(UI)).filter(x => x.diff !== 0 && x.tone !== "info").sort((a, b) => (a.tone === "good" ? 0 : 1) - (b.tone === "good" ? 0 : 1)).slice(0, 3)
      : [];
    let h = '<section class="panel verdict" aria-labelledby="verdict-t">' +
      '<p class="h-label">' + t("Ce qu'on a remarqué") + "</p>" +
      '<h2 class="verdict-title" id="verdict-t">' + t(F.verdict) + "</h2>" +
      '<p class="verdict-sub">' + t(F.dur) + "</p>" +
      '<ul class="findings">' + F.list.map(f => '<li class="finding is-' + f.tone + '"><span class="f-mark" aria-hidden="true">' + icon(f.tone === "good" ? "check" : "alert") + "</span>" +
        '<div class="f-body"><p class="f-title">' + t(f.title) + '<span class="sr">' + t(f.tone === "good" ? " : point fort." : " : à travailler.") + '</span></p><p class="f-text">' + t(f.text) + "</p></div></li>").join("") + "</ul>";
    if (F.advice) {
      const al = F.advice.lesson && L[F.advice.lesson];
      h += '<div class="advice"><span class="advice-ic" aria-hidden="true">' + icon("lamp") + '</span><div><p class="h-label">' + t("Ton conseil pour la prochaine fois") + '</p><p class="advice-text">' + t(F.advice.tip) + "</p>" +
        (al && F.advice.lesson !== ctx.lessonId ? '<button type="button" class="btn btn-line btn-sm" data-act="open-lesson" data-arg="' + F.advice.lesson + '">' + t("L'exercice : " + al.title) + icon("right") + "</button>" : "") + "</div></div>";
    }
    if (since.length) {
      h += '<div class="since"><p class="h-label">' + t("Depuis ton point de départ") + '</p><ul class="since-list">' + since.map(x => '<li class="is-' + x.tone + '"><span>' + t(x.label) + '</span><span class="since-v">' + esc(x.a) + " → <strong>" + esc(x.b) + "</strong>" + (x.tone === "good" ? " " + icon("check") : "") + "</span></li>").join("") + "</ul></div>";
    }
    return h + "</section>";
  }

  /* Ce qui est gardé, et le bouton pour la suite */
  function recEnd(S, J, UI) {
    const st = UI.studio;
    const ctx = st.ctx || {};
    const inLesson = ctx.lessonId && UI.view === "lesson";
    const lessonDone = ctx.lessonId && S.done && S.done[ctx.lessonId];
    let h = '<div class="rec-end">';
    if (st.result && st.result.ok) {
      h += st.savedId
        ? '<p class="saved-line">' + icon("check") + t(ctx.kind === "baseline" ? "Gardé dans tes progrès comme point de départ." : "Gardé dans tes progrès.") + ' <button type="button" class="link" data-act="st-unsave">' + t("Ne pas le garder") + "</button></p>"
        : '<p class="saved-line is-off">' + t("Cet essai n'est pas gardé.") + ' <button type="button" class="link" data-act="st-save">' + t("Le garder dans mes progrès") + "</button></p>";
    }
    h += '<div class="row gap wrap">';
    if (inLesson && !lessonDone) h += '<button type="button" class="btn btn-primary btn-lg" data-act="done-lesson" data-arg="' + ctx.lessonId + '">' + icon("check") + t("Valider cette étape") + "</button>";
    else if (ctx.lessonId && UI.view !== "lesson") h += '<button type="button" class="btn btn-primary" data-act="open-lesson" data-arg="' + ctx.lessonId + '">' + t("Retour à l'étape") + icon("right") + "</button>";
    else if (ctx.back) h += '<button type="button" class="btn btn-primary" data-act="' + esc(ctx.back.act) + '" data-arg="' + esc(ctx.back.arg) + '">' + t(ctx.back.label) + icon("right") + "</button>";
    h += '<button type="button" class="btn btn-line" data-act="st-new">' + icon("reset") + t("Recommencer") + "</button>";
    if (!ctx.lessonId && !ctx.back) h += '<button type="button" class="btn btn-quiet" data-act="nav" data-arg="progress">' + t("Voir mes progrès") + icon("right") + "</button>";
    return h + "</div></div>";
  }

  /* Pour les curieux : la partition, les chiffres, l'auto-évaluation */
  function recDetails(S, J, UI) {
    const st = UI.studio;
    const r = st.result;
    const tx = st.text;
    let h = '<details class="more" id="rec-more"' + (UI.recMore ? " open" : "") + "><summary>" + t("Pour aller plus loin : le détail de l'analyse") + "</summary>";
    if (r && r.ok) {
      const base = baselineOf(J);
      const tiles = [];
      tiles.push(metric("Durée de parole", E.fmtDur(r.active), null, "du premier au dernier mot"));
      tiles.push(metric("Variation de la voix", r.melodySd != null ? "± " + E.fmtNum(r.melodySd, 1) + " ½ ton" : "–", E.judge("melody", r.melodySd), "plus c'est haut, plus c'est vivant"));
      tiles.push(metric("Pauses", E.fmtNum(r.pausesPerMin, 1) + " /min", E.judge("pauses", r.pausesPerMin), r.pauseCount + " pause" + (r.pauseCount > 1 ? "s" : "") + ", la plus longue " + E.fmtNum(r.longestPause, 1) + " s"));
      tiles.push(metric("Variation du volume", r.dyn != null ? E.fmtNum(r.dyn, 1) + " dB" : "–", E.judge("dyn", r.dyn), "écart entre fort et doux"));
      if (tx && tx.wpm) tiles.push(metric("Débit", tx.wpm + " mots/min", E.judge("wpm", tx.wpm), "d'après le texte ajouté"));
      else tiles.push(metric("Rythme estimé", r.syl != null ? E.fmtNum(r.syl, 1) + " syll./s" : "–", null, base && base.syl && r.syl ? relDiff(r.syl, base.syl) + " par rapport à ton départ" : "syllabes par seconde"));
      h += '<div class="detail-block"><p class="h-label">' + t("La partition de ta voix") + '</p><p class="muted small">' + t("La ligne suit la hauteur de ta voix. Les petits traits sont tes pauses, les zones hachurées les passages plats. Touche la partition pour réécouter ce moment.") + "</p>" +
        '<div class="score-wrap" id="st-score-wrap"><canvas id="st-score" class="score-canvas" role="img" aria-label="' + esc("Partition de ta voix : hauteur, pauses et passages monotones") + '"></canvas><span class="playhead" id="st-playhead" hidden></span></div>' +
        '<ul class="legend"><li><span class="lg lg-line"></span>' + t("hauteur de la voix") + '</li><li><span class="lg lg-rest"></span>' + t("pause") + '</li><li><span class="lg lg-mono"></span>' + t("passage plat") + (r.monotone.length ? " × " + r.monotone.length : "") + "</li></ul>" +
        '<div class="metrics">' + tiles.join("") + "</div>" +
        (base && st.ctx && st.ctx.kind !== "baseline" && base.id !== st.savedId ? compareTable(base, sessionFromStudio(UI), "Point de départ", "Cet essai") : "") +
        '<p class="muted small">' + t("Mesures automatiques et indicatives : elles dépendent du micro et de la pièce. Compare tes essais entre eux plutôt qu'à une norme.") + "</p></div>";
    }
    h += '<div id="st-review">' + studioReview(S, J, UI) + "</div></details>";
    return h;
  }
  function relDiff(v, ref) {
    const p = Math.round(((v - ref) / ref) * 100);
    return (p > 0 ? "+" : "") + p + " %";
  }
  function metric(label, value, judge, note) {
    return '<div class="metric"><p class="m-label">' + t(label) + '</p><p class="m-value">' + t(value) + "</p>" + (judge ? pill(judge) : "") + (note ? '<p class="m-note">' + t(note) + "</p>" : "") + "</div>";
  }

  function studioReview(S, J, UI) {
    const st = UI.studio;
    const rate = (key, label) => {
      const v = st.self[key] || 0;
      return '<div class="rate"><span class="rate-label" id="rl-' + key + '">' + t(label) + '</span><div class="rate-btns" role="radiogroup" aria-labelledby="rl-' + key + '">' +
        [1, 2, 3, 4, 5].map(n => '<button type="button" role="radio" aria-checked="' + (v === n) + '" class="' + (v === n ? "is-on" : "") + '" data-act="st-rate" data-arg="' + key + ":" + n + '">' + n + "</button>").join("") + "</div></div>";
    };
    const tx = st.text;
    let textBlock = "";
    if (tx) {
      const fill = Object.keys(tx.fillers).map(k => '<span class="chip">' + t("« " + k + " » × " + tx.fillers[k]) + "</span>").join("");
      const hedge = Object.keys(tx.hedges).map(k => '<span class="chip chip-warn">' + t("« " + k + " » × " + tx.hedges[k]) + "</span>").join("");
      textBlock = '<div class="text-stats">' +
        '<p class="small"><strong>' + tx.words + "</strong> " + t("mots") + (tx.wpm ? " · <strong>" + tx.wpm + "</strong> " + t("mots par minute") + " " + pill(E.judge("wpm", tx.wpm)) : "") + (tx.avgSentence ? " · " + t("phrases de " + tx.avgSentence + " mots en moyenne") : "") + "</p>" +
        '<p class="h-label">' + t("Tics repérés") + "</p>" + (fill ? '<div class="chips">' + fill + "</div>" : '<p class="muted small">' + t("Aucun tic courant dans le texte.") + "</p>") +
        '<p class="h-label">' + t("Mots qui affaiblissent (à vérifier)") + "</p>" + (hedge ? '<div class="chips">' + hedge + "</div>" : '<p class="muted small">' + t("Aucun adoucisseur repéré.") + "</p>") +
        "</div>";
    }
    return '<div class="detail-block"><p class="h-label">' + t("Note-toi toi-même (facultatif)") + '</p><p class="muted small">' + t("De 1 (à revoir) à 5 (très bien). Ça t'aide à voir ce que tu ressens au fil des essais.") + "</p>" +
      '<div class="rates">' +
      '<div class="rate-group"><p class="h-label">' + t("Voix") + "</p>" + rate("debit", "Débit") + rate("volume", "Volume") + rate("melodie", "Mélodie") + "</div>" +
      '<div class="rate-group"><p class="h-label">' + t("Corps") + "</p>" + rate("posture", "Posture") + rate("gestes", "Gestes") + rate("regard", "Regard") + "</div>" +
      '<div class="rate-group"><p class="h-label">' + t("Fond") + "</p>" + rate("clarte", "Clarté") + rate("structure", "Structure") + "</div>" +
      "</div></div>" +
      (wantsTics(S, st) ? "" : '<div class="detail-block">' + ticBox(st) + "</div>") +
      '<div class="detail-block"><div class="field"><label for="st-transcript">' + t("Le texte de ton enregistrement (facultatif)") + '</label><p class="muted small">' + t("Colle-le ici pour compter tes mots par minute et tes tics de langage. Sur iPhone, le Dictaphone sait transcrire ; sur Android, l'app Enregistreur aussi.") + '</p><textarea id="st-transcript" class="input script-input" rows="4" data-change="st-transcript" placeholder="' + esc("Colle ou tape ici ce que tu as dit") + '">' + esc(st.transcript || "") + "</textarea></div>" +
      '<div id="st-text">' + textBlock + "</div></div>" +
      '<div class="detail-block"><div class="field"><label for="st-note">' + t("Ce que je garde, ce que je change") + '</label><textarea id="st-note" class="input" rows="2" data-change="st-note" placeholder="' + esc("Ex. : bonne ouverture ; je ralentis sur les chiffres la prochaine fois") + '">' + esc(st.note || "") + "</textarea></div></div>";
  }

  function studioCoach(S, J, UI) {
    const st = UI.studio;
    if (!UI.ai || !st.result || !st.result.ok) return "";
    return '<div class="panel coach slim"><div class="coach-head"><div><p class="h-title">' + icon("chat") + t("Un avis personnalisé") + '</p><p class="muted small">' + t("Le coach lit les mesures de ton essai (jamais ta vidéo) et te donne trois conseils concrets.") + "</p></div>" +
      '<div class="row gap"><button type="button" class="btn btn-line" data-act="st-coach"' + (st.coach.status !== "wait" ? "" : " disabled") + ">" + t(st.coach.status === "done" ? "Redemander" : "Demander au coach") + "</button>" +
      (st.coach.status === "wait" ? '<button type="button" class="btn btn-quiet" data-act="st-coach-stop">' + t("Arrêter") + "</button>" : "") + "</div></div>" +
      '<div id="st-coach-out">' + coachBlock(st.coach) + "</div></div>";
  }

  /* Ancien nom conservé : la zone « garder et continuer » */
  function studioSave(S, J, UI) { return recEnd(S, J, UI); }

  /* La séance telle qu'elle serait gardée (pour comparaison et sauvegarde) */
  function sessionFromStudio(UI) {
    const st = UI.studio;
    const r = st.result && st.result.ok ? st.result : null;
    const tx = st.text;
    const dur = r ? r.active : (st.timer ? st.timer.elapsed : 0);
    const manual = st.manualTics || 0;
    const fillTotal = (tx ? tx.fillerTotal : 0) + manual;
    return {
      kind: (st.ctx && st.ctx.kind) || "practice",
      lessonId: (st.ctx && st.ctx.lessonId) || null,
      duration: Math.round(dur),
      melodySd: r ? r.melodySd : null,
      monoCount: r ? r.monotone.length : null,
      dyn: r ? r.dyn : null,
      pausesPerMin: r ? r.pausesPerMin : null,
      longestPause: r ? r.longestPause : null,
      syl: r ? r.syl : null,
      speechRatio: r ? r.speechRatio : null,
      wpm: tx ? tx.wpm : null,
      fillerTotal: (tx || manual) ? fillTotal : null,
      fillersPerMin: (tx || manual) && dur > 0 ? +(fillTotal / (dur / 60)).toFixed(1) : null,
      hedgeTotal: tx ? tx.hedgeTotal : null,
      manualTics: manual
    };
  }

  /* Filmer sa réponse dans un exercice chronométré (téléphone) */
  function takeBox(UI, key, limit, label) {
    const dev = UI.dev || {};
    const tk = (UI.takes || {})[key];
    const input = '<input id="take-' + key + '" class="rec-input" type="file" accept="video/*" capture="user" data-change="take" data-take="' + key + '">';
    if (!tk) {
      if (!dev.phone) return "";
      return '<label class="btn btn-line take-btn" for="take-' + key + '">' + icon("video") + "<span>" + t(label || "Filmer ma réponse") + "</span>" + input + "</label>";
    }
    let dur = "";
    if (tk.dur) {
      dur = E.fmtDur(tk.dur);
      if (limit) dur += tk.dur <= limit + 5 ? " · dans le temps" : " · un peu long (limite : " + E.fmtDur(limit) + ")";
    }
    return '<div class="take-box"><p class="take-head"><span class="h-label">' + t("Ta réponse filmée") + "</span>" + (dur ? '<span class="take-dur">' + t(dur) + "</span>" : "") + "</p>" +
      (tk.isVideo ? '<video src="' + esc(tk.url) + '" controls playsinline preload="metadata"></video>' : '<audio src="' + esc(tk.url) + '" controls preload="metadata"></audio>') +
      '<label class="btn btn-quiet btn-sm take-btn" for="take-' + key + '">' + icon("reset") + "<span>" + t("Refaire") + "</span>" + input + "</label></div>";
  }

  /* ============================================================
     OUTILS
     ============================================================ */
  const TOOLS = {
    conduite: { label: "Ma conduite", icon: "script", open: "Écrire ma conduite", desc: "Écris ta structure, obtiens ta carte mémo et ta durée estimée." },
    questions: { label: "Questions difficiles", icon: "question", open: "M'entraîner aux questions", desc: "Entraîne-toi à répondre en 45 secondes, avec étiquette et miroir." },
    respiration: { label: "Respiration", icon: "wind", open: "Faire l'exercice de respiration", desc: "Soupir cyclique, cohérence cardiaque ou respiration carrée." },
    impro: { label: "Impro", icon: "dice", open: "Lancer une impro", desc: "Un sujet surprise, un temps de préparation, une minute pour parler." },
    compteur: { label: "Compteur de tics", icon: "plus", open: "Ouvrir le compteur de tics", desc: "Un proche compte tes « euh » pendant que tu parles." },
    echelle: { label: "Échelle d'exposition", icon: "ladder", open: "Ouvrir mon échelle", desc: "Des petites marches pour apprivoiser le trac." },
    style: { group: "itw", label: "Ton style d'entretien", icon: "compass", open: "Faire le questionnaire", desc: "Huit questions pour connaître ton style, sa force et son piège." },
    offre: { group: "itw", label: "Décoder l'offre", icon: "target", open: "Décoder l'offre", desc: "Les exigences clés de l'offre, et une preuve pour chacune." },
    pitch: { group: "itw", label: "« Parlez-moi de vous »", icon: "user", open: "Écrire mon pitch", desc: "Passé, présent, futur : ton pitch, chronométré." },
    histoires: { group: "itw", label: "Banque d'histoires", icon: "stack", open: "Ouvrir ma banque d'histoires", desc: "Tes situations vécues en STAR, prêtes à raconter." },
    pieges: { group: "itw", label: "Questions de recruteur", icon: "question", open: "Préparer mes réponses", desc: "45 questions, ce qu'elles testent et comment y répondre." },
    simulateur: { group: "itw", label: "Simulateur d'entretien", icon: "people", open: "Lancer une simulation", desc: "Roulette de questions ou recruteur virtuel, avec évaluation." },
    aposer: { group: "itw", label: "Questions à poser", icon: "list", open: "Choisir mes questions", desc: "Celles qui font bonne impression, et celles à éviter." },
    salaire: { group: "itw", label: "Salaire et offre", icon: "coins", open: "Préparer le salaire", desc: "Ta fourchette, tes phrases pour en parler, ta négociation." },
    apres: { group: "itw", label: "Remerciement et relance", icon: "mail", open: "Écrire mon remerciement", desc: "Ton mail de remerciement, prêt à copier, et la suite." },
    candidatures: { group: "itw", label: "Mes candidatures", icon: "briefcase", open: "Voir mes candidatures", desc: "Tes entretiens, leurs étapes et tes prochaines actions." }
  };
  function toolCard(k, status) {
    const T = TOOLS[k];
    return '<button type="button" class="tool-card" data-act="open-tool" data-arg="' + k + '"><span class="tool-ic">' + icon(T.icon) + '</span><span class="tool-name">' + t(T.label) + '</span><span class="tool-desc">' + t(T.desc) + "</span>" + (status ? '<span class="tool-status">' + t(status) + "</span>" : "") + "</button>";
  }
  function tools(S, UI) {
    const keys = g => Object.keys(TOOLS).filter(k => (TOOLS[k].group || "parole") === g);
    return '<section class="tools"><p class="kicker"><span class="tape tape-e" aria-hidden="true"></span>' + t("Coulisses") + '</p><h1 class="h-display">' + t("Exercices") + "</h1>" +
      '<p class="lead">' + t("Des exercices courts, à faire quand tu veux, en plus de ton parcours.") + "</p>" +
      '<h2 class="h-section">' + t("Prise de parole") + '</h2><div class="tool-grid">' + keys("parole").map(k => toolCard(k)).join("") + "</div>" +
      '<div class="section-head"><h2 class="h-section">' + t("Entretiens d'embauche") + '</h2><button type="button" class="btn btn-quiet" data-act="nav" data-arg="itw">' + t("Ouvrir l'espace Entretiens") + icon("right") + "</button></div>" +
      '<div class="tool-grid">' + keys("itw").map(k => toolCard(k)).join("") + "</div></section>";
  }

  function tool(S, J, UI) {
    const id = UI.toolId;
    const T = TOOLS[id];
    if (!T) return tools(S, UI);
    const isItwTool = T.group === "itw";
    const backTo = UI.toolBack || (isItwTool ? "itw" : "tools");
    const backBtn = UI.fromLesson ? back("open-lesson", UI.fromLesson, "Retour à l'étape") : back("nav", backTo, backTo === "itw" ? "Entretiens" : "Exercices");
    const head = backBtn + '<h1 class="h-display">' + t(T.label) + "</h1>";
    if (isItwTool) return '<section class="tool-page itw-tool">' + head + ItwViews.tool(id, S, J, UI) + "</section>";
    switch (id) {
      case "respiration": return '<section class="tool-page">' + head + breath(UI) + "</section>";
      case "conduite": return '<section class="tool-page">' + head + builder(S, UI) + "</section>";
      case "questions": return '<section class="tool-page">' + head + qa(S, UI) + "</section>";
      case "compteur": return '<section class="tool-page">' + head + counter(UI) + "</section>";
      case "echelle": return '<section class="tool-page">' + head + ladder(S) + "</section>";
      case "impro": return '<section class="tool-page">' + head + impro(UI) + "</section>";
    }
    return "";
  }

  function breath(UI) {
    const b = UI.breath;
    const modes = Object.keys(DATA.breath);
    const M = DATA.breath[b.mode];
    return '<p class="lead">' + t(M.hint) + "</p>" +
      '<div class="seg-choice" role="radiogroup" aria-label="' + esc("Exercice") + '">' + modes.map(k => '<button type="button" role="radio" aria-checked="' + (b.mode === k) + '" class="' + (b.mode === k ? "is-on" : "") + '" data-act="br-mode" data-arg="' + k + '"' + (b.running ? " disabled" : "") + ">" + t(DATA.breath[k].label) + "</button>").join("") + "</div>" +
      '<div class="breath-stage"><div class="orb" id="br-orb" style="transform:scale(' + (b.scale || 0.32) + ')"></div><div class="orb-ring" aria-hidden="true"></div>' +
      '<div class="breath-text"><span class="br-phase" id="br-phase" aria-live="polite">' + t(b.running ? b.phaseText : "Prêt ?") + '</span><span class="br-count" id="br-count">' + (b.running ? b.count : "") + "</span></div></div>" +
      '<div class="breath-foot"><div class="seg-choice small-seg" role="radiogroup" aria-label="' + esc("Durée") + '">' + [60, 120, 300].map(v => '<button type="button" role="radio" aria-checked="' + (b.total === v) + '" class="' + (b.total === v ? "is-on" : "") + '" data-act="br-dur" data-arg="' + v + '"' + (b.running ? " disabled" : "") + ">" + t(E.fmtDur(v)) + "</button>").join("") + "</div>" +
      '<span class="muted" id="br-left">' + (b.running ? E.fmtClock(b.left) : "") + "</span>" +
      '<button type="button" class="btn btn-primary btn-lg" data-act="br-toggle">' + icon(b.running ? "stop" : "play") + t(b.running ? "Arrêter" : "Commencer") + "</button></div>";
  }

  function builderStats(S, sit) {
    const m = DATA.modules[sit] || DATA.modules.general;
    const vals = m.fields.map(f => ({ f, key: noteKey(f.id, sit), v: S.notes[noteKey(f.id, sit)] || "" }));
    const carte = S.notes.carte || "";
    const total = vals.reduce((a, x) => a + words(x.v), 0) + words(carte);
    return { m, vals, carte, total, secs: Math.round((total / 130) * 60), filled: vals.filter(x => x.v.trim()).length };
  }
  function builderLive(S, UI) {
    const bd = UI.builder;
    const { m, vals, carte, total, secs, filled } = builderStats(S, bd.sit);
    const out = bd.tab === "memo"
      ? '<div class="memo">' + vals.filter(x => x.v.trim()).map(x => '<div class="memo-item"><span class="memo-label">' + t(x.f.label.split(":")[0]) + '</span><span class="memo-text">' + t(cut(x.v, 90)) + "</span></div>").join("") + (filled ? "" : '<p class="muted">' + t("Ta carte mémo apparaîtra ici.") + "</p>") + "</div>"
      : '<div class="script-out">' + (filled || carte ? vals.map((x, i) => (x.v.trim() ? '<p class="sc-label">' + t(x.f.label) + '</p><p class="sc-text">' + t(x.v) + "</p>" : "") + (i === 0 && carte ? '<p class="sc-label">' + t("Annonce du plan") + '</p><p class="sc-text">' + t(carte) + "</p>" : "")).join("") : '<p class="muted">' + t("Ton plan apparaîtra ici au fur et à mesure.") + "</p>") + "</div>";
    return '<p class="muted small est">' + t(total ? "≈ " + E.fmtDur(secs) + " à un rythme posé (130 mots par minute) · " + total + " mots" : "Durée typique : " + m.minutes + " min") + "</p>" + out;
  }
  function builder(S, UI) {
    const bd = UI.builder;
    const sit = bd.sit;
    const { m, vals, total, filled } = builderStats(S, sit);
    return '<p class="lead">' + t(m.why) + "</p>" +
      '<div class="field"><span class="h-label" id="bd-sit-l">' + t("Situation") + '</span><div class="chips scroll" role="radiogroup" aria-labelledby="bd-sit-l">' + DATA.situations.map(s => '<button type="button" role="radio" aria-checked="' + (s.id === sit) + '" class="chip chip-btn' + (s.id === sit ? " is-on" : "") + '" data-act="bd-sit" data-arg="' + s.id + '">' + t(s.label) + "</button>").join("") + "</div></div>" +
      '<div class="builder">' +
      '<div class="builder-fields"><p class="h-label">' + t("Structure : " + m.name) + "</p>" +
      vals.map(x => field(x.key, x.f.label, x.f.ph, 2, x.v)).join("") + "</div>" +
      '<div class="builder-out"><div class="panel">' +
      '<div class="panel-head"><div class="seg-choice small-seg" role="tablist">' +
      '<button type="button" role="tab" aria-selected="' + (bd.tab !== "memo") + '" class="' + (bd.tab !== "memo" ? "is-on" : "") + '" data-act="bd-tab" data-arg="plan">' + t("Plan") + "</button>" +
      '<button type="button" role="tab" aria-selected="' + (bd.tab === "memo") + '" class="' + (bd.tab === "memo" ? "is-on" : "") + '" data-act="bd-tab" data-arg="memo">' + t("Carte mémo") + "</button></div></div>" +
      '<div id="bd-live">' + builderLive(S, UI) + "</div>" +
      '<div class="row gap wrap">' +
      '<button type="button" class="btn btn-line btn-sm" data-act="bd-copy">' + icon("copy") + t("Copier") + "</button>" +
      (UI.dl ? '<button type="button" class="btn btn-line btn-sm" data-act="bd-download">' + icon("download") + t("Télécharger (.md)") + "</button>" : "") +
      '<button type="button" class="btn btn-line btn-sm" id="bd-rehearse" data-act="bd-rehearse"' + (total ? "" : " disabled") + ">" + icon("mic") + t("Répéter ce plan") + "</button>" +
      "</div></div>" +
      (UI.ai ? '<div class="panel coach"><h2 class="h-title">' + t("Muscler mon plan") + '</h2><p class="muted small">' + t("Le coach resserre ta phrase clé, propose trois accroches et pointe le maillon faible. Il n'invente aucun chiffre.") + '</p><button type="button" class="btn btn-primary btn-sm" id="bd-coach-btn" data-act="bd-coach"' + (filled && bd.coach.status !== "wait" ? "" : " disabled") + ">" + icon("chat") + t("Demander au coach") + '</button><div id="bd-coach-out">' + coachBlock(bd.coach) + "</div></div>" : "") +
      "</div></div>";
  }
  function cut(s, n) {
    s = String(s).replace(/\s+/g, " ").trim();
    if (s.length <= n) return s;
    const c = s.slice(0, n);
    return c.slice(0, Math.max(c.lastIndexOf(" "), n - 15)) + "…";
  }
  function conduiteText(S, sit, asMd) {
    const m = DATA.modules[sit] || DATA.modules.general;
    const lines = [];
    lines.push(asMd ? "# Ma conduite · " + sitLabel(sit) : "MA CONDUITE · " + sitLabel(sit).toUpperCase());
    lines.push(asMd ? "_Structure : " + m.name + "_" : "Structure : " + m.name);
    lines.push("");
    m.fields.forEach((f, i) => {
      const v = (S.notes[noteKey(f.id, sit)] || "").trim();
      if (v) { lines.push(asMd ? "## " + f.label : f.label.toUpperCase()); lines.push(v); lines.push(""); }
      if (i === 0 && S.notes.carte) { lines.push(asMd ? "## Annonce du plan" : "ANNONCE DU PLAN"); lines.push(S.notes.carte.trim()); lines.push(""); }
    });
    return lines.join("\n");
  }

  function qa(S, UI) {
    const q = UI.qa;
    const list = q.list || [];
    const cur = list[q.i];
    const ph = q.phase;
    const sitBtns = DATA.situations.filter(s => s.id !== "general").map(s => '<button type="button" role="radio" aria-checked="' + (s.id === q.sit) + '" class="chip chip-btn' + (s.id === q.sit ? " is-on" : "") + '" data-act="qa-sit" data-arg="' + s.id + '">' + t(s.label) + "</button>").join("");
    const checks = [["etiquette", "Une étiquette"], ["miroir", "Un miroir"], ["pause", "Une pause avant de répondre"], ["temps", "Fini dans le temps"]];
    return '<p class="lead">' + t("Une question tombe. Accuse réception, respire, réponds en moins de 45 secondes.") + "</p>" +
      '<div class="field"><span class="h-label" id="qa-sit-l">' + t("Situation") + '</span><div class="chips scroll" role="radiogroup" aria-labelledby="qa-sit-l">' + sitBtns + "</div></div>" +
      (UI.ai ? '<div class="row gap wrap"><button type="button" class="btn btn-line btn-sm" data-act="qa-ai"' + (q.ai === "wait" ? " disabled" : "") + ">" + icon("chat") + t(q.ai === "wait" ? "Le coach prépare tes questions…" : "Questions sur mesure pour mon sujet") + "</button>" + (q.aiError ? '<span class="muted small">' + t(q.aiError) + "</span>" : "") + "</div>" : "") +
      '<div class="qa-card panel">' +
      '<div class="panel-head"><span class="h-label">' + t("Question " + (q.i + 1) + " sur " + list.length) + (q.source === "ai" ? " · " + t("sur mesure") : "") + '</span><span class="clock small-clock" id="qa-clock" role="timer">' + (ph === "answer" ? E.fmtClock(q.remaining) : ph === "think" ? E.fmtClock(q.remaining) : "0:45") + "</span></div>" +
      '<p class="qa-q">' + t(cur ? cur.q : "") + "</p>" + (cur && cur.piege ? '<p class="muted small">' + t("Ce qu'elle teste : " + cur.piege) + "</p>" : "") +
      '<div class="bar"><span id="qa-bar" style="width:' + (ph === "answer" ? Math.round((1 - q.remaining / 45) * 100) : 0) + '%"></span></div>' +
      '<p class="small" id="qa-phase" aria-live="polite">' + t(ph === "think" ? "Respire. Étiquette ou miroir dans ta tête…" : ph === "answer" ? "À toi. Réponds à voix haute." : ph === "done" ? "Temps écoulé. Comment c'était ?" : "Prêt ? Cinq secondes pour respirer, puis 45 secondes pour répondre.") + "</p>" +
      '<div class="row gap wrap">' +
      (ph === "idle" || ph === "done" ? '<button type="button" class="btn btn-primary" data-act="qa-start">' + icon("play") + t(ph === "done" ? "Rejouer" : "Lancer") + "</button>" : '<button type="button" class="btn btn-line" data-act="qa-stop">' + icon("stop") + t("Arrêter") + "</button>") +
      '<button type="button" class="btn btn-quiet" data-act="qa-next">' + t("Question suivante") + icon("right") + "</button></div>" +
      takeBox(UI, "qa", 45, "Filmer ma réponse") +
      (ph === "done" ? '<ul class="checks inline">' + checks.map(([k, lab]) => '<li><button type="button" class="check' + (q.checks[k] ? " is-on" : "") + '" role="checkbox" aria-checked="' + !!q.checks[k] + '" data-act="qa-check" data-arg="' + k + '"><span class="box" aria-hidden="true">' + icon("check") + "</span><span>" + t(lab) + "</span></button></li>").join("") + "</ul>" : "") +
      "</div>" +
      '<div class="panel slim"><p class="h-label">' + t("La méthode") + '</p><ol class="method-list">' +
      "<li>" + t("Accuse réception : une étiquette (« On dirait que le prix vous inquiète. ») ou un miroir (« …trop cher ? »).") + "</li>" +
      "<li>" + t("Une pause. Puis réponds en PREP : point, raison, exemple, point.") + "</li>" +
      "<li>" + t("Termine par une question calibrée ou une vérification : « Qu'est-ce qui vous aiderait à trancher ? »") + "</li>" +
      "</ol></div>" +
      '<p class="muted small">' + t("Réponses données : " + q.answered) + "</p>";
  }

  function counter(UI) {
    const c = UI.counter;
    const total = c.counts.euh + c.counts.liaison + c.counts.autre;
    const perMin = c.elapsed >= 10 ? (total / (c.elapsed / 60)) : null;
    const btn = (k, label) => '<button type="button" class="big-tap" data-act="ct-add" data-arg="' + k + '"><span class="bt-label">' + t(label) + '</span><span class="bt-val" id="ct-' + k + '">' + c.counts[k] + "</span></button>";
    return '<p class="lead">' + t("Donne ton téléphone à quelqu'un : il tape à chaque tic pendant que tu parles.") + "</p>" +
      '<div class="panel"><div class="clock" id="ct-clock" role="timer">' + E.fmtClock(c.elapsed) + "</div>" +
      '<div class="tap-grid">' + btn("euh", "« euh »") + btn("liaison", "« du coup », « en fait »") + btn("autre", "autre tic") + "</div>" +
      '<p class="small" id="ct-sum"><strong>' + total + "</strong> " + t("tics") + (perMin != null ? " · " + t(E.fmtNum(perMin, 1) + " par minute") : "") + "</p>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-primary" data-act="ct-toggle">' + icon(c.running ? "pause" : "play") + t(c.running ? "Pause" : c.elapsed ? "Reprendre" : "Démarrer") + "</button>" +
      '<button type="button" class="btn btn-line" data-act="ct-reset">' + icon("reset") + t("Remettre à zéro") + "</button>" +
      '<button type="button" class="btn btn-line" data-act="ct-save"' + (c.elapsed >= 10 ? "" : " disabled") + ">" + icon("check") + t("Enregistrer dans mon journal") + "</button></div></div>";
  }

  function ladder(S) {
    const list = S.ladder || [];
    const done = list.filter(x => x.done).length;
    return '<p class="lead">' + t("Commence par une marche qui te fait un peu peur, pas plus. Refais-la jusqu'à ce qu'elle devienne facile, puis monte.") + "</p>" +
      '<p class="small"><strong>' + done + "</strong> " + t("marche" + (done > 1 ? "s" : "") + " sur " + list.length) + "</p>" +
      '<ol class="ladder">' + list.map((x, i) => '<li class="' + (x.done ? "is-done" : "") + '"><button type="button" class="check' + (x.done ? " is-on" : "") + '" role="checkbox" aria-checked="' + x.done + '" aria-label="' + esc("Marche " + (i + 1)) + '" data-act="ld-toggle" data-arg="' + x.id + '"><span class="box" aria-hidden="true">' + icon("check") + "</span></button>" +
        '<label class="sr" for="ld-' + x.id + '">' + t("Marche " + (i + 1)) + '</label><input id="ld-' + x.id + '" class="input ladder-input" data-ladder="' + x.id + '" value="' + esc(x.text) + '">' +
        '<button type="button" class="icon-btn" data-act="ld-del" data-arg="' + x.id + '" aria-label="' + esc("Supprimer la marche " + (i + 1)) + '">' + icon("trash") + "</button></li>").join("") + "</ol>" +
      '<form class="row gap ladder-add" data-form="ladder-add"><label class="sr" for="ld-new">' + t("Nouvelle marche") + '</label><input id="ld-new" class="input" type="text" placeholder="' + esc("Ajouter une marche") + '"><button type="submit" class="btn btn-line">' + icon("plus") + t("Ajouter") + "</button></form>" +
      '<p class="muted small">' + t("Si la peur t'empêche de travailler ou de dormir, parles-en à un médecin ou à un psychologue.") + "</p>";
  }

  function impro(UI) {
    const im = UI.impro;
    return '<p class="lead">' + t("Point, raison, exemple, point. L'idée peut être faible : c'est la structure qu'on entraîne.") + "</p>" +
      '<div class="panel impro-card"><p class="h-label">' + t("Sujet") + '</p><p class="qa-q" id="im-topic">' + t(im.topic) + "</p>" +
      '<button type="button" class="btn btn-line btn-sm" data-act="im-topic"' + (im.phase !== "idle" && im.phase !== "done" ? " disabled" : "") + ">" + icon("dice") + t("Autre sujet") + "</button>" +
      '<div class="clock" id="im-clock" role="timer">' + E.fmtClock(im.phase === "idle" || im.phase === "done" ? im.speak : im.remaining) + "</div>" +
      '<p class="small" id="im-phase" aria-live="polite">' + t(im.phase === "prep" ? "Prépare-toi…" : im.phase === "speak" ? "Parle !" : im.phase === "done" ? "Bravo. Un autre ?" : "Prêt ?") + "</p>" +
      '<div class="row gap wrap"><div class="seg-choice small-seg" role="radiogroup" aria-label="' + esc("Préparation") + '">' + [10, 30].map(v => '<button type="button" role="radio" aria-checked="' + (im.prep === v) + '" class="' + (im.prep === v ? "is-on" : "") + '" data-act="im-prep" data-arg="' + v + '">' + t(v + " s de prépa") + "</button>").join("") + "</div>" +
      '<div class="seg-choice small-seg" role="radiogroup" aria-label="' + esc("Durée de parole") + '">' + [45, 60, 90].map(v => '<button type="button" role="radio" aria-checked="' + (im.speak === v) + '" class="' + (im.speak === v ? "is-on" : "") + '" data-act="im-speak" data-arg="' + v + '">' + t(v + " s") + "</button>").join("") + "</div></div>" +
      '<div class="row gap">' + (im.phase === "prep" || im.phase === "speak" ? '<button type="button" class="btn btn-line" data-act="im-stop">' + icon("stop") + t("Arrêter") + "</button>" : '<button type="button" class="btn btn-primary btn-lg" data-act="im-start">' + icon("play") + t("Lancer le chrono") + "</button>") + "</div>" +
      takeBox(UI, "impro", im.speak, "Me filmer sur ce sujet") +
      '<p class="muted small">' + t("Sujets faits pendant cette séance : " + im.count) + "</p></div>";
  }

  /* ============================================================
     PROGRÈS
     ============================================================ */
  function progress(S, J, UI) {
    const sessions = (J.sessions || []).slice().sort((a, b) => a.at - b.at);
    const doneCount = S.plan.filter(id => S.done[id]).length;
    const minutes = Math.round(sessions.reduce((a, s) => a + (s.duration || 0), 0) / 60);
    const streak = streakDays(S, sessions);
    const base = baselineOf(J);
    const last = latestRehearsal(J, base && base.id);
    const tiles = '<div class="stats">' +
      stat(S.plan.length ? doneCount + "/" + S.plan.length : "–", "étapes faites") +
      stat(String(sessions.length), sessions.length > 1 ? "séances gardées" : "séance gardée") +
      stat(String(minutes), "minutes de pratique") +
      stat(String(streak), streak > 1 ? "jours d'affilée" : "jour d'affilée") + "</div>";
    const w = UI.chartW || 640;
    const charts = [];
    const ch = (key, label, fmt, hint) => {
      const pts = sessions.filter(s => s[key] != null).map(s => ({ x: s.at, y: s[key] }));
      if (pts.length >= 2) charts.push('<div class="panel chart"><div class="panel-head"><h2 class="h-title">' + t(label) + '</h2><span class="muted small">' + t(hint) + "</span></div>" + lineChart(pts, w, fmt) + "</div>");
    };
    ch("melodySd", "Variation de la voix", v => E.fmtNum(v, 1), "plus c'est haut, plus ta voix est vivante");
    ch("pausesPerMin", "Pauses par minute", v => E.fmtNum(v, 1), "entre 3 et 12, ton public suit bien");
    ch("fillersPerMin", "Tics par minute", v => E.fmtNum(v, 1), "plus bas = plus net");
    ch("wpm", "Mots par minute", v => String(Math.round(v)), "quand tu as ajouté le texte");
    {
      const pts = sessions.filter(s => s.kind === "mock" && s.mode === "ia" && s.score != null).map(s => ({ x: s.at, y: s.score }));
      if (pts.length >= 2) charts.push('<div class="panel chart"><div class="panel-head"><h2 class="h-title">' + t("Simulations d'entretien") + '</h2><span class="muted small">' + t("note du recruteur virtuel, sur 10") + "</span></div>" + lineChart(pts, w, v => E.fmtNum(v, 0)) + "</div>");
    }
    const list = (J.sessions || []).slice(0, 40).map(s => {
      const l = s.lessonId && L[s.lessonId];
      const bits = [];
      if (s.kind === "mock") {
        if (s.n) bits.push(s.n + " question" + (s.n > 1 ? "s" : ""));
        if (s.score != null) bits.push("note " + s.score + "/10");
        else if (s.checksRate != null) bits.push("auto-évaluation " + Math.round(s.checksRate * 100) + " %");
      }
      if (s.melodySd != null) bits.push("voix ± " + E.fmtNum(s.melodySd, 1));
      if (s.pausesPerMin != null) bits.push(E.fmtNum(s.pausesPerMin, 1) + " pauses/min");
      if (s.wpm) bits.push(s.wpm + " mots/min");
      if (s.fillersPerMin != null) bits.push(E.fmtNum(s.fillersPerMin, 1) + " tics/min");
      const confirm = UI.confirm === "del:" + s.id;
      const title = s.kind === "baseline" ? "Point de départ" : s.kind === "mock" ? (s.mode === "ia" ? "Simulation avec le recruteur virtuel" : "Simulation d'entretien") : l ? lessonTitle(s.lessonId, S) : s.kind === "counter" ? "Compteur de tics" : (s.title || "Pratique libre");
      return '<li class="j-item"><div class="j-main"><p class="j-title">' + t(title) + '</p><p class="muted small">' + t(fmtDay(new Date(s.at)) + " · " + E.fmtDur(s.duration || 0) + (bits.length ? " · " + bits.join(" · ") : "")) + "</p>" + (s.note ? '<p class="small j-note">' + t(s.note) + "</p>" : "") + "</div>" +
        (confirm ? '<div class="row gap"><button type="button" class="btn btn-sm btn-danger" data-act="del-session" data-arg="' + s.id + '">' + t("Supprimer") + '</button><button type="button" class="btn btn-sm btn-quiet" data-act="confirm-cancel">' + t("Annuler") + "</button></div>" : '<button type="button" class="icon-btn" data-act="confirm" data-arg="del:' + s.id + '" aria-label="' + esc("Supprimer cette séance") + '">' + icon("trash") + "</button>") + "</li>";
    }).join("");
    return '<section class="progress-page"><p class="kicker"><span class="tape tape-d" aria-hidden="true"></span>' + t("Ton journal") + '</p><h1 class="h-display">' + t("Mes progrès") + "</h1>" +
      tiles +
      (base && last ? compareTable(base, last, "Point de départ", last.kind === "rehearsal" ? "Dernière répétition" : "Dernière séance") : "") +
      (charts.length ? charts.join("") : '<div class="panel empty"><p class="h-title">' + t("Tes courbes apparaîtront ici") + '</p><p class="muted">' + t("Filme-toi au moins deux fois : tu verras ta voix, tes pauses et tes tics évoluer.") + '</p><button type="button" class="btn btn-primary" data-act="nav" data-arg="studio">' + icon("video") + t("M'enregistrer") + "</button></div>") +
      '<div class="section-head"><h2 class="h-section">' + t("Mes séances") + "</h2>" + (sessions.length && UI.dl ? '<button type="button" class="btn btn-line btn-sm" data-act="export-csv">' + icon("download") + t("Exporter (.csv)") + "</button>" : "") + "</div>" +
      (list ? '<ul class="journal">' + list + "</ul>" : '<p class="muted">' + t("Aucune séance pour l'instant. Chaque essai analysé est gardé ici automatiquement.") + "</p>") +
      '<div class="row gap wrap"><button type="button" class="btn btn-line" data-act="avis-open">' + icon("chat") + t("Donner mon avis") + '</button><button type="button" class="btn btn-line" data-act="nav" data-arg="profile">' + icon("user") + t("Profil et données") + '</button><button type="button" class="btn btn-quiet" data-act="nav" data-arg="methods">' + icon("book") + t("Les six méthodes") + "</button></div>" +
      "</section>";
  }
  function stat(v, label) { return '<div class="stat"><span class="stat-v">' + t(v) + '</span><span class="stat-l">' + t(label) + "</span></div>"; }
  function streakDays(S, sessions) {
    const days = new Set();
    const key = d => { const x = new Date(d); return x.getFullYear() + "-" + x.getMonth() + "-" + x.getDate(); };
    sessions.forEach(s => days.add(key(s.at)));
    Object.keys(S.done || {}).forEach(k => { if (S.done[k] && S.done[k].at) days.add(key(S.done[k].at)); });
    let n = 0;
    const d = new Date();
    if (!days.has(key(d))) d.setDate(d.getDate() - 1);
    while (days.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function lineChart(pts, w, fmt) {
    const H = 170, pl = 40, pr = 16, pt = 16, pb = 26;
    w = Math.max(280, Math.round(w));
    const ys = pts.map(p => p.y);
    let lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
    const padv = (hi - lo) * 0.15; lo = Math.max(0, lo - padv); hi += padv;
    const X = i => pl + (pts.length === 1 ? 0 : (i / (pts.length - 1)) * (w - pl - pr));
    const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
    let grid = "";
    [lo, (lo + hi) / 2, hi].forEach(v => {
      grid += '<line class="ch-grid" x1="' + pl + '" x2="' + (w - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
        '<text class="ch-text" x="' + (pl - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(fmt(v)) + "</text>";
    });
    const d = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    const area = d + " L" + X(pts.length - 1).toFixed(1) + " " + (H - pb) + " L" + X(0).toFixed(1) + " " + (H - pb) + " Z";
    const step = Math.max(1, Math.ceil(pts.length / 6));
    let xl = "";
    pts.forEach((p, i) => {
      if (i % step === 0 || i === pts.length - 1) xl += '<text class="ch-text" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(fmtShort(p.x)) + "</text>";
    });
    const dots = pts.map((p, i) => '<circle class="' + (i === pts.length - 1 ? "ch-end" : "ch-dot") + '" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (i === pts.length - 1 ? 5 : 3.2) + '"/>').join("");
    const lastP = pts[pts.length - 1];
    const lx = X(pts.length - 1), ly = Y(lastP.y);
    const label = '<text class="ch-val" x="' + (lx - 8).toFixed(1) + '" y="' + (ly - 10).toFixed(1) + '" text-anchor="end">' + esc(fmt(lastP.y)) + "</text>";
    return '<div class="chart-box"><svg viewBox="0 0 ' + w + " " + H + '" width="100%" role="img" aria-label="' + esc("Évolution sur " + pts.length + " séances, dernière valeur " + fmt(lastP.y)) + '">' + grid + '<path class="ch-area" d="' + area + '"/><path class="ch-line" d="' + d + '"/>' + dots + label + xl + "</svg></div>";
  }

  /* ============================================================
     MÉTHODES & PROFIL
     ============================================================ */
  function methods(S, UI) {
    const byMentor = {};
    DATA.lessons.forEach(l => [l.mentor].concat(l.also || []).filter(Boolean).forEach(m => { (byMentor[m] = byMentor[m] || []).push(l.id); }));
    return '<section class="methods">' + back("nav", S.profile ? "path" : "welcome", "Retour") +
      '<p class="kicker"><span class="tape tape-a" aria-hidden="true"></span>' + t("Les sources") + '</p><h1 class="h-display">' + t("Les six méthodes") + "</h1>" +
      '<p class="lead">' + t("Chaque étape s'appuie sur ce que ces six personnes enseignent publiquement. On résume leurs idées avec nos mots ; on ne parle pas à leur place.") + "</p>" +
      Object.keys(DATA.mentors).map(k => {
        const m = DATA.mentors[k];
        return '<article class="mentor"><h2 class="h-title">' + t(m.name) + '</h2><p class="muted">' + t(m.role) + '</p><p class="h-label">' + t(m.domain) + '</p><ul class="take">' + m.take.map(x => "<li>" + t(x) + "</li>").join("") + "</ul>" +
          '<p class="small"><strong>' + t("Pour aller plus loin : ") + "</strong>" + t(m.read) + "</p>" +
          (byMentor[k] ? '<div class="chips">' + byMentor[k].map(id => '<button type="button" class="chip chip-btn" data-act="open-lesson" data-arg="' + id + '">' + t(lessonTitle(id, S)) + "</button>").join("") + "</div>" : "") + "</article>";
      }).join("") +
      '<p class="fineprint">' + t("La Générale n'est ni affiliée à ces personnes ni approuvée par elles. Les techniques sont résumées et adaptées en français à partir de leurs livres, podcasts, vidéos et interventions publiques ; aucune citation ne leur est prêtée. Le questionnaire de style d'entretien est une version indicative, inspirée des quatre styles d'Interviewology : ce n'est pas l'évaluation officielle d'Anna Papalia. Les études citées : A. W. Brooks (2014) sur le recadrage du trac, Savitsky et Gilovich (2003) sur l'illusion de transparence, Balban et coll. (2023) sur la respiration. Droit du travail : Code du travail, articles L1221-6, L1132-1 et L1225-2 ; directive (UE) 2023/970 sur la transparence des rémunérations.") + "</p>" +
      "</section>";
  }

  function profile(S, J, UI) {
    const p = S.profile;
    const syncTxt = UI.sync === "cloud" ? "Tes données sont enregistrées dans ton compte, dans un espace privé que toi seul peux lire. Tu les retrouves sur tous tes appareils." : UI.sync === "readonly" ? "Tu peux consulter cette page mais pas y enregistrer dans ton compte : tes données restent sur cet appareil." : "Tes données sont enregistrées sur cet appareil, dans ce navigateur.";
    const rows = p ? [
      ["Situation", sitLabel(p.situation)],
      ["Échéance", ((DATA.deadlines.find(x => x.id === p.deadline) || {}).label || "") + (p.eventDate ? " (" + fmtDay(E.parseDay(p.eventDate)) + ")" : "")],
      ["Public", (DATA.audiences.find(x => x.id === p.audience) || {}).label],
      ["Trac", p.anxiety + "/5"],
      ["Expérience", (DATA.experience.find(x => x.id === p.experience) || {}).label],
      ["Défis", (p.challenges || []).map(c => (DATA.challenges.find(x => x.id === c) || {}).label).join(", ")],
      ["Temps par jour", p.minutes + " min"],
      ["Sujet", p.subject || "–"]
    ] : [];
    return '<section class="profile">' + back("nav", "progress", "Mes progrès") +
      '<h1 class="h-display">' + t("Profil et données") + "</h1>" +
      (p ? '<div class="panel"><dl class="kv">' + rows.map(r => "<dt>" + t(r[0]) + "</dt><dd>" + t(r[1] || "–") + "</dd>").join("") + '</dl><button type="button" class="btn btn-line" data-act="ob-edit">' + t("Refaire mon diagnostic") + '</button><p class="muted small">' + t("Ton parcours sera recalculé ; les étapes déjà faites restent cochées.") + "</p></div>"
        : '<div class="panel"><p>' + t("Pas encore de diagnostic.") + '</p><button type="button" class="btn btn-primary" data-act="ob-start">' + t("Faire mon diagnostic") + "</button></div>") +
      '<div class="panel"><h2 class="h-title">' + t("Où sont tes données") + "</h2><p>" + t(syncTxt) + '</p><p class="muted small">' + t("Tes vidéos et enregistrements ne quittent jamais ton appareil : ils sont analysés dans le navigateur, puis oubliés. Seuls les résultats (durée, pauses…) sont gardés.") + "</p>" +
      (UI.dl ? '<button type="button" class="btn btn-line btn-sm" data-act="export-json">' + icon("download") + t("Exporter mes données (.json)") + "</button>" : "") + "</div>" +
      '<div class="panel"><h2 class="h-title">' + t("Ton avis sur l'app") + '</h2><p class="muted">' + t("L'app est en test. Dis ce qui t'aide, ce qui te bloque et ce qui te manque : deux minutes suffisent.") + '</p><button type="button" class="btn btn-primary btn-sm" data-act="avis-open">' + icon("chat") + t("Donner mon avis") + "</button></div>" +
      '<div class="panel danger-zone"><h2 class="h-title">' + t("Tout effacer") + '</h2><p class="muted">' + t("Supprime ton diagnostic, ton parcours, tes notes et ton journal.") + "</p>" +
      (UI.confirm === "reset" ? '<div class="row gap"><button type="button" class="btn btn-danger" data-act="do-reset">' + t("Oui, tout effacer") + '</button><button type="button" class="btn btn-quiet" data-act="confirm-cancel">' + t("Annuler") + "</button></div>" : '<button type="button" class="btn btn-line" data-act="confirm" data-arg="reset">' + icon("trash") + t("Tout effacer") + "</button>") +
      "</div></section>";
  }

  /* ============================================================
     AVIS DES TESTEURS
     L'app est en test : chaque personne peut copier son avis et
     l'envoyer à qui lui a donné le lien (LinkedIn, WhatsApp…).
     ============================================================ */
  const AVIS_UTILE = [["pas", "Pas du tout"], ["peu", "Un peu"], ["assez", "Assez"], ["beaucoup", "Beaucoup"]];
  const AVIS_RECO = [["oui", "Oui"], ["peut-etre", "Peut-être"], ["non", "Non"]];
  const avisData = S => (S.avis && S.avis.draft) || {};
  function avisFilled(S) { const d = avisData(S); return ["utile", "aide", "bloque", "manque", "reco", "prix"].some(k => String(d[k] || "").trim()); }
  function avisUsage(S, J, UI) {
    const dev = UI.dev || {};
    const osName = { ios: "iPhone ou iPad", android: "Android", windows: "Windows", mac: "Mac", chromeos: "Chromebook" }[dev.os] || "";
    const bits = [(dev.phone ? "téléphone" : "ordinateur") + (osName ? " (" + osName + ")" : "")];
    if (S.profile) bits.push(sitLabel(S.profile.situation));
    if (S.plan && S.plan.length) { const n = S.plan.filter(id => S.done && S.done[id]).length; bits.push(n + (n > 1 ? " étapes faites" : " étape faite") + " sur " + S.plan.length); }
    const analysed = (J.sessions || []).filter(s => s.kind !== "mock" && s.kind !== "counter" && s.pausesPerMin != null).length;
    bits.push(analysed + (analysed > 1 ? " essais analysés" : " essai analysé"));
    const itw = S.itw && ((S.itw.apps || []).length || (S.itw.stories || []).length);
    bits.push("espace Entretiens " + (itw ? "utilisé" : "pas utilisé"));
    return bits.join(" · ");
  }
  function avisText(S, J, UI) {
    const d = avisData(S);
    const val = (list, v) => (list.find(x => x[0] === v) || [])[1] || "";
    const clean = v => String(v || "").replace(/\s+/g, " ").trim();
    const lines = ["Mon avis sur La Générale (version du " + DATA.versionLabel + ")"];
    if (UI.avisAbout && UI.avisAbout.lessonId && L[UI.avisAbout.lessonId]) lines.push("À propos de l'étape : " + lessonTitle(UI.avisAbout.lessonId, S));
    if (d.utile) lines.push("L'app m'aide : " + val(AVIS_UTILE, d.utile));
    if (clean(d.bloque)) lines.push("Là où j'ai hésité : " + clean(d.bloque));
    if (clean(d.aide)) lines.push("Ce qui m'a le plus aidé : " + clean(d.aide));
    if (clean(d.manque)) lines.push("Ce qui me manque : " + clean(d.manque));
    if (d.reco) lines.push("Je la conseillerais à un proche : " + val(AVIS_RECO, d.reco));
    if (clean(d.prix)) lines.push("Si elle devenait payante : " + clean(d.prix));
    lines.push("Mon utilisation : " + avisUsage(S, J, UI));
    return lines.join("\n");
  }
  function avisWa(text) { return "https://wa.me/?text=" + encodeURIComponent(text); }
  function avis(S, J, UI) {
    const d = avisData(S);
    const sent = S.avis && S.avis.sentAt;
    const filled = avisFilled(S);
    const bk = UI.avisBack || { act: "nav", arg: S.profile ? "path" : "welcome", label: "Retour" };
    const seg = (key, list, aria) => '<div class="seg-choice' + (list.length > 3 ? " is-grid" : "") + '" role="radiogroup" aria-label="' + esc(aria) + '">' + list.map(([v, l]) => '<button type="button" role="radio" aria-checked="' + (d[key] === v) + '" class="' + (d[key] === v ? "is-on" : "") + '" data-act="avis-pick" data-field="' + key + '" data-arg="' + v + '">' + t(l) + "</button>").join("") + "</div>";
    const area = (key, label, hint, ph) => '<div class="field"><label for="av-' + key + '">' + t(label) + "</label>" + (hint ? '<p class="muted small field-hint">' + t(hint) + "</p>" : "") +
      '<textarea id="av-' + key + '" class="input" rows="3" maxlength="1500" data-avis="' + key + '" placeholder="' + esc(ph) + '">' + esc(d[key] || "") + "</textarea></div>";
    const about = UI.avisAbout && UI.avisAbout.lessonId && L[UI.avisAbout.lessonId];
    const text = avisText(S, J, UI);
    return '<section class="avis">' + back(bk.act, bk.arg, bk.label) +
      '<p class="kicker"><span class="tape tape-d" aria-hidden="true"></span>' + t("Version de test") + "</p>" +
      '<h1 class="h-display">' + t("Donne ton avis") + "</h1>" +
      '<p class="lead">' + t("L'app est en test : tes réponses servent directement à l'améliorer. Deux minutes suffisent. Réponds avec tes mots, il n'y a pas de bonne réponse.") + "</p>" +
      (about ? '<p class="avis-about"><span class="chip">' + t("À propos de l'étape : " + lessonTitle(UI.avisAbout.lessonId, S)) + '</span><button type="button" class="link small" data-act="avis-about-clear">' + t("Plutôt un avis général") + "</button></p>" : "") +
      '<form class="avis-form" data-form="avis" novalidate>' +
      '<div class="field"><span class="h-label">' + t("Dans l'ensemble, l'app t'aide-t-elle ?") + "</span>" + seg("utile", AVIS_UTILE, "L'app t'aide-t-elle ?") + "</div>" +
      area("bloque", "À quel moment as-tu hésité, ou ne savais plus quoi faire ?", "C'est la réponse la plus utile pour améliorer l'app.", "Ex. : je n'ai pas compris où appuyer pour…") +
      area("aide", "Qu'est-ce qui t'a le plus aidé ?", "", "Ex. : me revoir en vidéo, le conseil après l'analyse…") +
      area("manque", "Qu'est-ce qui te manque ?", "", "Ex. : plus d'exercices pour…") +
      '<div class="field"><span class="h-label">' + t("La conseillerais-tu à un proche ?") + "</span>" + seg("reco", AVIS_RECO, "La conseillerais-tu à un proche ?") + "</div>" +
      '<div class="field"><label for="av-prix">' + t("Si l'app devenait payante, combien serais-tu prêt à payer, et comment ?") + '</label><input id="av-prix" class="input" type="text" maxlength="200" data-avis="prix" placeholder="' + esc("Ex. : un petit montant par mois, ou un seul paiement") + '" value="' + esc(d.prix || "") + '"></div>' +
      "</form>" +
      '<section class="panel avis-send" aria-labelledby="avis-send-t"><h2 class="h-title" id="avis-send-t">' + icon("send") + t("Envoyer ton avis") + "</h2>" +
      '<p class="small">' + t("Copie ton avis, puis colle-le dans ta conversation avec la personne qui t'a donné l'app (LinkedIn, WhatsApp, e-mail…). Voici exactement ce qui sera envoyé :") + "</p>" +
      '<pre class="avis-preview" id="avis-preview">' + esc(text) + "</pre>" +
      '<div class="row gap wrap"><button type="button" class="btn btn-primary btn-lg" data-act="avis-copy" id="avis-copy"' + (filled ? "" : " disabled") + ">" + icon("copy") + t("Copier mon avis") + "</button>" +
      '<a class="btn btn-line" id="avis-wa" href="' + esc(avisWa(text)) + '" target="_blank" rel="noopener"' + (filled ? "" : ' aria-disabled="true" tabindex="-1"') + ">" + icon("chat") + t("L'envoyer par WhatsApp") + "</a></div>" +
      '<p class="muted small" id="avis-hint"' + (filled ? " hidden" : "") + ">" + t("Réponds à au moins une question pour pouvoir l'envoyer.") + "</p>" +
      (sent ? '<p class="saved-line">' + icon("check") + t("Merci ! Ton avis a été copié. Tu peux le compléter et le renvoyer quand tu veux.") + "</p>" : "") +
      "</section></section>";
  }
  /* Rappel discret sur l'accueil du parcours et de l'espace Entretiens */
  function avisPanel(S, doneCount) {
    const sent = S.avis && S.avis.sentAt;
    const nudge = !sent && doneCount >= 2;
    return '<div class="panel slim avis-panel' + (nudge ? " is-nudge" : "") + '"><div class="avis-panel-txt"><p class="h-label">' + t("Version de test") + "</p><p>" +
      t(sent ? "Merci pour ton avis ! Tu peux en donner un autre quand tu veux." : nudge ? "Tu as déjà fait " + doneCount + " étapes : ton avis, en deux minutes, aide beaucoup à améliorer l'app." : "L'app est en test : dis-nous ce qui t'aide et ce qui te bloque.") +
      '</p></div><button type="button" class="btn ' + (nudge ? "btn-primary" : "btn-line") + ' btn-sm" data-act="avis-open">' + icon("chat") + t("Donner mon avis") + "</button></div>";
  }

  /* ============================================================ */
  function page(S, J, UI) {
    switch (UI.view) {
      case "welcome": return welcome(S, UI);
      case "onboarding": return onboarding(S, UI);
      case "ready": return S.profile ? ready(S, UI) : welcome(S, UI);
      case "path": return path(S, J, UI);
      case "lesson": return lesson(S, J, UI);
      case "studio": return studio(S, J, UI);
      case "tools": return tools(S, UI);
      case "tool": return tool(S, J, UI);
      case "progress": return progress(S, J, UI);
      case "methods": return methods(S, UI);
      case "profile": return profile(S, J, UI);
      case "avis": return avis(S, J, UI);
      case "itw": return ItwViews.hub(S, J, UI);
      case "itw-fiche": return ItwViews.fiche(S, UI);
      default: return welcome(S, UI);
    }
  }

  return {
    page, studioPlayer, studioStatus, studioResults, studioVerdict, studioReview, studioCoach, studioSave, recEnd, recorder, recDetails, promptCard, takeBox, ticBox, chrono, coachBlock, md,
    builder, builderLive, builderStats, conduiteText, qa, counter, impro, ladder, breath, icon, esc, t, OB, TOOLS, lessonTitle,
    noteKey, nextStep, sessionFromStudio, baselineOf, sitLabel, words, fmtDay, coachHome,
    field, back, tape, pill, fieldKey, planList, toolCard, mentorTags, avisText, avisWa, avisFilled, avisPanel
  };
})();
</script>
<script>/* ============================================================
   LA GÉNÉRALE · vues de l'espace Entretiens (état -> HTML)
   ============================================================ */
const ItwViews = (() => {
  const E = Engine, V = Views, D = DATA.itw;
  const { icon, esc, t, coachBlock, field, pill, fmtDay, words, planList, toolCard, TOOLS, takeBox } = V;
  const lab = (list, id) => { const x = (list || []).find(o => o.id === id); return x ? x.label : ""; };
  const cur = S => E.itwCurrent(S);
  const it = S => S.itw || { apps: [], stories: [], ask: [], askCustom: [], customQ: [] };
  const plural = (n, one, many) => n + " " + (n > 1 ? (many || one + "s") : one);
  const lcFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  const ucFirst = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const endDot = s => /[.!?…]$/.test(s) ? s : s + ".";
  const kEur = v => E.fmtNum(v, v % 1 ? 1 : 0) + " k€";
  const euros = v => (v == null ? "–" : Number(v).toLocaleString("fr-FR")) + " €";
  const fid = k => "f-" + String(k).replace(/[^a-z0-9]/gi, "-");
  function cut(s, n) {
    s = String(s || "").replace(/\s+/g, " ").trim();
    if (s.length <= n) return s;
    const c = s.slice(0, n);
    return c.slice(0, Math.max(c.lastIndexOf(" "), n - 15)) + "…";
  }
  function dateLabel(app) {
    if (!app || !app.date) return "";
    const d = E.parseDay(app.date);
    if (!d) return "";
    let s = fmtDay(d);
    if (app.time && /^\d{1,2}:\d{2}/.test(app.time)) {
      const parts = app.time.split(":");
      s += " à " + Number(parts[0]) + " h" + (parts[1] && parts[1] !== "00" ? " " + parts[1] : "");
    }
    return s;
  }
  function whenLabel(days) {
    if (days == null) return "";
    if (days < 0) return "passé";
    if (days === 0) return "aujourd'hui";
    if (days === 1) return "demain";
    return "dans " + days + " jours";
  }
  function stat(v, label) { return '<div class="stat"><span class="stat-v">' + t(v) + '</span><span class="stat-l">' + t(label) + "</span></div>"; }
  function papTag() { return '<span class="tag tag-pap">' + t("D'après Anna Papalia") + "</span>"; }
  function coachPanel(act, st, title, desc, outId, disabled, arg) {
    st = st || { status: "idle" };
    const a = arg ? ' data-arg="' + esc(arg) + '"' : "";
    return '<div class="panel coach"><h2 class="h-title">' + t(title) + '</h2><p class="muted small">' + t(desc) + "</p>" +
      '<div class="row gap"><button type="button" class="btn btn-primary btn-sm" data-act="' + act + '"' + a + (disabled || st.status === "wait" ? " disabled" : "") + ">" + icon("chat") + t(st.status === "done" ? "Redemander" : "Demander au coach") + "</button>" +
      (st.status === "wait" ? '<button type="button" class="btn btn-quiet btn-sm" data-act="coach-stop" data-arg="' + esc(act) + '">' + t("Arrêter") + "</button>" : "") + "</div>" +
      '<div id="' + outId + '">' + coachBlock(st) + "</div></div>";
  }
  function credit() {
    return '<aside class="credit"><p><strong>' + t("D'après Anna Papalia.") + "</strong> " +
      t("Ce programme s'inspire des conseils publics d'Anna Papalia, coach en entretiens, ancienne directrice du recrutement et autrice d'Interviewology (Harper Business, 2024) : ses vidéos TikTok, son livre et ses interviews. La Générale n'est ni affiliée à elle ni approuvée par elle ; ses idées sont résumées avec nos mots.") +
      ' <button type="button" class="link" data-act="nav" data-arg="methods">' + t("Les six méthodes") + "</button></p></aside>";
  }

  /* ============================================================
     ACCUEIL DE L'ESPACE
     ============================================================ */
  function landing(S, J, UI) {
    const phases = DATA.phases.filter(p => p.track === "itw");
    const total = E.itwPlan(null, { full: true }).length;
    return '<section class="itw">' +
      '<p class="kicker"><span class="tape tape-c" aria-hidden="true"></span>' + t("Préparation aux entretiens") + "</p>" +
      '<h1 class="h-display">' + t("Prépare ton entretien d'embauche, de l'offre à la négociation.") + "</h1>" +
      '<p class="lead">' + t("Un programme de " + total + " étapes inspiré des conseils d'Anna Papalia : ce que le recruteur cherche vraiment, ton « Parlez-moi de vous », tes histoires, les questions pièges, le salaire, un recruteur virtuel et l'après-entretien. Commence par ta fiche : deux minutes.") + "</p>" +
      '<div class="row gap"><button type="button" class="btn btn-primary btn-lg" data-act="fiche-new">' + t("Créer ma fiche entretien") + icon("right") + "</button></div>" +
      '<ol class="phase-strip">' + phases.map((p, i) => '<li class="tape-' + p.tape + '"><span class="ps-num">' + String(i + 1).padStart(2, "0") + '</span><span class="ps-label">' + t(p.label) + '</span><span class="ps-sub">' + t(p.sub) + "</span></li>").join("") + "</ol>" +
      '<div class="section-head"><h2 class="h-section">' + t("L'atelier") + '</h2><p class="muted small">' + t("Utilisable tout de suite, même sans fiche.") + "</p></div>" +
      '<div class="tool-grid">' + Object.keys(TOOLS).filter(k => TOOLS[k].group === "itw").map(k => toolCard(k)).join("") + "</div>" +
      V.avisPanel(S, 0) + credit() + "</section>";
  }

  function toolStatus(k, S, J, app) {
    const n = S.notes || {};
    const I = it(S);
    switch (k) {
      case "style": return I.style && D.styles[I.style.primary] ? "Ton style : " + lcFirst(D.styles[I.style.primary].name) : "Huit questions, trois minutes";
      case "offre": {
        const c = ((app && app.comp) || []).filter(x => x && String(x.name || "").trim()).length;
        return c ? plural(c, "exigence") + " sur 5" : app && app.jd ? "Offre collée, à décoder" : "Colle l'offre";
      }
      case "pitch": {
        const w = words(["itw.passe", "itw.present", "itw.futur"].map(x => n[x] || "").join(" "));
        return w ? "≈ " + E.fmtDur(Math.round((w / 130) * 60)) + " à l'oral" : "Passé, présent, futur";
      }
      case "histoires": {
        const list = I.stories || [];
        const ok = list.filter(s => E.storyCheck(s).complete).length;
        return list.length ? plural(list.length, "histoire") + ", " + ok + " complète" + (ok > 1 ? "s" : "") : "Aucune histoire pour l'instant";
      }
      case "pieges": {
        const r = D.questions.filter(q => S.checks && S.checks["itwq:" + q.id]).length;
        return r + " sur " + D.questions.length + " prêtes";
      }
      case "simulateur": {
        const m = ((J && J.sessions) || []).filter(s => s.kind === "mock").length;
        return m ? plural(m, "simulation") + " faite" + (m > 1 ? "s" : "") : "Roulette ou recruteur virtuel";
      }
      case "aposer": {
        const c = (I.ask || []).length + (I.askCustom || []).length;
        return c ? plural(c, "question choisie", "questions choisies") : "Aucune choisie";
      }
      case "salaire": {
        const c = E.salaryCalc((app && app.salary) || {});
        return c.target ? "Objectif : " + kEur(c.target) : "Ta fourchette et tes phrases";
      }
      case "apres": return app && app.merci && app.merci.moment ? "Brouillon prêt" : "Le jour même";
      case "candidatures": return plural((I.apps || []).length, "candidature");
    }
    return "";
  }

  function meter(rd) {
    const segs = rd.items.map(i => '<span class="seg' + (i.done ? " is-done" : "") + '"></span>').join("");
    return '<section class="panel meter" aria-labelledby="meter-title">' +
      '<div class="meter-top"><h2 class="h-label" id="meter-title">' + t("Ton état de préparation") + '</h2><p class="meter-pct"><span class="meter-num">' + rd.pct + '</span><span class="meter-unit">%</span></p></div>' +
      '<div class="segs meter-segs" aria-hidden="true">' + segs + "</div>" +
      '<ul class="ready-list">' + rd.items.map(i =>
        '<li class="' + (i.done ? "is-done" : "") + '"><span class="rl-mark" aria-hidden="true">' + (i.done ? icon("check") : "") + "</span>" +
        '<span class="rl-text"><span class="rl-label">' + t(i.label) + '</span><span class="rl-hint">' + t(i.hint || "") + "</span></span>" +
        '<button type="button" class="btn btn-quiet btn-sm" data-act="' + i.act + '"' + (i.arg ? ' data-arg="' + esc(i.arg) + '"' : "") + (i.act === "open-lesson" ? ' data-from="itw"' : "") + ' aria-label="' + esc((i.done ? "Revoir : " : "Faire : ") + i.label) + '">' + t(i.done ? "Revoir" : "Faire") + icon("right") + "</button></li>").join("") + "</ul>" +
      '<p class="sr">' + t(rd.done + " éléments prêts sur " + rd.total) + "</p></section>";
  }

  function hub(S, J, UI) {
    const app = cur(S);
    if (!app) return landing(S, J, UI);
    const I = it(S);
    const days = E.itwDays(app);
    const express = E.itwExpress(app);
    const showExpress = express && !UI.itwFull;
    const plan = E.itwPlan(app, { express: showExpress });
    const pr = E.itwPriorities(app);
    const rd = E.itwReadiness(S, J);
    const next = plan.find(id => !S.done[id]);
    const title = (app.role || "Ton prochain entretien") + (app.company ? " chez " + app.company : "");
    const chips = [app.type && app.type !== "inconnu" ? lab(D.types, app.type) : "", lab(D.formats, app.format), lab(D.levels, app.level), dateLabel(app)].filter(Boolean)
      .map(c => '<span class="chip">' + t(c) + "</span>").join("");
    const cd = days != null && days >= 0
      ? '<div class="countdown" aria-label="' + esc(days === 0 ? "C'est aujourd'hui" : "J moins " + days) + '"><span class="cd-num">' + (days === 0 ? "J" : "J-" + days) + '</span><span class="cd-sub">' + t(days === 0 ? "c'est aujourd'hui" : "avant ton entretien") + "</span></div>"
      : "";
    const doneCount = plan.filter(id => S.done[id]).length;
    const missing = [];
    if (!app.role) missing.push("le poste");
    if (!app.company) missing.push("l'entreprise");
    if (!app.date) missing.push("la date");
    if (!app.type || app.type === "inconnu") missing.push("le type d'entretien");
    if (!app.level) missing.push("ton niveau");
    let h = '<section class="itw">' +
      '<div class="dash-head"><div class="dh-main"><p class="kicker"><span class="tape tape-c" aria-hidden="true"></span>' + t("Préparation aux entretiens") + "</p>" +
      '<h1 class="h-display">' + t(title) + "</h1>" + (chips ? '<div class="chips">' + chips + "</div>" : "") +
      '<div class="row gap wrap"><button type="button" class="btn btn-line btn-sm" data-act="fiche-edit">' + icon("edit") + t("Modifier la fiche") + "</button>" +
      '<button type="button" class="btn btn-quiet btn-sm" data-act="open-tool" data-arg="candidatures">' + icon("briefcase") + t((I.apps || []).length > 1 ? "Mes candidatures (" + I.apps.length + ")" : "Ajouter une candidature") + "</button></div></div>" + cd + "</div>";
    if (missing.length) {
      h += '<div class="panel slim nudge"><p>' + t("Complète ta fiche : " + missing.join(", ") + ". Le programme et les questions s'y adaptent.") + '</p><button type="button" class="btn btn-line btn-sm" data-act="fiche-edit">' + t("Compléter") + "</button></div>";
    }
    if (express) {
      h += '<div class="panel slim express"><div><p class="h-label">' + t(days === 0 ? "C'est aujourd'hui" : days === 1 ? "C'est demain" : "Dans deux jours") + "</p><p>" +
        t(showExpress ? "Plan express : l'essentiel, en " + plan.length + " étapes. Garde du temps pour une simulation." : "Tu vois le programme complet.") + "</p></div>" +
        '<button type="button" class="btn btn-quiet btn-sm" data-act="itw-full">' + t(showExpress ? "Voir le programme complet" : "Revenir au plan express") + "</button></div>";
    }
    h += meter(rd);
    if (next) {
      const l = E.LESSON[next];
      h += '<div class="next-card"><p class="h-label">' + t("Prochaine étape · " + (plan.indexOf(next) + 1) + " sur " + plan.length) + "</p>" +
        '<h2 class="h-title">' + t(l.title) + "</h2>" +
        '<p class="muted">' + t(l.short) + " · " + t(l.min + " min") + "</p>" +
        '<button type="button" class="btn btn-primary" data-act="open-lesson" data-arg="' + next + '" data-from="itw">' + t("Commencer") + icon("right") + "</button></div>";
    } else {
      h += '<div class="next-card"><p class="h-label">' + t("Programme terminé") + '</p><h2 class="h-title">' + t("Tu es prêt. Fais encore une simulation la veille.") + "</h2>" +
        '<button type="button" class="btn btn-primary" data-act="open-tool" data-arg="simulateur">' + icon("people") + t("Lancer une simulation") + "</button></div>";
    }
    h += '<div class="section-head"><h2 class="h-section">' + t("L'atelier") + "</h2></div>" +
      '<div class="tool-grid">' + Object.keys(TOOLS).filter(k => TOOLS[k].group === "itw").map(k => toolCard(k, toolStatus(k, S, J, app))).join("") + "</div>";
    h += '<div class="section-head"><h2 class="h-section">' + t("Ton programme") + '</h2><p class="muted small">' + t(doneCount + " sur " + plan.length + " étapes faites") + "</p></div>" +
      planList(S, UI, { plan, pr, from: "itw" });
    h += V.avisPanel(S, doneCount) + credit() + "</section>";
    return h;
  }

  /* ============================================================
     FICHE ENTRETIEN
     ============================================================ */
  function fiche(S, UI) {
    const f = UI.fiche || { draft: {} };
    const d = f.draft || {};
    const opts = (list, key, aria) => '<div class="options compact" role="radiogroup" aria-label="' + esc(aria) + '">' + list.map(o => {
      const on = d[key] === o.id;
      return '<button type="button" class="option' + (on ? " is-on" : "") + '" role="radio" aria-checked="' + on + '" data-act="fiche-pick" data-field="' + key + '" data-arg="' + o.id + '">' +
        '<span class="option-mark" aria-hidden="true">' + icon("check") + '</span><span class="option-text"><span class="option-label">' + t(o.label) + "</span>" + (o.hint ? '<span class="option-hint">' + t(o.hint) + "</span>" : "") + "</span></button>";
    }).join("") + "</div>";
    const seg = (list, key, aria) => '<div class="seg-choice" role="radiogroup" aria-label="' + esc(aria) + '">' + list.map(o =>
      '<button type="button" role="radio" aria-checked="' + (d[key] === o.id) + '" class="' + (d[key] === o.id ? "is-on" : "") + '" data-act="fiche-pick" data-field="' + key + '" data-arg="' + o.id + '">' + t(o.label) + "</button>").join("") + "</div>";
    const inp = (key, label, ph, type, extra) => '<div class="field"><label for="fi-' + key + '">' + t(label) + "</label>" +
      '<input id="fi-' + key + '" class="input" type="' + (type || "text") + '" data-fiche="' + key + '" value="' + esc(d[key] || "") + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + (extra || "") + "></div>";
    const worries = d.worries || [];
    return '<section class="fiche">' + V.back("nav", "itw", "Entretiens") +
      '<h1 class="h-display">' + t(f.editing ? "Ta fiche entretien" : "Nouvelle fiche entretien") + "</h1>" +
      '<p class="lead">' + t("Le poste, l'entreprise, le type d'entretien : le programme, les questions de simulation et ton état de préparation s'y adaptent.") + "</p>" +
      '<form class="fiche-form" data-form="fiche" novalidate>' +
      '<div class="grid-2">' + inp("role", "Poste visé", "Ex. : Responsable logistique", "text", ' autocomplete="organization-title" required') + inp("company", "Entreprise", "Ex. : Transports Martin", "text", ' autocomplete="organization"') + "</div>" +
      '<div class="grid-2">' + inp("date", "Date de l'entretien", "", "date") + inp("time", "Heure", "", "time") + "</div>" +
      '<div class="field"><span class="h-label">' + t("Type d'entretien") + "</span>" + opts(D.types, "type", "Type d'entretien") + "</div>" +
      '<div class="field"><span class="h-label">' + t("Format") + "</span>" + seg(D.formats, "format", "Format") + "</div>" +
      '<div class="field"><span class="h-label">' + t("Ton niveau") + "</span>" + opts(D.levels, "level", "Ton niveau") + "</div>" +
      '<div class="field"><span class="h-label" id="fi-worries-l">' + t("Ce qui t'inquiète, jusqu'à quatre choix") + '</span><div class="chips" role="group" aria-labelledby="fi-worries-l">' +
      D.worries.map(w => { const on = worries.indexOf(w.id) >= 0; return '<button type="button" class="chip chip-btn' + (on ? " is-on" : "") + '" aria-pressed="' + on + '" data-act="fiche-worry" data-arg="' + w.id + '">' + t(w.label) + "</button>"; }).join("") + "</div></div>" +
      '<div class="grid-2"><div class="field"><label for="fi-stage">' + t("Où en es-tu ?") + '</label><select id="fi-stage" class="input" data-fiche="stage">' +
      D.stages.map(s => '<option value="' + s.id + '"' + ((d.stage || "entretien") === s.id ? " selected" : "") + ">" + esc(s.label) + "</option>").join("") + "</select></div>" +
      inp("people", "Tes interlocuteurs (facultatif)", "Ex. : Claire Martin, directrice des opérations") + "</div>" +
      '<div class="grid-2">' + inp("next", "Prochaine action (facultatif)", "Ex. : relancer si pas de nouvelles") + inp("nextDate", "Pour quand", "", "date") + "</div>" +
      '<div class="field"><label for="fi-jd">' + t("L'offre d'emploi (facultatif)") + '</label><textarea id="fi-jd" class="input" rows="5" data-fiche="jd" placeholder="' + esc("Colle le texte de l'annonce : il servira à prévoir les questions.") + '">' + esc(d.jd || "") + "</textarea></div>" +
      (f.error ? '<p class="form-error" role="alert">' + t(f.error) + "</p>" : "") +
      '<div class="row gap"><button type="submit" class="btn btn-primary btn-lg">' + icon("check") + t("Enregistrer ma fiche") + '</button><button type="button" class="btn btn-quiet" data-act="fiche-cancel">' + t("Annuler") + "</button></div>" +
      "</form></section>";
  }

  /* ============================================================
     STYLE D'ENTRETIEN
     ============================================================ */
  function style(S, UI) {
    const q = UI.quiz;
    const res = it(S).style;
    if (q && q.i < D.quiz.length) {
      const item = D.quiz[q.i];
      return '<div class="quiz"><div class="ob-top"><span class="h-label">' + t("Question " + (q.i + 1) + " sur " + D.quiz.length) + '</span><div class="bar" aria-hidden="true"><span style="width:' + Math.round(((q.i + 1) / D.quiz.length) * 100) + '%"></span></div></div>' +
        '<h2 class="h-title quiz-q" id="quiz-q">' + t(item.q) + "</h2>" +
        '<div class="options" role="radiogroup" aria-labelledby="quiz-q">' + item.opts.map((o, i) => {
          const on = q.answers[q.i] === o[0];
