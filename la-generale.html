  /* ============================================================
     OUTILS : respiration, questions, compteur, impro, échelle
     ============================================================ */
  function initTool(id) {
    if (id === "conduite" && !UI.builder) UI.builder = { sit: (S.profile && S.profile.situation) || "general", tab: "plan", coach: { status: "idle" } };
    if (id === "breath" || id === "respiration") { if (!UI.breath) UI.breath = { mode: "soupir", total: 120, running: false, scale: 0.32, left: 120, count: "", phaseText: "" }; }
    if (id === "questions" && !UI.qa) {
      const sit = S.profile && S.profile.situation && S.profile.situation !== "general" ? S.profile.situation : "presentation";
      UI.qa = { sit, list: qaList(sit), i: 0, phase: "idle", remaining: 45, checks: {}, answered: 0, source: "bank", ai: null, aiError: null };
    }
    if (id === "compteur" && !UI.counter) UI.counter = { running: false, elapsed: 0, t0: 0, counts: { euh: 0, liaison: 0, autre: 0 } };
    if (id === "impro" && !UI.impro) UI.impro = { topic: randTopic(), prep: 10, speak: 60, phase: "idle", remaining: 0, count: 0 };
    if (id === "echelle" && !S.ladder) { S.ladder = DATA.ladder.map((text, i) => ({ id: "l" + i, text, done: false })); commit("state"); }
  }
  function openTool(id) {
    initTool(id);
    const T = V.TOOLS[id] || {};
    if (T.group === "itw" && ["offre", "salaire", "apres"].indexOf(id) >= 0) ensureApp();
    const from = UI.view === "lesson" ? UI.lessonId : null;
    let back = UI.view === "tools" ? "tools" : UI.view === "itw" ? "itw" : null;
    if (UI.view === "tool") back = UI.toolBack;
    if (UI.view === "lesson" || !back) back = T.group === "itw" ? "itw" : "tools";
    if (id !== UI.toolId) { UI.quiz = null; UI.pqOpen = null; }
    go("tool", { toolId: id, fromLesson: from, toolBack: back });
  }
  function rerenderTool() { if (UI.view === "tool") render({ keepScroll: true }); }

  /* ============================================================
     ENTRETIENS : fiche, candidatures, outils
     ============================================================ */
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function newApp(over) {
    return Object.assign({ id: uid("a"), role: "", company: "", date: "", time: "", type: "inconnu", format: "presentiel", level: "", worries: [], stage: "entretien", people: "", next: "", nextDate: "", jd: "", comp: [], jdAI: null, salary: {}, merci: {}, createdAt: Date.now() }, over || {});
  }
  function ensureApp() {
    const it = S.itw;
    const found = it.apps.find(a => a.id === it.current);
    if (found) return found;
    if (it.apps.length) { it.current = it.apps[0].id; commit("state"); return it.apps[0]; }
    const p = S.profile || {};
    const app = newApp({ date: p.situation === "entretien" ? (p.eventDate || "") : "" });
    it.apps.push(app);
    it.current = app.id;
    commit("state");
    return app;
  }
  const FICHE_KEYS = ["role", "company", "date", "time", "type", "format", "level", "worries", "stage", "people", "next", "nextDate", "jd"];
  function openFiche(appId) {
    const app = appId ? S.itw.apps.find(a => a.id === appId) : null;
    let draft;
    if (app) {
      draft = {};
      FICHE_KEYS.forEach(k => { draft[k] = Array.isArray(app[k]) ? app[k].slice() : (app[k] || ""); });
    } else {
      const p = S.profile || {};
      draft = newApp({ date: p.situation === "entretien" && !S.itw.apps.length ? (p.eventDate || "") : "" });
      delete draft.id;
    }
    if (!draft.type) draft.type = "inconnu";
    if (!draft.format) draft.format = "presentiel";
    if (!draft.stage) draft.stage = "entretien";
    UI.fiche = { editing: app ? app.id : null, draft, error: "" };
    go("itw-fiche");
  }
  function saveFiche() {
    const f = UI.fiche;
    if (!f) return;
    const d = f.draft;
    d.role = String(d.role || "").trim().slice(0, 120);
    d.company = String(d.company || "").trim().slice(0, 120);
    if (!d.role) {
      f.error = "Indique le poste visé : c'est le seul champ obligatoire.";
      render({ keepScroll: true });
      const r = $("#fi-role"); if (r) r.focus();
      return;
    }
    const clean = {};
    FICHE_KEYS.forEach(k => {
      if (k === "worries") clean.worries = (d.worries || []).slice(0, 4);
      else clean[k] = String(d[k] == null ? "" : d[k]).slice(0, k === "jd" ? 15000 : 200);
    });
    let app = f.editing ? S.itw.apps.find(a => a.id === f.editing) : null;
    if (app) Object.assign(app, clean, { updatedAt: Date.now() });
    else { app = newApp(clean); S.itw.apps.push(app); }
    S.itw.current = app.id;
    if (S.profile && S.profile.situation === "entretien") {
      if (app.date) {
        S.profile.eventDate = app.date;
        const cat = deadlineFromDate(app.date);
        if (cat && E.daysUntil(app.date) >= 0) S.profile.deadline = cat;
      }
      S.plan = E.buildPlan(S.profile, app);
    }
    commit("state");
    UI.fiche = null;
    go("itw");
    toast(f.editing ? "Fiche mise à jour." : "Fiche créée. Ton programme est prêt.");
  }
  function deleteApp(id) {
    const it = S.itw;
    it.apps = it.apps.filter(a => a.id !== id);
    Object.keys(S.notes).forEach(k => { if (k.indexOf("app:" + id + ":") === 0) delete S.notes[k]; });
    if (it.current === id) it.current = it.apps.length ? it.apps[0].id : null;
    UI.confirm = null;
    commit("state");
    rerenderTool();
    toast("Candidature supprimée.");
  }

  /* Questionnaire de style */
  function quizResult(answers) {
    const keys = Object.keys(DATA.itw.styles);
    const scores = {};
    keys.forEach(k => { scores[k] = 0; });
    answers.forEach(a => { if (a in scores) scores[a]++; });
    const first = k => answers.indexOf(k);
    const order = keys.slice().sort((a, b) => (scores[b] - scores[a]) || (first(a) - first(b)));
    return { primary: order[0], secondary: scores[order[1]] > 0 ? order[1] : null, scores, at: Date.now() };
  }

  /* Banque d'histoires */
  function storyById(id) { return S.itw.stories.find(s => s.id === id); }
  function storyEmpty(s) { return !["title", "situation", "task", "action", "result", "lesson"].some(k => String(s[k] || "").trim()) && !(s.themes || []).length; }
  function setPressed(el, on) { el.classList.toggle("is-on", on); el.setAttribute("aria-pressed", String(on)); }

  /* Rafraîchissement ciblé d'un panneau du coach */
  function coachRefresh(act, arg, state, outId) {
    const sel = '[data-act="' + act + '"]' + (arg ? '[data-arg="' + String(arg).replace(/"/g, '\\"') + '"]' : "");
    const btn = $(sel);
    if (btn) {
      btn.disabled = state.status === "wait";
      const last = btn.lastChild;
      if (last && last.nodeType === 3) last.nodeValue = E.typo(state.status === "done" ? "Redemander" : "Demander au coach");
      const row = btn.parentNode;
      const stop = row && row.querySelector('[data-act="coach-stop"]');
      if (state.status === "wait" && row && !stop) row.insertAdjacentHTML("beforeend", '<button type="button" class="btn btn-quiet btn-sm" data-act="coach-stop" data-arg="' + act + '">' + V.t("Arrêter") + "</button>");
      if (state.status !== "wait" && stop) stop.remove();
    }
    const out = document.getElementById(outId);
    if (out) out.innerHTML = V.coachBlock(state);
  }
  function itwCoach(act, arg, state, prompt, outId) {
    coachCall(state, prompt, {
      render: () => coachRefresh(act, arg, state, outId),
      out: () => { const o = document.getElementById(outId); if (o) o.innerHTML = V.coachBlock(state); }
    });
  }

  /* Analyse de l'offre par le coach */
  async function jdAnalyze() {
    const app = ensureApp();
    if (!Caps.sample || String(app.jd || "").trim().length < 80) return;
    const st = UI.jdState;
    const ctl = new AbortController();
    st.status = "wait"; st.error = null; st.ctl = ctl;
    rerenderTool();
    try {
      const r = await Caps.sample.json(jdPrompt(), { modelTier: "default", cache: false, signal: ctl.signal });
      if (!r || typeof r !== "object" || Array.isArray(r)) throw { code: "invalid_json" };
      const arr = a => Array.isArray(a) ? a : [];
      app.jdAI = {
        competences: arr(r.competences).slice(0, 6).map(c => typeof c === "object" && c ? { nom: String(c.nom || "").slice(0, 80), pourquoi: String(c.pourquoi || "").slice(0, 160) } : { nom: String(c).slice(0, 80), pourquoi: "" }).filter(c => c.nom),
        questions: arr(r.questions).slice(0, 8).map(q => String(q).slice(0, 220)).filter(Boolean),
        motscles: arr(r.motscles).slice(0, 10).map(q => String(q).slice(0, 60)).filter(Boolean),
        vigilance: arr(r.vigilance).slice(0, 4).map(q => String(q).slice(0, 160)).filter(Boolean),
        at: Date.now()
      };
      st.status = "done";
      commit("state");
    } catch (e) {
      const code = e && e.code;
      if (code === "cancelled") st.status = "idle";
      else { st.status = "error"; st.error = code === "invalid_json" ? "L'analyse est arrivée dans un format illisible. Réessaie." : coachError(code); }
      if (HIDE.has(code)) UI.aiDenied = true;
    }
    st.ctl = null;
    rerenderTool();
  }

  /* Simulateur : roulette */
  function simStart() {
    const c = UI.simCfg;
    if (c.mode === "ia" && UI.ai) return simaiStart();
    const app = E.itwCurrent(S);
    const list = E.simPool(S, app, { n: c.n, jd: c.jd });
    UI.sim = { phase: "run", list, i: 0, step: "idle", time: c.time, remaining: c.time, checks: {}, answered: {}, hint: false, startedAt: Date.now(), saved: false };
    rerenderTool();
    scrollToolTop();
  }
  function simGo() {
    const sm = UI.sim;
    if (!sm) return;
    sm.step = "think"; sm.end = performance.now() + 5000; sm.remaining = 5;
    rerenderTool();
    every("sim", 200, () => {
      if (UI.sim !== sm || UI.view !== "tool") { stopTimer("sim"); return; }
      sm.remaining = Math.max(0, (sm.end - performance.now()) / 1000);
      const clock = $("#sim-clock"); if (clock) clock.textContent = E.fmtClock(Math.ceil(sm.remaining));
      const bar = $("#sim-bar"); if (bar && sm.step === "answer") bar.style.width = Math.round((1 - sm.remaining / sm.time) * 100) + "%";
      if (sm.remaining <= 0) {
        if (sm.step === "think") { sm.step = "answer"; sm.end = performance.now() + sm.time * 1000; sm.remaining = sm.time; rerenderTool(); }
        else { stopTimer("sim"); sm.step = "done"; sm.answered[sm.i] = true; rerenderTool(); }
      }
    });
  }
  function scrollToolTop() {
    const h = $("h1", viewEl);
    if (h) h.scrollIntoView({ block: "start", behavior: reduceMotion ? "auto" : "smooth" });
  }

  /* Simulateur : recruteur virtuel */
  function simaiStart() {
    const c = UI.simCfg;
    const a = { phase: "run", diff: c.diff, target: c.n, msgs: [], turns: [], asked: 0, status: "idle", error: null, draft: "", startedAt: Date.now(), evalRes: null, evalStatus: "idle", evalError: null, saved: false, streaming: false, ctl: null };
    a.turns.push({ role: "user", content: simaiIntro(a) });
    UI.simai = a;
    UI.sim = null;
    rerenderTool();
    scrollToolTop();
    simaiSend();
  }
  function simaiLogRefresh() {
    const log = $("#simai-log");
    if (!log || !UI.simai) return;
    log.innerHTML = ItwViews.chatLog(UI.simai);
    const last = log.lastElementChild;
    if (last) last.scrollIntoView({ block: "nearest", behavior: "auto" });
  }
  function simaiRefresh() {
    if (UI.view !== "tool" || UI.toolId !== "simulateur") return;
    rerenderTool();
    const log = $("#simai-log");
    const last = log && log.lastElementChild;
    if (last) last.scrollIntoView({ block: "nearest", behavior: "auto" });
    const ta = $("#sim-ans");
    if (ta && UI.simai && UI.simai.status === "idle") { try { ta.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }
  async function simaiSend() {
    const a = UI.simai;
    if (!a || !Caps.sample) return;
    const ctl = new AbortController();
    a.ctl = ctl; a.status = "wait"; a.streaming = false; a.error = null;
    const msg = { who: "rec", text: "" };
    let added = false;
    simaiRefresh();
    try {
      const res = await Caps.sample(a.turns.slice(), {
        signal: ctl.signal, modelTier: "quick", cache: false,
        onText: ({ text }) => {
          if (UI.simai !== a) return;
          if (!added) { a.msgs.push(msg); added = true; a.streaming = true; }
          msg.text = text;
          simaiLogRefresh();
        }
      });
      if (UI.simai !== a) return;
      if (!added) { a.msgs.push(msg); added = true; }
      msg.text = res.text;
      a.turns.push({ role: "assistant", content: res.text });
      a.status = "idle"; a.streaming = false;
      if (a.phase === "run") a.asked++;
      else if (a.phase === "closing") a.phase = "ended";
    } catch (e) {
      if (UI.simai !== a) return;
      if (added) a.msgs.pop();
      a.streaming = false;
      const code = e && e.code;
      a.status = "error";
      a.error = code === "cancelled" ? "Tu as arrêté le recruteur. Relance-le quand tu veux." : coachError(code);
      if (HIDE.has(code)) UI.aiDenied = true;
    }
    a.ctl = null;
    simaiRefresh();
  }
  function simaiAnswer(text, skipped) {
    const a = UI.simai;
    if (!a || a.status === "wait") return;
    let content = skipped ? "[passe]" : text;
    a.msgs.push({ who: "me", text: skipped ? "(Question passée)" : text });
    a.draft = "";
    if (a.phase === "run" && a.asked >= a.target) {
      content += "\n\n(Consigne pour le recruteur : c'était la dernière question. Demande maintenant au candidat, en une phrase, s'il a des questions pour toi.)";
      a.phase = "qa";
    } else if (a.phase === "qa") {
      content += "\n\n(Consigne pour le recruteur : réponds brièvement et de façon plausible, sans inventer de chiffres précis sur l'entreprise, puis conclus l'entretien poliment en annonçant la suite.)";
      a.phase = "closing";
    }
    a.turns.push({ role: "user", content });
    simaiSend();

  /* Respiration */
  function breathStart() {
    const b = UI.breath;
    const M = DATA.breath[b.mode];
    b.running = true; b.t0 = performance.now(); b.left = b.total; b.pi = -1;
    rerenderTool();
    const orb = () => $("#br-orb");
    const next = () => {
      b.pi = (b.pi + 1) % M.phases.length;
      const ph = M.phases[b.pi];
      b.phaseText = ph.t; b.phaseEnd = performance.now() + ph.d * 1000; b.scale = ph.s;
      const o = orb();
      if (o) { o.style.transition = reduceMotion ? "none" : "transform " + ph.d + "s ease-in-out"; o.style.transform = "scale(" + ph.s + ")"; }
      const pe = $("#br-phase"); if (pe) pe.textContent = E.typo(ph.t);
    };
    next();
    every("breath", 200, () => {
      const now = performance.now();
      b.left = Math.max(0, b.total - (now - b.t0) / 1000);
      b.count = Math.max(1, Math.ceil((b.phaseEnd - now) / 1000));
      const c = $("#br-count"); if (c) c.textContent = b.count;
      const l = $("#br-left"); if (l) l.textContent = E.fmtClock(b.left);
      if (now >= b.phaseEnd) {
        if (b.left <= 0 && b.pi === M.phases.length - 1) {
          stopTimer("breath"); b.running = false; b.scale = 0.32;
          rerenderTool();
          const pe = $("#br-phase"); if (pe) pe.textContent = E.typo("Terminé. Garde ce calme pour ta première phrase.");
          return;
        }
        next();
      }
    });
  }

  function dropTake(key) {
    const tk = UI.takes[key];
    if (tk && tk.url) { try { URL.revokeObjectURL(tk.url); } catch (e) { /* rien */ } }
    delete UI.takes[key];
  }
  function setTake(key, file) {
    if (!key || !file) return;
    dropTake(key);
    const isVideo = !/^audio\//.test(file.type) && (/^video\//.test(file.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(file.name || ""));
    const tk = { url: URL.createObjectURL(file), isVideo, dur: null };
    UI.takes[key] = tk;
    try {
      const m = document.createElement(isVideo ? "video" : "audio");
      m.preload = "metadata";
      m.muted = true;
      m.onloadedmetadata = () => { if (isFinite(m.duration) && m.duration > 0) { tk.dur = m.duration; if (UI.takes[key] === tk) rerenderTool(); } m.removeAttribute("src"); };
      m.src = tk.url;

  }

  function copyText(text, okMsg) {
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      toast(ok ? (okMsg || "Copié.") : "Sélectionne le texte et copie-le à la main.");
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg || "Copié."), fallback);
    else fallback();

    "sim-mode"(arg) { UI.simCfg.mode = arg === "ia" && UI.ai ? "ia" : "roulette"; rerenderTool(); },
    "sim-n"(arg) { UI.simCfg.n = Number(arg) || 8; rerenderTool(); },
    "sim-time"(arg) { UI.simCfg.time = Number(arg) || 90; rerenderTool(); },
    "sim-diff"(arg) { UI.simCfg.diff = arg === "exigeant" ? "exigeant" : "bienveillant"; rerenderTool(); },
    "sim-jd"(arg, el) { UI.simCfg.jd = !UI.simCfg.jd; setOn(el, UI.simCfg.jd); },
    "sim-start"() { simStart(); },
    "sim-go"() { simGo(); },
    "sim-stop"() {
      const sm = UI.sim;
      if (!sm) return;

      if (sm.step === "answer") sm.answered[sm.i] = true;
      sm.step = sm.step === "answer" ? "done" : "idle";
      rerenderTool();

    "sim-hint"() { if (UI.sim) { UI.sim.hint = !UI.sim.hint; rerenderTool(); } },

      const c = sm.checks[sm.i] || (sm.checks[sm.i] = {});

      setPressed(el, c[arg]);

      const sm = UI.sim;
      if (!sm) return;
      stopTimer("sim");
      if (sm.i < sm.list.length - 1) { sm.i++; sm.step = "idle"; sm.hint = false; }
      else sm.phase = "summary";
      rerenderTool();
      scrollToolTop();
    },

    "sim-save"() {
      const sm = UI.sim;
      if (!sm || sm.saved) return;

      saveMock({ mode: "roulette", n: st.n, checksRate: +st.avg.toFixed(3), duration: Math.min(7200, Math.round((Date.now() - sm.startedAt) / 1000)) });
      sm.saved = true;
      rerenderTool();

    "sim-reset"() {
      stopTimer("sim");

      a.phase = "ended"; a.status = "idle"; a.error = null;

    "simai-stop"() { const a = UI.simai; if (a && a.ctl) a.ctl.abort(); },

    "simai-eval"() { simaiEval(); },
    "simai-save"() {

      const n = a.msgs.filter(m => m.who === "me" && m.text !== "(Question passée)").length;
      saveMock({ mode: "ia", n, score, duration: Math.min(7200, Math.round((Date.now() - a.startedAt) / 1000)), note: prios[0] ? "Priorité : " + String(prios[0]).slice(0, 300) : "" });
      a.saved = true;
      simaiRefresh();
    },

    "ask-toggle"(arg) {

      rerenderTool();

  /* ============================================================
     ÉVÉNEMENTS
     ============================================================ */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
  });

  document.addEventListener("submit", e => {
    const form = e.target;
    const kind = form.dataset.form;
    if (!kind) return;
    e.preventDefault();
    if (kind === "coach-home") {
      const input = $("#coach-q");
      const q = input ? input.value.trim() : "";
      if (!q) return;
      const c = UI.coachHome;
      c.q = q;
      coachCall(c, homePrompt(q), {
        cache: true,
        render: () => { const f = $(".coach-home"); if (f) { const tmp = document.createElement("div"); tmp.innerHTML = V.coachHome(S, UI); f.replaceWith(tmp.firstChild); } },
        out: () => { const o = $("#coach-home-out"); if (o) o.innerHTML = V.coachBlock(c); }
      });
    }
    if (kind === "ladder-add") {
      const input = $("#ld-new");
      const text = input ? input.value.trim() : "";
      if (!text) return;
      S.ladder = S.ladder || [];
      S.ladder.push({ id: "l" + Date.now().toString(36), text: text.slice(0, 160), done: false });
      commit("state");
      rerenderTool();
      const ni = $("#ld-new"); if (ni) ni.focus();
    }
    if (kind === "fiche") saveFiche();
    if (kind === "custom-q" || kind === "ask-add") {
      const input = $(kind === "custom-q" ? "#cq-new" : "#ask-new");
      const text = input ? input.value.trim().slice(0, 200) : "";
      if (!text) return;
      (kind === "custom-q" ? S.itw.customQ : S.itw.askCustom).push(text);
      commit("state");
      rerenderTool();
      const ni = $(kind === "custom-q" ? "#cq-new" : "#ask-new"); if (ni) ni.focus();
      toast("Question ajoutée.");
    }
    if (kind === "sim-answer") {
      const a = UI.simai;
      const ta = $("#sim-ans");
      const text = String((ta && ta.value) || (a && a.draft) || "").trim().slice(0, 6000);
      if (!text) { toast("Écris ou dicte ta réponse avant de l'envoyer."); return; }
      simaiAnswer(text, false);
    }
  });

  document.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.note) {
      const key = el.dataset.note;
      const v = el.value.slice(0, 4000);
      if (v.trim()) S.notes[key] = v; else delete S.notes[key];
      commitSoon();
      if (UI.view === "tool" && UI.toolId === "conduite") {
        const live = $("#bd-live"); if (live) live.innerHTML = V.builderLive(S, UI);
        const stt = V.builderStats(S, UI.builder.sit);
        const rb = $("#bd-rehearse"); if (rb) rb.disabled = !stt.total;
        const cb = $("#bd-coach-btn"); if (cb && UI.builder.coach.status !== "wait") cb.disabled = !stt.filled;
      }
      if (UI.view === "tool" && UI.toolId === "pitch") {
        const live = $("#pitch-live"); if (live) live.innerHTML = ItwViews.pitchLive(S);
        const cb = $('[data-act="pitch-coach"]'); if (cb && UI.pitchCoach.status !== "wait") cb.disabled = !ItwViews.pitchText(S);
      }
      if (UI.view === "tool" && UI.toolId === "pieges" && /^itwq\./.test(key)) {
        const qid = key.slice(5);
        const d = document.getElementById("pq-dur-" + qid); if (d) d.textContent = E.typo(ItwViews.durTxt(v));
        const cb = $('[data-act="pq-coach"][data-arg="' + qid + '"]');
        const st = UI.pqCoach[qid];
        if (cb && !(st && st.status === "wait")) cb.disabled = v.trim().length < 20;
      }
      return;
    }
    if (el.dataset.fiche && UI.fiche) { UI.fiche.draft[el.dataset.fiche] = el.value; return; }
    if (el.dataset.avis) {
      S.avis.draft[el.dataset.avis] = el.value.slice(0, 1500);
      commitSoon();
      avisRefresh();
      return;
    }
    if (el.dataset.app === "jd") {
      const app = ensureApp();
      app.jd = el.value.slice(0, 15000);
      commitSoon();
      const btn = $('[data-act="jd-ai"]'); if (btn && UI.jdState.status !== "wait") btn.disabled = app.jd.trim().length < 80;
      clearTimeout(el._t);
      el._t = setTimeout(() => { const box = $("#jd-local"); if (box) box.innerHTML = ItwViews.jdLocal(S); }, 400);
      return;
    }
    if (el.dataset.comp != null && el.dataset.comp !== "") {
      const app = ensureApp();
      const i = Number(el.dataset.comp);
      app.comp = app.comp || [];
      while (app.comp.length <= i) app.comp.push({});
      app.comp[i] = Object.assign({}, app.comp[i], { name: el.value.slice(0, 120) });
      commitSoon();
      return;
    }
    if (el.dataset.story && UI.storyEdit) {
      const s = storyById(UI.storyEdit);
      if (!s) return;
      s[el.dataset.story] = el.value.slice(0, el.dataset.story === "title" ? 120 : 2000);
      commitSoon();
      const lint = $("#story-lint"); if (lint) lint.innerHTML = ItwViews.storyLint(s);
      const cb = $('[data-act="story-coach"]'); const st = UI.storyCoach[s.id];
      if (cb && !(st && st.status === "wait")) cb.disabled = !E.storyCheck(s).complete;
      return;
    }
    if (el.dataset.sal) {
      const app = ensureApp();
      app.salary = app.salary || {};
      app.salary[el.dataset.sal] = el.value.replace(/[^\d.,\s]/g, "").slice(0, 10);
      commitSoon();
      const live = $("#sal-live"); if (live) live.innerHTML = ItwViews.salaireLive(S);
      const off = $("#sal-offer-live"); if (off) off.innerHTML = ItwViews.offerLive(S);
      return;
    }
    if (el.dataset.merci) {
      const app = ensureApp();
      app.merci = app.merci || {};
      app.merci[el.dataset.merci] = el.value.slice(0, 600);
      commitSoon();
      const live = $("#merci-live"); if (live) live.innerHTML = ItwViews.merciLive(S);
      const cb = $('[data-act="merci-coach"]'); if (cb && UI.merciCoach.status !== "wait") cb.disabled = !String(app.merci.moment || "").trim();
      return;
    }
    if (el.id === "sim-ans" && UI.simai) {
      UI.simai.draft = el.value.slice(0, 6000);
      const est = $("#sim-ans-est"); if (est) est.textContent = E.typo(ItwViews.answerEst(UI.simai.draft));
      return;
    }
    if (el.dataset.ob && UI.ob) {
      UI.ob.draft[el.dataset.ob] = el.value;
      const step = obStep();
      if (step.type === "text" && step.optional) {
        const btn = $('[data-act="ob-next"]');
        if (btn && btn.firstChild && btn.firstChild.nodeType === 3) btn.firstChild.nodeValue = E.typo(el.value.trim() ? "Continuer" : "Passer");
      }
      return;
    }
    if (el.dataset.ladder) {
      const x = (S.ladder || []).find(r => r.id === el.dataset.ladder);
      if (x) { x.text = el.value.slice(0, 160); commitSoon(); }
      return;
    }
    if (el.id === "st-note" && UI.studio) { UI.studio.note = el.value.slice(0, 600); patchSaved(); return; }
    if (el.id === "st-transcript" && UI.studio) {
      clearTimeout(el._t);
      el._t = setTimeout(() => updateTranscript(el.value.slice(0, 20000)), 350);
    }
  });

  document.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.change === "st-file" && el.files && el.files[0]) { onStudioFile(el.files[0]); el.value = ""; return; }
    if (el.dataset.change === "take" && el.files && el.files[0]) { setTake(el.dataset.take, el.files[0]); el.value = ""; return; }
    if (el.dataset.ob === "eventDate" && UI.ob) {
      UI.ob.draft.eventDate = el.value;
      const cat = deadlineFromDate(el.value);
      if (cat && E.daysUntil(el.value) >= 0) UI.ob.draft.deadline = cat;
      render({ keepScroll: true });
    }
    if (el.dataset.change === "app-stage") {
      const app = S.itw.apps.find(a => a.id === el.dataset.id);
      if (app) { app.stage = el.value; commit("state"); rerenderTool(); toast("Étape mise à jour."); }
      return;
    }
    if (el.dataset.compStory != null && el.dataset.compStory !== "") {
      const app = ensureApp();
      const i = Number(el.dataset.compStory);
      app.comp = app.comp || [];
      while (app.comp.length <= i) app.comp.push({});
      app.comp[i] = Object.assign({}, app.comp[i], { story: el.value });
      commit("state");
      rerenderTool();
      return;
    }
    if (el.dataset.comp != null && el.dataset.comp !== "") { commit("state"); rerenderTool(); }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target && e.target.id === "ob-input" && e.target.tagName === "INPUT") {
      e.preventDefault();
      obNext();
    }
  });

  /* Déposer un enregistrement sur la page (ordinateur) */
  document.addEventListener("dragover", e => {
    if (!e.dataTransfer || Array.from(e.dataTransfer.types || []).indexOf("Files") < 0) return;
    e.preventDefault();
    const d = $("#rec-drop");
    if (d) { d.classList.add("is-over"); e.dataTransfer.dropEffect = "copy"; } else e.dataTransfer.dropEffect = "none";
  });
  document.addEventListener("dragleave", e => {
    const d = $("#rec-drop");
    if (d && (!e.relatedTarget || !d.contains(e.relatedTarget))) d.classList.remove("is-over");
  });
  document.addEventListener("drop", e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    const d = $("#rec-drop");
    if (!d) { toast("Pour analyser un enregistrement, ouvre l'onglet « Enregistrer » ou une étape du parcours."); return; }
    d.classList.remove("is-over");
    onStudioFile(e.dataTransfer.files[0]);
  });
  /* Le détail de l'analyse : mémoriser s'il est ouvert, dessiner la partition à l'ouverture */
  document.addEventListener("toggle", e => {
    const el = e.target;
    if (el && el.id === "rec-more") { UI.recMore = el.open; if (el.open) drawStudioScore(); }
  }, true);

  /* Partition : cliquer pour réécouter */
  document.addEventListener("pointerdown", e => {
    const canvas = e.target.closest && e.target.closest("#st-score");
    if (!canvas) return;
    const st = UI.studio, media = $("#st-media");
    if (!st || !st.result || !st.result.ok || !media) return;
    const rect = canvas.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - rect.left - 8) / Math.max(1, rect.width - 16)));
    try { media.currentTime = f * st.result.duration; } catch (err) { /* rien */ }
    movePlayhead();
  });

  let resizeT = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      if (UI.view === "welcome" || (UI.view === "path" && !S.profile)) drawScore($("#demo-score"), DEMO);
      if ($("#st-score")) drawStudioScore();
      if (UI.view === "progress") render({ keepScroll: true });
    }, 160);
  });
  const redrawTheme = () => {
    if (UI.view === "welcome" || (UI.view === "path" && !S.profile)) drawScore($("#demo-score"), DEMO);
    if ($("#st-score")) drawStudioScore();
  };
  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redrawTheme); } catch (e) { /* rien */ }
  try { new MutationObserver(redrawTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] }); } catch (e) { /* rien */ }

  /* ============================================================
     DÉMARRAGE
     ============================================================ */
  function buildChrome() {
    const top = $("#top");
    const tab = (id, ic, label) => '<button type="button" data-act="nav" data-arg="' + id + '" data-tab="' + id + '">' + V.icon(ic) + "<span>" + V.t(label) + "</span></button>";
    top.innerHTML = '<button type="button" class="brand" data-act="nav" data-arg="home" aria-label="' + V.esc("La Générale, accueil") + '">' + V.icon("lamp", "brand-ic") + '<span class="brand-name">La Générale</span></button>' +
      '<nav class="tabs" aria-label="' + V.esc("Navigation principale") + '">' + tab("path", "route", "Parcours") + tab("itw", "briefcase", "Entretiens") + tab("studio", "video", "Enregistrer") + tab("tools", "dumbbell", "Exercices") + tab("progress", "chart", "Progrès") + "</nav>" +
      '<div class="top-side"><button type="button" class="btn btn-quiet btn-sm hide-sm hide-md" data-act="avis-open" title="' + V.esc("Donner mon avis sur l'app") + '">' + V.icon("chat") + V.t("Mon avis") + '</button><button type="button" class="btn btn-quiet btn-sm hide-sm hide-md" data-act="nav" data-arg="methods">' + V.icon("book") + V.t("Méthodes") + '</button><button type="button" class="sync-chip" id="sync-chip" data-act="nav" data-arg="profile" data-state="local">' + V.icon("user") + "<span>" + V.t("Profil") + "</span></button></div>";
  }

  function init() {
    UI.dev = detectDevice();
    /* Hors de claude.ai (site hébergé) : pas de coach, pas d'espace de stockage partagé */
    UI.hosted = !(window.claude && typeof window.claude.use === "function");
    buildChrome();
    const local = Store.loadLocal();
    if (local) { S = local.state; J = local.journal; }
    if (S.profile && !S.plan.length) S.plan = E.buildPlan(S.profile, E.itwCurrent(S));
    if (migrateItw()) Store.saveLocal(S, J);
    UI.view = S.profile ? "path" : "welcome";
    let hash = "";
    try { hash = String(window.location.hash || "").replace("#", ""); } catch (e) { hash = ""; }
    if (hash === "entretiens") UI.view = "itw";
    render();
    updateSync();
    initCaps();
    Store.connect(() => ({ state: S, journal: J })).then(res => {
      if (!res) return;
      UI.sync = Store.mode === "cloud" ? "cloud" : UI.sync;
      updateSync();
      if (res.changed) {
        S = res.state; J = res.journal;
        if (S.profile && !S.plan.length) S.plan = E.buildPlan(S.profile, E.itwCurrent(S));
        migrateItw();
        Store.saveLocal(S, J);
        if (UI.view === "welcome" && S.profile) UI.view = "path";
        const busy = (UI.view === "tool" && (UI.sim || UI.simai || UI.storyEdit)) || (UI.view === "lesson" && UI.studio && UI.studio.file);
        if (["studio", "onboarding", "itw-fiche"].indexOf(UI.view) < 0 && !busy) render({ keepScroll: true });
      }
    }).catch(() => { /* reste en local */ });
  }

  init();
})();
</script>
</body>
</html>
