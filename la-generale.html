<script>/* ============================================================
   LA GÉNÉRALE · moteur (fonctions pures, testables hors navigateur)
   - construction du parcours
   - analyse de la voix (énergie, pauses, mélodie YIN, dynamique, rythme)
   - analyse de la transcription (débit, tics, adoucisseurs)
   ============================================================ */
const Engine = (() => {
  const LESSON = {};
  DATA.lessons.forEach((l, i) => { LESSON[l.id] = l; l._i = i; });
  const PHASE = {};
  DATA.phases.forEach((p, i) => { PHASE[p.id] = p; p._i = i; });
  const SIT = {};
  DATA.situations.forEach(s => { SIT[s.id] = s; });

  /* ---------------- Parcours ---------------- */
  function buildPlan(p, app) {
    if ((p.situation || "general") === "entretien") return buildInterviewParcours(p, app);
    const ch = new Set(p.challenges || []);
    const sit = p.situation || "general";
    const dl = p.deadline || "none";
    const anx = p.anxiety || 2;
    const budget = { urgent: 10, soon: 15, later: 20, none: 18 }[dl] || 15;

    const must = new Set(["depart", "message", "structure", "filage", "generale", "bilan"]);
    if (dl !== "none") must.add("jourj");
    if (dl !== "urgent") must.add("revue");
    if (anx >= 3) must.add("souffle");
    if (anx >= 4 && dl !== "urgent") must.add("trac");
    if (anx >= 5 && (dl === "later" || dl === "none")) must.add("echelle");

    const scores = {};
    DATA.lessons.forEach(L => {
      if (L.track === "itw") return;
      if (must.has(L.id)) return;
      if (L.id === "jourj" || L.id === "bilan" || L.id === "depart") return;
      let s = L.base || 0;
      (L.tags || []).forEach(t => { if (ch.has(t)) s += 3; });
      if ((L.sit || []).indexOf(sit) >= 0) s += 2;
      if (L.anx && anx >= L.anx) s += 2;
      if (L.longOnly) s += (dl === "later" || dl === "none") ? 1 : -6;
      if (p.experience === "jamais" && (L.id === "posture" || L.id === "regard")) s += 1;
      if (p.experience === "souvent" && L.id === "trac") s -= 2;
      if (sit === "video" && L.id === "regard") s -= 1;
      scores[L.id] = s;
    });

    const room = Math.max(0, budget - must.size);
    const minScore = dl === "urgent" ? 3 : 2;
    const optional = Object.keys(scores)
      .filter(id => scores[id] >= minScore)
      .sort((a, b) => (scores[b] - scores[a]) || (LESSON[a]._i - LESSON[b]._i))
      .slice(0, room);

    const chosen = new Set([...must, ...optional]);
    const order = (dl === "urgent" || dl === "soon")
      ? ["echauffement", "texte", "instrument", "histoire", "echange", "repetitions"]
      : ["echauffement", "instrument", "texte", "histoire", "echange", "repetitions"];
    return DATA.lessons
      .filter(L => chosen.has(L.id))
      .sort((a, b) => (order.indexOf(a.phase) - order.indexOf(b.phase)) || (a._i - b._i))
      .map(L => L.id);
  }

  /* Parcours principal quand la situation est un entretien d'embauche :
     quelques étapes de prise de parole, puis le programme d'entretien. */
  const PHASE_ORDER = ["echauffement", "instrument", "texte", "histoire", "echange", "itw-regard", "itw-enquete", "itw-histoire", "itw-pieges", "itw-jourj", "itw-apres", "repetitions"];
  function buildInterviewParcours(p, app) {
    const ch = new Set(p.challenges || []);
    const dl = p.deadline || "none";
    const anx = p.anxiety || 2;
    const left = p.eventDate ? daysUntil(p.eventDate) : null;
    const express = dl === "urgent" || (left != null && left >= 0 && left <= 2);
    const chosen = ["depart"];
    if (!express) chosen.push("revue");
    if (anx >= 3) chosen.push("souffle");
    if (anx >= 4 && !express) chosen.push("trac");
    if (anx >= 5 && (dl === "later" || dl === "none")) chosen.push("echelle");
    const pool = [
      ["posture", ["corps", "autorite"], 1], ["regard", ["corps", "captiver"], 0], ["pause", ["tics", "debit", "autorite"], 1],
      ["tics", ["tics", "concision"], 0], ["debit", ["debit", "stress"], 0], ["leviers", ["monotone", "captiver"], 0],
      ["voix3", ["questions", "stress", "autorite", "monotone"], 0]
    ];
    const room = express ? 2 : dl === "soon" ? 3 : 5;
    pool.map(([id, tags, bonus], i) => [id, tags.filter(x => ch.has(x)).length * 3 + bonus, i])
      .filter(x => x[1] > 0)
      .sort((a, b) => (b[1] - a[1]) || (a[2] - b[2]))
      .slice(0, room)
      .forEach(x => chosen.push(x[0]));
    const fiche = Object.assign({ date: p.eventDate || "", worries: [] }, app || {});
    const itw = itwPlan(fiche, { express });
    const base = chosen.filter((id, i) => chosen.indexOf(id) === i && LESSON[id])
      .sort((a, b) => (PHASE_ORDER.indexOf(LESSON[a].phase) - PHASE_ORDER.indexOf(LESSON[b].phase)) || (LESSON[a]._i - LESSON[b]._i));
    return base.concat(itw, ["bilan"]);
  }

  function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function parseDay(str) {
    if (!str || !/^\d{4}-\d{2}-\d{2}$/.test(str)) return null;
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function daysUntil(str, today) {
    const ev = parseDay(str);
    if (!ev) return null;
    return Math.round((dayStart(ev) - dayStart(today || new Date())) / 864e5);
  }

  function schedule(p, plan, today) {
    const n = plan.length;
    const base = p.minutes >= 30 ? 2 : p.minutes >= 15 ? 1 : 0.5;
    let perDay = base;
    const left = p.eventDate ? daysUntil(p.eventDate, today) : null;
    let advice = null;
    if (left != null && left >= 1) {
      const needed = Math.ceil(n / base);
      if (needed > left) {
        perDay = Math.ceil(n / left);
        advice = "Pour être prêt à temps, prévois " + perDay + " étapes par jour.";
      }
    } else if (left === 0) {
      advice = "C'est aujourd'hui : fais ta respiration, relis ta conduite et ta check-list.";
    }
    const dayOf = plan.map((id, i) => Math.floor(i / perDay) + 1);
    return { perDay, dayOf, days: n ? dayOf[n - 1] : 0, left, advice };
  }

  /* ---------------- Analyse audio ---------------- */
  const TARGET_SR = 16000;

  function downsample(samples, sr) {
    const factor = Math.max(1, Math.round(sr / TARGET_SR));
    let mean = 0;
    const len = samples.length;
    const step = Math.max(1, Math.floor(len / 20000));
    let cnt = 0;
    for (let i = 0; i < len; i += step) { mean += samples[i]; cnt++; }
    mean = cnt ? mean / cnt : 0;
    if (factor === 1) {
      const out = new Float32Array(len);
      for (let i = 0; i < len; i++) out[i] = samples[i] - mean;
      return { x: out, sr };
    }
    const n = Math.floor(len / factor);
    const out = new Float32Array(n);
    for (let i = 0, j = 0; i < n; i++, j += factor) {
      let s = 0;
      for (let k = 0; k < factor; k++) s += samples[j + k];
      out[i] = s / factor - mean;
    }
    return { x: out, sr: sr / factor };
  }

  /* YIN : estimation de la fréquence fondamentale d'une fenêtre. */
  function yin(x, start, N, sr, minF, maxF, thresh, d, cm) {
    const maxLag = Math.floor(sr / minF);
    const minLag = Math.max(2, Math.floor(sr / maxF));
    const W = N - maxLag;
    if (W < 32 || start < 0 || start + N > x.length) return 0;
    for (let tau = 1; tau <= maxLag; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) {
        const v = x[start + j] - x[start + j + tau];
        s += v * v;
      }
      d[tau] = s;
    }
    cm[0] = 1;
    let run = 0;
    for (let tau = 1; tau <= maxLag; tau++) {
      run += d[tau];
      cm[tau] = run > 0 ? (d[tau] * tau) / run : 1;
    }
    let tau = -1;
    for (let t = minLag; t <= maxLag; t++) {
      if (cm[t] < thresh) {
        while (t + 1 <= maxLag && cm[t + 1] < cm[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) return 0;
    let better = tau;
    if (tau > 1 && tau < maxLag) {
      const s0 = cm[tau - 1], s1 = cm[tau], s2 = cm[tau + 1];
      const den = 2 * (2 * s1 - s2 - s0);
      if (den !== 0) better = tau + (s2 - s0) / den;
    }
    return sr / better;
  }

  function percentile(sorted, q) {
    if (!sorted.length) return 0;
    const i = Math.min(sorted.length - 1, Math.max(0, Math.floor(q * (sorted.length - 1))));
    return sorted[i];
  }
  function mean(a) { if (!a.length) return 0; let s = 0; for (const v of a) s += v; return s / a.length; }
  function sd(a) {
    if (a.length < 2) return 0;
    const m = mean(a);
    let s = 0;
    for (const v of a) s += (v - m) * (v - m);
    return Math.sqrt(s / (a.length - 1));
  }
  function median(a) {
    if (!a.length) return 0;
    const s = Array.from(a).sort((p, q) => p - q);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }
  const tick = () => new Promise(r => setTimeout(r, 0));

  /* Analyse complète. samples : Float32Array mono ; sr : fréquence. */
  async function analyze(samples, sr, onProgress) {
    const prog = onProgress || (() => {});
    const { x, sr: rate } = downsample(samples, sr);
    const duration = x.length / rate;
    if (duration < 3) return { ok: false, reason: "short", duration };

    const hop = Math.round(rate * 0.01);
    const win = Math.round(rate * 0.025);
    const nF = Math.max(0, Math.floor((x.length - win) / hop) + 1);
    const db = new Float32Array(nF);
    for (let f = 0; f < nF; f++) {
      const i0 = f * hop;
      let s = 0;
      for (let k = 0; k < win; k++) { const v = x[i0 + k]; s += v * v; }
      db[f] = 20 * Math.log10(Math.sqrt(s / win) + 1e-9);
    }
    prog(0.08);
    await tick();

    const sorted = Float32Array.from(db).sort();
    const floor = percentile(sorted, 0.1);
    const peak = percentile(sorted, 0.95);
    if (peak < -62) return { ok: false, reason: "silent", duration };
    const spread = peak - floor;
    const thr = spread < 12 ? floor + spread * 0.45 : floor + Math.max(6, spread * 0.32);

    const mask = new Uint8Array(nF);
    for (let f = 0; f < nF; f++) mask[f] = db[f] > thr ? 1 : 0;
    const fillRuns = (val, maxLen) => {
      let f = 0;
      while (f < nF) {
        if (mask[f] === val) {
          let g = f;
          while (g < nF && mask[g] === val) g++;
          const inner = f > 0 && g < nF;
          if (inner && g - f < maxLen) for (let k = f; k < g; k++) mask[k] = val ? 0 : 1;
          f = g;
        } else f++;
      }
    };
    fillRuns(0, 25);
    let f0 = 0;
    while (f0 < nF) {
      if (mask[f0]) {
        let g = f0;
        while (g < nF && mask[g]) g++;
        if (g - f0 < 6) for (let k = f0; k < g; k++) mask[k] = 0;
        f0 = g;
      } else f0++;
    }

    const segs = [];
    for (let f = 0; f < nF;) {
      if (mask[f]) {
        let g = f;
        while (g < nF && mask[g]) g++;
        segs.push([f * 0.01, g * 0.01]);
        f = g;
      } else f++;
    }
    if (!segs.length) return { ok: false, reason: "silent", duration };

    const speechStart = segs[0][0];
    const speechEnd = segs[segs.length - 1][1];
    const active = Math.max(0.5, speechEnd - speechStart);
    let speakingTime = 0;
    segs.forEach(s => { speakingTime += s[1] - s[0]; });
    const pauses = [];
    for (let i = 1; i < segs.length; i++) {
      const gap = segs[i][0] - segs[i - 1][1];
      if (gap >= 0.6) pauses.push([segs[i - 1][1], gap]);
    }
    prog(0.15);
    await tick();

    /* Mélodie : YIN toutes les 20 ms sur les trames parlées */
    const N = Math.round(rate * 0.04);
    const minF = 70, maxF = 450;
    const maxLag = Math.floor(rate / minF);
    const dBuf = new Float32Array(maxLag + 2);
    const cBuf = new Float32Array(maxLag + 2);
    const raw = [];
    const voiced = new Uint8Array(nF);
    const chunk = 400;
    for (let f = 0; f < nF; f += 2) {
      if (mask[f] && db[f] > thr + 2) {
        const center = f * hop + (win >> 1);
        const start = center - (N >> 1);
        const hz = yin(x, start, N, rate, minF, maxF, 0.2, dBuf, cBuf);
        if (hz > minF && hz < maxF) {
          raw.push([f * 0.01, hz]);
          voiced[f] = 1;
        }
      }
      if (f % chunk === 0) {
        prog(0.15 + 0.7 * (f / nF));
        await tick();
      }
    }

    /* Nettoyage : écarter les sauts d'octave isolés */
    const clean = [];
    for (let i = 0; i < raw.length; i++) {
      const nb = [];
      for (let j = Math.max(0, i - 3); j <= Math.min(raw.length - 1, i + 3); j++) {
        if (Math.abs(raw[j][0] - raw[i][0]) <= 0.12) nb.push(raw[j][1]);
      }
      const m = median(nb);
      if (nb.length < 3 || Math.abs(Math.log2(raw[i][1] / m)) < 0.4) clean.push(raw[i]);
    }
    const f0med = median(clean.map(p => p[1]));
    let st = [];
    clean.forEach(p => {
      const v = 12 * Math.log2(p[1] / f0med);
      if (Math.abs(v) <= 12) st.push([p[0], v]);
    });
    const stVals = st.map(p => p[1]);
    const melodySd = stVals.length >= 30 ? sd(stVals) : null;
    const stSorted = stVals.slice().sort((a, b) => a - b);
    const melodyRange = stVals.length >= 30 ? percentile(stSorted, 0.9) - percentile(stSorted, 0.1) : null;

    /* Passages monotones : fenêtres de 6 s */
    const monotone = [];
    if (st.length >= 60) {
      let j0 = 0;
      for (let t = speechStart; t + 6 <= speechEnd + 0.01; t += 2) {
        while (j0 < st.length && st[j0][0] < t) j0++;
        const vals = [];
        for (let j = j0; j < st.length && st[j][0] < t + 6; j++) vals.push(st[j][1]);
        if (vals.length >= 40 && sd(vals) < 1.5) {
          const last = monotone[monotone.length - 1];
          if (last && t <= last[1]) last[1] = t + 6;
          else monotone.push([t, t + 6]);
        }
      }
    }
    prog(0.9);
    await tick();

    /* Dynamique : écart-type du volume lissé (300 ms) sur les trames parlées */
    const env = [];
    const half = 15;
    let acc = 0, cnt = 0;
    const smooth = new Float32Array(nF);
    for (let f = 0; f < Math.min(nF, half); f++) if (mask[f]) { acc += db[f]; cnt++; }
    for (let f = 0; f < nF; f++) {
      const add = f + half, rem = f - half - 1;
      if (add < nF && mask[add]) { acc += db[add]; cnt++; }
      if (rem >= 0 && mask[rem]) { acc -= db[rem]; cnt--; }
      smooth[f] = cnt > 0 ? acc / cnt : db[f];
      if (mask[f]) env.push(smooth[f]);
    }
    const dyn = env.length > 50 ? sd(env) : null;

    /* Rythme : pics d'intensité voisés (estimation des syllabes) */
    const e = new Float32Array(nF);
    for (let f = 0; f < nF; f++) {
      let s = 0, c = 0;
      for (let k = Math.max(0, f - 2); k <= Math.min(nF - 1, f + 2); k++) { s += db[k]; c++; }
      e[f] = s / c;
    }
    const near = (f) => {
      for (let k = Math.max(0, f - 3); k <= Math.min(nF - 1, f + 3); k++) if (voiced[k]) return true;
      return false;
    };
    let peaks = 0, lastPeak = -100, lastVal = 0, minSince = Infinity;
    for (let f = 1; f < nF - 1; f++) {
      if (e[f] < minSince) minSince = e[f];
      const isMax = e[f] > e[f - 1] && e[f] >= e[f + 1];
      if (isMax && mask[f] && e[f] > thr + 2 && near(f)) {
        const okDip = lastPeak < 0 || (f - lastPeak > 8 && minSince <= Math.min(lastVal, e[f]) - 1.5);
        if (okDip) { peaks++; lastPeak = f; lastVal = e[f]; minSince = Infinity; }
        else if (e[f] > lastVal && f - lastPeak <= 8) { lastVal = e[f]; lastPeak = f; minSince = Infinity; }
      }
    }
    const syl = speakingTime > 2 && peaks > 4 ? peaks / speakingTime : null;

    /* Données de dessin */
    const bins = Math.min(900, Math.max(60, Math.round(duration * 12)));
    const envDraw = [];
    for (let b = 0; b < bins; b++) {
      const fa = Math.floor((b / bins) * nF), fb = Math.max(fa + 1, Math.floor(((b + 1) / bins) * nF));
      let m = -200;
      for (let f = fa; f < fb && f < nF; f++) if (db[f] > m) m = db[f];
      envDraw.push([+(((fa + fb) / 2) * 0.01).toFixed(2), Math.max(0, Math.min(1, (m - floor) / Math.max(1, peak - floor)))]);
    }
    const stride = Math.max(1, Math.ceil(st.length / 1600));
    const pitchDraw = [];
    for (let i = 0; i < st.length; i += stride) pitchDraw.push([+st[i][0].toFixed(2), +st[i][1].toFixed(2)]);

    prog(1);
    const longest = pauses.reduce((m, p) => Math.max(m, p[1]), 0);
    return {
      ok: true,
      duration: +duration.toFixed(2),
      speechStart: +speechStart.toFixed(2),
      speechEnd: +speechEnd.toFixed(2),
      active: +active.toFixed(2),
      speakingTime: +speakingTime.toFixed(2),
      speechRatio: +(speakingTime / active).toFixed(3),
      pauses: pauses.map(p => [+p[0].toFixed(2), +p[1].toFixed(2)]),
      pauseCount: pauses.length,
      pausesPerMin: +(pauses.length / (active / 60)).toFixed(2),
      longestPause: +longest.toFixed(2),
      longPauses: pauses.filter(p => p[1] >= 2).length,
      f0: f0med ? Math.round(f0med) : null,
      melodySd: melodySd == null ? null : +melodySd.toFixed(2),
      melodyRange: melodyRange == null ? null : +melodyRange.toFixed(1),
      voicedPoints: st.length,
      monotone: monotone.map(m => [+m[0].toFixed(1), +m[1].toFixed(1)]),
      dyn: dyn == null ? null : +dyn.toFixed(2),
      syl: syl == null ? null : +syl.toFixed(2),
      env: envDraw,
      pitch: pitchDraw
    };
  }

  /* ---------------- Analyse de texte ---------------- */
  function tokenize(text) {
    return String(text || "")
      .toLowerCase()
      .replace(/[’‘`´]/g, "'")
      .split(/[^a-z0-9àâäæçéèêëîïôœöùûüÿ'\-]+/i)
      .map(t => t.replace(/^['\-]+|['\-]+$/g, ""))
      .filter(Boolean);
  }
  function countSeqs(tokens, groups) {
    const by = {};
    let total = 0;
    groups.forEach(g => {
      let c = 0;
      g.seqs.forEach(seq => {
        for (let i = 0; i + seq.length <= tokens.length; i++) {
          let ok = true;
          for (let j = 0; j < seq.length; j++) if (tokens[i + j] !== seq[j]) { ok = false; break; }
          if (ok) c++;
        }
      });
      if (c) { by[g.k] = c; total += c; }
    });
    return { by, total };
  }
  function analyzeText(text, seconds) {
    const tokens = tokenize(text);
    const words = tokens.length;
    if (!words) return null;
    const fill = countSeqs(tokens, DATA.fillers);
    const hedge = countSeqs(tokens, DATA.hedges);
    const sentences = String(text).split(/[.!?…]+/).map(s => tokenize(s).length).filter(n => n > 0);
    const minutes = seconds > 0 ? seconds / 60 : null;
    return {
      words,
      wpm: minutes ? Math.round(words / minutes) : null,
      fillers: fill.by,
      fillerTotal: fill.total,
      fillersPerMin: minutes ? +(fill.total / minutes).toFixed(1) : null,
      hedges: hedge.by,
      hedgeTotal: hedge.total,
      avgSentence: sentences.length >= 2 ? Math.round(mean(sentences)) : null,
      longestSentence: sentences.length >= 2 ? Math.max.apply(null, sentences) : null
    };
  }

  /* ---------------- Interprétation ---------------- */
  function judge(metric, v) {
    if (v == null || isNaN(v)) return null;
    switch (metric) {
      case "melody":
        if (v < 2) return { tone: "warn", label: "Plutôt monotone" };
        if (v <= 4) return { tone: "good", label: "Vivante" };
        return { tone: "good", label: "Très expressive" };
      case "dyn":
        if (v < 2.5) return { tone: "warn", label: "Volume plat" };
        if (v <= 6) return { tone: "good", label: "Nuancé" };
        return { tone: "info", label: "Très contrasté" };
      case "pauses":
        if (v < 3) return { tone: "warn", label: "Peu de pauses" };
        if (v <= 15) return { tone: "good", label: "Bien rythmé" };
        return { tone: "warn", label: "Beaucoup d'arrêts" };
      case "wpm":
        if (v < 100) return { tone: "warn", label: "Lent" };
        if (v <= 160) return { tone: "good", label: "Posé" };
        if (v <= 180) return { tone: "warn", label: "Rapide" };
        return { tone: "warn", label: "Très rapide" };
      case "fillers":
        if (v < 1) return { tone: "good", label: "Propre" };
        if (v <= 3) return { tone: "info", label: "Quelques tics" };
        return { tone: "warn", label: "Encombré" };
      case "ratio":
        if (v > 0.93) return { tone: "warn", label: "Presque sans respiration" };
        return { tone: "info", label: "" };
      default:
        return null;
    }
  }

  function recommend(audio, text) {
    const out = [];
    const add = (lesson, why) => { if (!out.some(r => r.lesson === lesson)) out.push({ lesson, why }); };
    if (audio && audio.ok) {
      if (audio.melodySd != null && audio.melodySd < 2) add("leviers", "Ta mélodie varie peu : joue avec les fondations de la voix.");
      if (audio.monotone && audio.monotone.length >= 2) add("leviers", "Plusieurs passages sonnent plats sur la partition.");
      if (audio.pausesPerMin < 3) add("pause", "Peu de pauses : ton public a besoin de respirer avec toi.");
      if (audio.dyn != null && audio.dyn < 2.5) add("leviers", "Ton volume reste au même niveau.");
      if (audio.longestPause > 6) add("impro", "Un silence de plus de six secondes : un trou de mémoire ?");
    }
    if (text) {
      if (text.fillersPerMin != null && text.fillersPerMin > 3) add("tics", "Beaucoup de tics de langage dans ta transcription.");
      if (text.hedgeTotal >= 3) add("tics", "Plusieurs mots qui affaiblissent ton propos.");
      if (text.wpm != null && text.wpm > 165) add("debit", "Ton débit est rapide.");
      if (text.longestSentence != null && text.longestSentence > 45) add("precision", "Une phrase de plus de 45 mots : découpe-la.");
    }
    return out.slice(0, 3);
  }

  /* Ce qu'on a remarqué : l'analyse traduite en constats simples, du plus utile au plus rassurant */
  function findings(r, o) {
    o = o || {};
    if (!r || !r.ok) return null;
    const out = [];
    const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
    const mins = Math.max(r.active, 1) / 60;
    if (r.melodySd != null) {
      const mono = (r.monotone || []).length;
      if (r.melodySd < 2 || mono >= 2) {
        out.push({
          k: "voix", tone: "warn", title: "Ta voix reste souvent sur la même note",
          text: (mono === 0 ? "Ta voix varie peu." : mono === 1 ? "Un passage sonne plat." : mono + " passages sonnent plats.") + " On décroche plus vite quand la voix ne bouge pas.",
          tip: "Monte sur les mots importants et laisse descendre la fin de tes phrases, comme quand tu racontes une histoire.", lesson: "leviers"
        });
      } else out.push({ k: "voix", tone: "good", title: "Ta voix est vivante", text: "Elle monte et descend : c'est agréable à écouter." });
    }
    if (r.longestPause > 6) {
      out.push({
        k: "blanc", tone: "warn", title: "Un long blanc",
        text: "Un silence de " + fmtNum(r.longestPause, 0) + " secondes : un trou de mémoire ?",
        tip: "Si tu perds le fil, redis ta dernière phrase avec d'autres mots : ça te relance.", lesson: "impro"
      });
    }
    if (r.pausesPerMin < 3) {
      out.push({
        k: "pauses", tone: "warn", title: "Tu fais peu de pauses",
        text: (r.pauseCount ? plural(r.pauseCount, "pause") : "Aucune vraie pause") + " en " + fmtDur(r.active) + ". Ton public a besoin de respirer avec toi.",
        tip: "Marque un temps d'une seconde après chaque idée importante.", lesson: "pause"
      });
    } else if (r.pausesPerMin > 15) {
      out.push({
        k: "pauses", tone: "warn", title: "Beaucoup d'arrêts",
        text: "Environ " + fmtNum(r.pausesPerMin, 0) + " pauses par minute : ton discours avance par à-coups.",
        tip: "Prépare tes premières phrases pour pouvoir les dire d'un trait.", lesson: "carte"
      });
    } else {
      out.push({ k: "pauses", tone: "good", title: "Tes pauses aident à suivre", text: plural(r.pauseCount, "pause") + " en " + fmtDur(r.active) + " : ton public a le temps de suivre." });
    }
    if (r.dyn != null) {
      if (r.dyn < 2.5) out.push({ k: "volume", tone: "warn", title: "Ton volume ne change presque pas", text: "Tout est dit avec la même force.", tip: "Parle un peu plus fort sur ce qui compte, plus doucement pour capter l'attention.", lesson: "leviers" });
      else out.push({ k: "volume", tone: "good", title: "Ton volume varie", text: "Tu appuies sur certains passages : ça donne du relief." });
    }
    const tics = (o.manualTics || 0) + (o.text ? o.text.fillerTotal || 0 : 0);
    if (o.manualTics || o.text) {
      const pm = tics / mins;
      if (pm > 3) out.push({ k: "tics", tone: "warn", title: "Beaucoup de « euh »", text: plural(tics, "tic") + " repérés, soit " + fmtNum(pm, 1) + " par minute.", tip: "Remplace chaque « euh » par un court silence : personne ne le remarque.", lesson: "tics" });
      else out.push({ k: "tics", tone: "good", title: "Peu de tics de langage", text: tics ? plural(tics, "tic") + " repérés en " + fmtDur(r.active) + "." : "Aucun « euh » repéré." });
    }
    if (o.text && o.text.wpm && o.text.words >= 60) {
      if (o.text.wpm > 165) out.push({ k: "debit", tone: "warn", title: "Tu parles vite", text: o.text.wpm + " mots par minute.", tip: "Ralentis sur les chiffres et les phrases importantes.", lesson: "debit" });
      else if (o.text.wpm < 100) out.push({ k: "debit", tone: "warn", title: "Tu parles lentement", text: o.text.wpm + " mots par minute.", tip: "Garde les pauses, mais enchaîne un peu plus vite entre elles.", lesson: "debit" });
      else out.push({ k: "debit", tone: "good", title: "Ton rythme est posé", text: o.text.wpm + " mots par minute." });
    }
    const warns = out.filter(x => x.tone === "warn");
    const list = warns.concat(out.filter(x => x.tone !== "warn"));
    let dur = "Tu as parlé " + fmtDur(r.active);
    if (o.target) {
      const ratio = r.active / o.target;
      dur += ratio < 0.6 ? ", moins que prévu (objectif : " + fmtDur(o.target) + ")." : ratio > 1.35 ? ", plus que prévu (objectif : " + fmtDur(o.target) + ")." : " (objectif : " + fmtDur(o.target) + ").";
    } else dur += ".";
    const n = warns.length;
    const verdict = n === 0 ? "Très bien : rien d'important à corriger" : n === 1 ? "Bien ! Un point à travailler" : n + " points à travailler";
    return { list, warns: n, verdict, dur, advice: warns[0] || null };
  }

  /* Comparaison point de départ / séance */
  function compare(a, b) {
    const rows = [];
    const row = (key, label, va, vb, fmt, better) => {
      if (va == null || vb == null) return;
      const diff = vb - va;
      let tone = "info";
      if (better === "up") tone = diff > 0 ? "good" : diff < 0 ? "warn" : "info";
      if (better === "down") tone = diff < 0 ? "good" : diff > 0 ? "warn" : "info";
      rows.push({ key, label, a: fmt(va), b: fmt(vb), diff, tone });
    };
    const n1 = v => fmtNum(v, 1);
    row("melodySd", "Variation de la voix (demi-tons)", a.melodySd, b.melodySd, n1, "up");
    row("pausesPerMin", "Pauses par minute", a.pausesPerMin, b.pausesPerMin, n1, null);
    row("dyn", "Variation du volume (dB)", a.dyn, b.dyn, n1, "up");
    row("monoCount", "Passages monotones", a.monoCount, b.monoCount, v => String(v), "down");
    row("wpm", "Mots par minute", a.wpm, b.wpm, v => String(Math.round(v)), null);
    row("fillersPerMin", "Tics par minute", a.fillersPerMin, b.fillersPerMin, n1, "down");
    row("syl", "Rythme (syllabes par seconde, estimé)", a.syl, b.syl, n1, null);
    return rows;
  }

  /* ---------------- Formats ---------------- */
  function fmtNum(v, d) {
    if (v == null || isNaN(v)) return "–";
    return Number(v).toFixed(d == null ? 0 : d).replace(".", ",");
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + String(s).padStart(2, "0");
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    const m = Math.floor(sec / 60), s = sec % 60;
    if (!m) return s + " s";
    return s ? m + " min " + String(s).padStart(2, "0") + " s" : m + " min";
  }
  function typo(str) {
    return String(str == null ? "" : str)
      .replace(/ ([?!:;»%])/g, " $1")
      .replace(/« /g, "« ");
  }

  /* ---------------- Entretiens ---------------- */
  function itwCurrent(S) {
    const it = S && S.itw;
    if (!it || !Array.isArray(it.apps) || !it.apps.length) return null;
    return it.apps.find(a => a.id === it.current) || null;
  }
  function appKey(S, field) {
    const id = (S && S.itw && S.itw.current) || "none";
    return "app:" + id + ":" + field;
  }
  function itwDays(app, today) { return app && app.date ? daysUntil(app.date, today) : null; }
  function itwExpress(app, today) { const d = itwDays(app, today); return d != null && d >= 0 && d <= 2; }
  function itwPriorities(app) {
    const pr = new Set();
    const w = (app && app.worries) || [];
    w.forEach(k => ((DATA.itw.worryLessons || {})[k] || []).forEach(id => pr.add(id)));
    if (app && app.type === "technique") { pr.add("e-technique"); pr.add("e-offre"); }
    if (app && app.type === "rh") pr.add("e-salaire");
    if (app && app.type === "final") pr.add("e-different");
    return pr;
  }
  function itwPlan(app, opts) {
    opts = opts || {};
    const w = new Set((app && app.worries) || []);
    const tech = (app && app.type === "technique") || w.has("technique");
    const sens = w.has("trou") || w.has("reconversion") || w.has("depart");
    const express = opts.full ? false : (opts.express != null ? opts.express : itwExpress(app));
    return DATA.lessons.filter(l => l.track === "itw").filter(l => {
      if (l.cond === "technique" && !tech) return false;
      if (!express) return true;
      return l.core || (l.id === "e-sensibles" && sens) || (l.id === "e-technique" && tech) || (l.id === "e-nego" && w.has("nego"));
    }).map(l => l.id);
  }

  function storyCheck(s) {
    s = s || {};
    const f = k => String(s[k] || "").trim();
    const complete = !!(f("title") && f("situation") && f("action") && f("result"));
    const quantified = /\d/.test(f("result"));
    const act = tokenize(f("action"));
    const je = act.filter(w => w === "je" || /^j'/.test(w) || w === "moi").length;
    const nous = act.filter(w => w === "nous" || w === "on").length;
    const words = tokenize([f("situation"), f("task"), f("action"), f("result"), f("lesson")].join(" ")).length;
    const secs = Math.round((words / 130) * 60);
    const tips = [];
    if (!f("situation")) tips.push("Ajoute le contexte en une ou deux phrases.");
    if (!f("action")) tips.push("Décris ce que tu as fait, toi.");
    else if (nous > je) tips.push("Dis « je » pour tes actions : on entend surtout « nous » ou « on ».");
    if (!f("result")) tips.push("Termine par un résultat.");
    else if (!quantified) tips.push("Ajoute un chiffre, une date ou une conséquence mesurable au résultat.");
    if (secs > 150) tips.push("Plus de deux minutes et demie à l'oral : resserre le contexte.");
    if (!(s.themes || []).length) tips.push("Choisis au moins un thème : tu sauras à quelles questions elle répond.");
    return { complete, quantified, je, nous, words, secs, tips, ready: complete && quantified };
  }

  function itwReadiness(S, J) {
    const app = itwCurrent(S);
    const n = (S && S.notes) || {};
    const has = k => !!(n[k] && String(n[k]).trim().length >= 12);
    const it = (S && S.itw) || {};
    const stories = (it.stories || []).filter(s => storyCheck(s).complete);
    const sal = (app && app.salary) || {};
    const askN = (it.ask || []).length + (it.askCustom || []).length;
    const mocks = ((J && J.sessions) || []).filter(s => s.kind === "mock").length;
    const comp = ((app && app.comp) || []).filter(c => c && String(c.name || "").trim()).length;
    const items = [
      { id: "fiche", label: "Ta fiche entretien", hint: "Poste, entreprise, date et type d'entretien", act: "fiche-edit",
        done: !!(app && app.role && app.company && app.date && app.type && app.type !== "inconnu") },
      { id: "offre", label: "L'offre décodée", hint: "Au moins trois exigences clés", act: "open-tool", arg: "offre", done: comp >= 3 },
      { id: "pitch", label: "Ton « Parlez-moi de vous »", hint: "Passé, présent, futur", act: "open-tool", arg: "pitch",
        done: has("itw.passe") && has("itw.present") && has("itw.futur") },
      { id: "histoires", label: "Trois histoires STAR", hint: stories.length >= 3 ? stories.length + " complètes" : stories.length + " sur 3 complète" + (stories.length > 1 ? "s" : ""), act: "open-tool", arg: "histoires", done: stories.length >= 3 },
      { id: "faiblesse", label: "Ton point faible", hint: "Vrai, maîtrisé, en progrès", act: "open-lesson", arg: "e-faiblesse", done: has("itw.faiblesse") },
      { id: "depart", label: "Pourquoi partir, pourquoi nous", hint: "Deux réponses tournées vers l'avenir", act: "open-lesson", arg: "e-depart",
        done: has("itw.depart") && has(appKey(S, "pourquoinous")) },
      { id: "salaire", label: "Ta stratégie salaire", hint: "Objectif et plancher", act: "open-tool", arg: "salaire", done: !!(num(sal.target) && num(sal.floor)) },
      { id: "aposer", label: "Trois questions à poser", hint: askN + " choisie" + (askN > 1 ? "s" : ""), act: "open-tool", arg: "aposer", done: askN >= 3 },
      { id: "simulation", label: "Une simulation d'entretien", hint: mocks ? mocks + " faite" + (mocks > 1 ? "s" : "") : "Roulette ou recruteur virtuel", act: "open-tool", arg: "simulateur", done: mocks >= 1 }
    ];
    const done = items.filter(i => i.done).length;
    return { items, done, total: items.length, pct: Math.round((done / items.length) * 100) };
  }

  function num(v) {
    const x = parseFloat(String(v == null ? "" : v).replace(/\s/g, "").replace(",", "."));
    return isFinite(x) && x > 0 ? x : null;
  }
  function salaryCalc(sal) {
    sal = sal || {};
    let converted = false;
    // Les champs attendent des k€ : un montant saisi en euros (48000) est ramené en k€ (48).
    const kv = v => { const x = num(v); if (x && x >= 1000) { converted = true; return Math.round(x / 100) / 10; } return x; };
    const low = kv(sal.low), high = kv(sal.high), target = kv(sal.target), floor = kv(sal.floor), offer = kv(sal.offer);
    const half = v => Math.round(v * 2) / 2;
    const ask = target ? { lo: half(target), hi: half(target * 1.1) } : null;
    const counter = offer ? half(Math.max(target || 0, offer * 1.07)) : null;
    const net = v => v ? Math.round((v * 1000 * 0.78) / 12 / 10) * 10 : null;
    const warn = [];
    if (low && high && low > high) warn.push("Le bas de ta fourchette de marché dépasse le haut.");
    if (floor && target && floor > target) warn.push("Ton plancher est au-dessus de ton objectif.");
    if (target && high && target > high * 1.15) warn.push("Ton objectif dépasse nettement le haut du marché : prépare des arguments solides.");
    if (target && low && target < low) warn.push("Ton objectif est sous le bas du marché : tu peux sans doute viser plus haut.");
    if (offer && floor && offer < floor) warn.push("L'offre est sous ton plancher.");
    return { low, high, target, floor, offer, ask, counter, net, warn, converted };
  }

  const STOP = new Set(String((DATA.itw && DATA.itw.stop) || "").split(/\s+/).filter(Boolean));
  function jdKeywords(text, max) {
    const toks = tokenize(text).map(w => w.replace(/^(l|d|j|qu|n|s|c|m|t)'/, "")).filter(Boolean);
    const ok = w => w && w.length >= 3 && !STOP.has(w) && !/^\d/.test(w);
    const uni = {}, bi = {};
    for (let i = 0; i < toks.length; i++) {
      const a = toks[i];
      if (!ok(a)) continue;
      uni[a] = (uni[a] || 0) + 1;
      const b = toks[i + 1];
      if (ok(b)) { const k = a + " " + b; bi[k] = (bi[k] || 0) + 1; }
    }
    const bis = Object.keys(bi).filter(k => bi[k] >= 2).map(k => ({ term: k, n: bi[k] }));
    const used = new Set();
    bis.forEach(x => x.term.split(" ").forEach(w => used.add(w)));
    const unis = Object.keys(uni).filter(k => uni[k] >= 2 && !used.has(k)).map(k => ({ term: k, n: uni[k] }));
    return bis.concat(unis).sort((x, y) => (y.n - x.n) || x.term.localeCompare(y.term, "fr")).slice(0, max || 16);
  }

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
    return a;
  }
  /* Tirage des questions d'une simulation : on commence par « Parlez-moi de vous »,
     on finit par « Avez-vous des questions ? », et on varie entre les deux. */
  function simPool(S, app, opts) {
    opts = opts || {};
    const Q = DATA.itw.questions;
    const n = Math.max(3, opts.n || 8);
    const w = new Set((app && app.worries) || []);
    const lvl = app && app.level, type = app && app.type;
    const fits = q => (!q.levels || q.levels.indexOf(lvl) >= 0) && (!q.worries || q.worries.some(x => w.has(x))) &&
      (!q.types || q.types.indexOf(type) >= 0 || w.has("technique"));
    const first = Q.find(q => q.id === "q-pres");
    const last = Q.find(q => q.id === "q-questions");
    const pick = (cat, k) => shuffle(Q.filter(q => q.cat === cat && fits(q) && q !== first && q !== last && q.id !== "q-accueil")).slice(0, k);
    let mid = [].concat(pick("motivation", 2), pick("experience", 3), pick("personnalite", 1));
    if (w.has("trou") || w.has("reconversion") || w.has("depart")) mid = mid.concat(pick("sensibles", 1));
    if (w.has("salaire") || type === "rh") mid = mid.concat(Q.filter(q => q.id === "q-pretentions"));
    if (lvl === "manager") mid = mid.concat(pick("management", 1));
    if (type === "technique" || w.has("technique")) mid = mid.concat(pick("technique", 1));
    if (opts.jd !== false) {
      const jd = ((app && app.jdAI && app.jdAI.questions) || []).filter(Boolean).map((q, i) => ({ id: "jd" + i, q: String(q), cat: "offre" }));
      mid = mid.concat(shuffle(jd).slice(0, 2));
    }
    const custom = ((S && S.itw && S.itw.customQ) || []).filter(Boolean).map((q, i) => ({ id: "cq" + i, q: String(q), cat: "perso" }));
    mid = mid.concat(shuffle(custom).slice(0, 1));
    const seen = new Set(mid.map(q => q.id));
    const rest = shuffle(Q.filter(q => !seen.has(q.id) && fits(q) && ["motivation", "experience", "personnalite"].indexOf(q.cat) >= 0));
    mid = shuffle(mid);
    while (mid.length < n - 2 && rest.length) mid.push(rest.shift());
    return [first].concat(mid.slice(0, n - 2), [last]);
  }

  return {
    LESSON, PHASE, SIT, PHASE_ORDER, buildPlan, schedule, daysUntil, parseDay,
    downsample, yin, analyze, tokenize, analyzeText, judge, recommend, compare, findings,
    fmtNum, fmtClock, fmtDur, typo, median, sd,
    itwCurrent, appKey, itwDays, itwExpress, itwPriorities, itwPlan, storyCheck, itwReadiness,
    salaryCalc, num, jdKeywords, simPool, shuffle
  };
})();

  };
  const icon = (n, cls) => '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICONS[n] || "") + "</svg>";

  /* ---------- petits utilitaires ---------- */
  const mod = S => DATA.modules[(S.profile && S.profile.situation) || "general"] || DATA.modules.general;
  const sitLabel = id => (E.SIT[id] || E.SIT.general).label;
  const lc = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  function lessonTitle(id, S, sitId) {
    const l = L[id];
    if (!l) return "";
    if (id === "structure") {
      const m = DATA.modules[sitId || (S && S.profile && S.profile.situation) || "general"] || DATA.modules.general;
      return "Ta conduite : " + lc(m.name);
    }
    return l.title;
  }
  function noteKey(fieldId, sit) { return COMMON.has(fieldId) || /^itw\./.test(fieldId) ? fieldId : sit + "." + fieldId; }
  /* Clé d'un champ d'étape : les champs propres à une candidature vont dans app:<id>:<champ>. */
  function fieldKey(S, f) { return f.perApp ? E.appKey(S, f.id) : f.id; }
  function nextStep(S) { return (S.plan || []).find(id => !(S.done && S.done[id])); }
  function tape(phaseId) {
    const ph = E.PHASE[phaseId];
    return '<span class="tape tape-' + (ph ? ph.tape : "f") + '" aria-hidden="true"></span>';
  }
  function mentorTags(l) {
    const ids = [l.mentor].concat(l.also || []).filter(Boolean);
    if (!ids.length) return "";
    return ids.map(id => '<span class="tag">' + t(DATA.mentors[id].name) + "</span>").join("");
  }
  function back(act, arg, label) {
    return '<button type="button" class="back" data-act="' + act + '"' + (arg ? ' data-arg="' + esc(arg) + '"' : "") + ">" + icon("left") + "<span>" + t(label) + "</span></button>";
  }
  function words(s) { return String(s || "").trim().split(/\s+/).filter(Boolean).length; }
  function fmtDay(d) {
    try { return new Intl.DateTimeFormat("fr-FR", { weekday: "short", day: "numeric", month: "short" }).format(d); }
    catch (e) { return d.toLocaleDateString(); }
  }
  function fmtShort(ts) {
    const d = new Date(ts);
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function pill(j) { return j && j.label ? '<span class="pill pill-' + j.tone + '">' + t(j.label) + "</span>" : ""; }
  function coachBlock(c, placeholder) {
    if (!c || c.status === "idle") return "";
    if (c.status === "wait") return '<div class="coach-out is-wait" aria-live="polite"><span class="dots" aria-hidden="true"></span>' + t(placeholder || "Le coach réfléchit…") + "</div>";
    if (c.status === "error") return '<div class="coach-out is-error" role="status">' + t(c.error) + "</div>";
    return '<div class="coach-out" aria-live="polite">' + md(c.text || "") + (c.truncated ? '<p class="muted small">' + t("Réponse coupée : demande moins à la fois.") + "</p>" : "") + "</div>";
  }
  /* Markdown minimal et sûr : titres en gras, puces, paragraphes */
  function md(src) {
    const lines = esc(E.typo(src)).split(/\n/);
    let html = "", inList = false;
    const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])_(.+?)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
    lines.forEach(raw => {
      const line = raw.trim();
      if (/^[-*•]\s+/.test(line)) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + inline(line.replace(/^[-*•]\s+/, "")) + "</li>";
        return;
      }
      if (inList) { html += "</ul>"; inList = false; }
      if (!line) return;
      if (/^#{1,4}\s+/.test(line)) { html += "<h4>" + inline(line.replace(/^#{1,4}\s+/, "")) + "</h4>"; return; }
      html += "<p>" + inline(line) + "</p>";
    });
    if (inList) html += "</ul>";
    return html;
  }

      "</section>" +

      '<h2 id="how-title" class="h-section">' + t("Comment ça marche") + "</h2>" +
      '<ol class="how-list">' +
      "<li><h3>" + t("Tu réponds à quelques questions") + "</h3><p>" + t("Ta situation, ta date, ton trac. Deux minutes, en touchant les réponses.") + "</p></li>" +
      "<li><h3>" + t("Tu suis tes étapes") + "</h3><p>" + t("Une étape d'une dizaine de minutes par jour, dans le bon ordre. Chaque étape te dit exactement quoi faire.") + "</p></li>" +

  /* ============================================================
     DIAGNOSTIC
     ============================================================ */
  const OB = [
    { key: "name", type: "text", q: "Comment t'appelles-tu ?", hint: "Facultatif, pour te saluer.", ph: "Ton prénom", optional: true },
    { key: "situation", type: "single", q: "Pour quelle situation veux-tu te préparer ?", options: () => DATA.situations },
    { key: "deadline", type: "deadline", q: "Quand dois-tu parler ?", options: () => DATA.deadlines },
    { key: "audience", type: "single", q: "Devant qui ?", options: () => DATA.audiences },
    { key: "anxiety", type: "single", q: "Quel est ton niveau de trac ?", options: () => DATA.anxiety },
    { key: "experience", type: "single", q: "As-tu l'habitude de parler en public ?", options: () => DATA.experience },
    { key: "challenges", type: "multi", max: 3, q: "Qu'est-ce qui te gêne le plus ?", hint: "Jusqu'à trois réponses.", options: () => DATA.challenges },
    { key: "minutes", type: "single", q: "Combien de temps par jour peux-tu y consacrer ?", options: () => DATA.minutes },
    { key: "subject", type: "text", q: "En une phrase, de quoi vas-tu parler ?", hint: "Facultatif. Le coach s'en sert pour personnaliser ses conseils.", ph: "Ex. : présenter le budget 2027 au comité de direction", optional: true, long: true }
  ];
  const optVal = o => (o.id != null ? o.id : o.v);

  function onboarding(S, UI) {
    const ob = UI.ob;
    const step = OB[ob.step];
    const d = ob.draft;
    const total = OB.length;
    let body = "";
    if (step.type === "text") {
      const v = d[step.key] || "";
      body = step.long
        ? '<textarea id="ob-input" class="input" rows="3" data-ob="' + step.key + '" placeholder="' + esc(step.ph) + '">' + esc(v) + "</textarea>"
        : '<input id="ob-input" class="input" type="text" autocomplete="given-name" data-ob="' + step.key + '" placeholder="' + esc(step.ph) + '" value="' + esc(v) + '">';
    } else {
      const multi = step.type === "multi";
      const sel = multi ? (d[step.key] || []) : d[step.key];
      body = '<div class="options' + (multi ? " is-multi" : "") + '" role="' + (multi ? "group" : "radiogroup") + '" aria-label="' + esc(step.q) + '">' +
        step.options().map(o => {
          const val = optVal(o);
          const on = multi ? sel.indexOf(val) >= 0 : String(sel) === String(val);
          return '<button type="button" class="option' + (on ? " is-on" : "") + '" role="' + (multi ? "checkbox" : "radio") + '" aria-checked="' + on + '" data-act="' + (multi ? "ob-toggle" : "ob-pick") + '" data-arg="' + esc(val) + '">' +
            '<span class="option-mark" aria-hidden="true">' + icon("check") + "</span>" +
            '<span class="option-text"><span class="option-label">' + t(o.label) + "</span>" + (o.hint ? '<span class="option-hint">' + t(o.hint) + "</span>" : "") + "</span></button>";
        }).join("") + "</div>";
      if (step.type === "deadline" && d.deadline && d.deadline !== "none") {
        body += '<div class="field date-field"><label for="ob-date">' + t("Date exacte (facultatif)") + '</label><input id="ob-date" class="input" type="date" data-ob="eventDate" value="' + esc(d.eventDate || "") + '"><p class="muted small">' + t("Avec une date, ton parcours affiche un compte à rebours et un rythme conseillé.") + "</p></div>";
      }
      if (multi) body += '<p class="muted small" aria-live="polite">' + t((sel.length || 0) + " sur " + step.max + " choisi" + (sel.length > 1 ? "s" : "")) + "</p>";
    }
    const answered = step.optional || (step.type === "multi" ? (d[step.key] || []).length > 0 : d[step.key] != null && d[step.key] !== "");
    const isLast = ob.step === total - 1;
    return '<section class="ob">' +
      '<div class="ob-top"><span class="h-label">' + t("Question " + (ob.step + 1) + " sur " + total) + '</span><div class="bar" aria-hidden="true"><span style="width:' + Math.round(((ob.step + 1) / total) * 100) + '%"></span></div></div>' +
      '<h1 class="h-display ob-q" id="ob-q">' + t(step.q) + "</h1>" +
      (step.hint ? '<p class="muted">' + t(step.hint) + "</p>" : "") +
      body +
      '<div class="ob-nav">' +
      (ob.step > 0 ? '<button type="button" class="btn btn-line" data-act="ob-back">' + icon("left") + t("Retour") + "</button>" : '<button type="button" class="btn btn-quiet" data-act="ob-cancel">' + t("Annuler") + "</button>") +
      '<button type="button" class="btn btn-primary" data-act="' + (isLast ? "ob-finish" : "ob-next") + '"' + (answered ? "" : " disabled") + ">" + t(isLast ? "Créer mon parcours" : (step.optional && !d[step.key] ? "Passer" : "Continuer")) + icon("right") + "</button>" +
      "</div></section>";
  }

  /* ============================================================
     PARCOURS PRÊT
     ============================================================ */
  function ready(S, UI) {
    const p = S.profile;
    const sch = E.schedule(p, S.plan);
    const perDayTxt = sch.perDay < 1 ? "une étape tous les deux jours" : sch.perDay === 1 ? "une étape par jour" : sch.perDay + " étapes par jour";
    const chips = [sitLabel(p.situation), (DATA.deadlines.find(x => x.id === p.deadline) || {}).label, "Trac : " + p.anxiety + "/5"]
      .concat((p.challenges || []).map(c => (DATA.challenges.find(x => x.id === c) || {}).label))
      .filter(Boolean).map(c => '<span class="chip">' + t(c) + "</span>").join("");

      planList(S, UI, { compact: true }) +
      '<div class="sticky-cta"><button type="button" class="btn btn-primary btn-lg" data-act="open-lesson" data-arg="' + S.plan[0] + '">' + t("Commencer la première étape") + icon("right") + "</button></div>" +
      "</section>";
  }

  /* Liste du parcours groupée par phase */
  function planList(S, UI, opts) {
    opts = opts || {};
    const plan = opts.plan || S.plan;
    const pr = opts.pr || null;
    const fromAttr = opts.from ? ' data-from="' + esc(opts.from) + '"' : "";
    const sch = !opts.plan && S.profile ? E.schedule(S.profile, S.plan) : null;
    const next = plan.find(id => !(S.done && S.done[id]));
    const groups = [];
    plan.forEach((id, i) => {
      const l = L[id];
      if (!l) return;
      const g = groups[groups.length - 1];
      if (!g || g.phase !== l.phase) groups.push({ phase: l.phase, items: [] });
      groups[groups.length - 1].items.push({ id, i });
    });
    const today = new Date();
    return '<div class="plan">' + groups.map(g => {
      const ph = E.PHASE[g.phase];
      return '<div class="phase"><div class="phase-head">' + tape(g.phase) + '<h2 class="h-phase">' + t(ph.label) + '</h2><span class="phase-sub">' + t(ph.sub) + "</span></div>" +
        '<ol class="steps" start="' + (g.items[0].i + 1) + '">' + g.items.map(({ id, i }) => {
          const l = L[id];
          const done = S.done && S.done[id];
          const isNext = id === next;
          const review = done && done.feel === "dur";
          let when = "";
          if (sch && !opts.compact) {
            const day = sch.dayOf[i];
            if (S.profile.eventDate) {
              const d = new Date(today); d.setDate(d.getDate() + day - 1);
              when = fmtDay(d);
            } else when = "Jour " + day;
          }
          const status = done ? (review ? '<span class="pill pill-warn">' + t("À revoir") + "</span>" : '<span class="pill pill-good">' + t("Fait") + "</span>") : isNext ? '<span class="pill pill-accent">' + t("Prochaine") + "</span>" : (pr && pr.has(id) ? '<span class="pill pill-info">' + t("Pour toi") + "</span>" : "");
          const meta = [when, l.min + " min", l.mentor ? DATA.mentors[l.mentor].name : null].filter(Boolean).map(x => t(x)).join(" · ");
          return '<li class="step' + (done ? " is-done" : "") + (isNext ? " is-next" : "") + ' tape-' + E.PHASE[l.phase].tape + '">' +
            '<button type="button" class="step-btn" data-act="open-lesson" data-arg="' + id + '"' + fromAttr + ">" +
            '<span class="mark" aria-hidden="true">' + (done ? icon("check") : String(i + 1).padStart(2, "0")) + "</span>" +
            '<span class="step-body"><span class="step-title">' + t(lessonTitle(id, S)) + '</span><span class="step-short">' + t(l.short) + '</span><span class="step-meta">' + meta + "</span></span>" +
            '<span class="step-status">' + status + "</span></button></li>";
        }).join("") + "</ol></div>";
    }).join("") + "</div>";
  }

  /* ============================================================
     PARCOURS (accueil quand un profil existe)
     ============================================================ */
  function path(S, J, UI) {
    if (!S.profile) return welcome(S, UI);
    const p = S.profile;
    const next = nextStep(S);
    const doneCount = S.plan.filter(id => S.done[id]).length;
    const left = p.eventDate ? E.daysUntil(p.eventDate) : null;
    const sch = E.schedule(p, S.plan);
    const greet = p.name ? "Bonjour " + p.name : "Ton parcours";
    const countdown = left != null && left >= 0
      ? '<div class="countdown" aria-label="' + esc(left === 0 ? "C'est aujourd'hui" : "J moins " + left) + '"><span class="cd-num">' + (left === 0 ? "J" : "J-" + left) + '</span><span class="cd-sub">' + t(left === 0 ? "c'est aujourd'hui" : "avant ta prise de parole") + "</span></div>"
      : "";
    const segs = S.plan.map(id => '<span class="seg tape-' + E.PHASE[L[id].phase].tape + (S.done[id] ? " is-done" : "") + '"></span>').join("");
    const toReview = S.plan.filter(id => S.done[id] && S.done[id].feel === "dur");
    const recs = (S.lastRecs || []).filter(r => S.plan.indexOf(r.lesson) < 0 && L[r.lesson]);
    let nextCard = "";
    if (next) {
      const l = L[next];
      nextCard = '<div class="next-card">' +
        '<p class="h-label">' + t((doneCount ? "Ta prochaine étape" : "Ta première étape") + " · " + (S.plan.indexOf(next) + 1) + " sur " + S.plan.length) + "</p>" +
        '<h2 class="h-title">' + t(lessonTitle(next, S)) + "</h2>" +
        '<p class="muted">' + t(l.short) + " · " + t("≈ " + l.min + " min") + "</p>" +
        '<button type="button" class="btn btn-primary btn-lg" data-act="open-lesson" data-arg="' + next + '">' + t(doneCount ? "Continuer" : "Commencer") + icon("right") + "</button></div>";
    } else {
      nextCard = '<div class="next-card"><p class="h-label">' + t("Parcours terminé") + '</p><h2 class="h-title">' + t("Bravo. Tu as tout répété.") + '</h2><p class="muted">' + t("Continue à te filmer de temps en temps, ou refais tes réponses aux questions pour un nouveau défi.") + '</p><div class="row gap"><button type="button" class="btn btn-primary" data-act="nav" data-arg="studio">' + icon("video") + t("M'enregistrer") + '</button><button type="button" class="btn btn-line" data-act="ob-edit">' + t("Nouveau diagnostic") + "</button></div></div>";
    }
    return '<section class="dash">' +
      '<div class="dash-head"><div><p class="kicker"><span class="tape tape-c" aria-hidden="true"></span>' + t(sitLabel(p.situation)) + '</p><h1 class="h-display">' + t(greet) + "</h1>" +
      (sch.advice ? '<p class="muted">' + t(sch.advice) + "</p>" : "") + "</div>" + countdown + "</div>" +
      '<div class="progress-line"><div class="segs" aria-hidden="true">' + segs + '</div><p class="small"><strong>' + doneCount + "</strong> " + t("sur " + S.plan.length + " étapes faites") + "</p></div>" +
      nextCard +
      (doneCount === 0 ? '<div class="panel slim guide"><p class="h-label">' + t("Comment ça marche") + '</p><ol class="guide-list">' +
        "<li>" + t("Ouvre ta prochaine étape : une dizaine de minutes.") + "</li>" +
        "<li>" + t("Lis la technique, puis fais l'exercice. Souvent, tu te filmes avec ton téléphone.") + "</li>" +
        "<li>" + t("Valide l'étape. Reviens demain pour la suivante.") + "</li></ol></div>" : "") +
      itwCard(S, J) +
      (toReview.length ? '<div class="panel slim"><p class="h-label">' + t("À revoir") + '</p><div class="row gap wrap">' + toReview.map(id => '<button type="button" class="btn btn-line btn-sm" data-act="open-lesson" data-arg="' + id + '">' + t(lessonTitle(id, S)) + "</button>").join("") + "</div></div>" : "") +
      (recs.length ? '<div class="panel slim"><p class="h-label">' + t("Suggéré par ta dernière analyse") + "</p>" + recs.map(r => '<div class="rec"><div><strong>' + t(L[r.lesson].title) + '</strong><p class="muted small">' + t(r.why) + '</p></div><button type="button" class="btn btn-line btn-sm" data-act="add-lesson" data-arg="' + r.lesson + '">' + icon("plus") + t("Ajouter") + "</button></div>").join("") + "</div>" : "") +
      avisPanel(S, doneCount) +
      (UI.ai ? coachHome(S, UI) : "") +
      planList(S, UI, {}) +
      "</section>";
  }

  /* Rappel de l'entretien à venir, sur l'accueil du parcours */
  function itwCard(S, J) {
    const app = E.itwCurrent(S);
    const isItw = S.profile && S.profile.situation === "entretien";
    if (!app && !isItw) return "";
    if (!app) {
      return '<div class="panel slim itw-card"><div><p class="h-label">' + t("Préparation aux entretiens") + "</p><p>" + t("Complète ta fiche entretien pour adapter ton programme.") + '</p></div><button type="button" class="btn btn-line btn-sm" data-act="fiche-edit">' + icon("briefcase") + t("Ma fiche") + "</button></div>";
    }
    const d = E.itwDays(app);
    const rd = E.itwReadiness(S, J);
    const title = (app.role || "Ton entretien") + (app.company ? " chez " + app.company : "");
    const when = d == null ? "" : d < 0 ? "" : d === 0 ? "C'est aujourd'hui" : d === 1 ? "C'est demain" : "Dans " + d + " jours";
    return '<div class="panel slim itw-card"><div class="itw-card-main"><p class="h-label">' + t("Ton entretien" + (when ? " · " + when : "")) + '</p><p class="itw-card-title">' + t(title) + '</p><div class="mini-meter" aria-hidden="true"><span style="width:' + rd.pct + '%"></span></div><p class="muted small">' + t("Prêt à " + rd.pct + " %") + '</p></div><button type="button" class="btn btn-primary btn-sm" data-act="nav" data-arg="itw">' + icon("briefcase") + t("Mon espace Entretiens") + "</button></div>";
  }

  function coachHome(S, UI) {
    const c = UI.coachHome || { status: "idle" };
    return '<form class="panel coach-home" data-form="coach-home">' +
      '<label class="h-label" for="coach-q">' + t("Une question pour le coach ?") + "</label>" +
      '<div class="coach-row"><input id="coach-q" class="input" type="text" maxlength="400" placeholder="' + esc("Ex. : comment gérer un trou de mémoire en plein pitch ?") + '" value="' + esc(c.q || "") + '">' +
      '<button type="submit" class="btn btn-primary"' + (c.status === "wait" ? " disabled" : "") + ">" + icon("chat") + t("Demander") + "</button></div>" +
      '<div id="coach-home-out">' + coachBlock(c) + "</div>" +
      "</form>";
  }

  /* ============================================================
     LEÇON
     ============================================================ */
  function lesson(S, J, UI) {
    const id = UI.lessonId;
    const l = L[id];
    if (!l) return path(S, J, UI);
    const sit = (S.profile && S.profile.situation) || "general";
    const m = DATA.modules[sit] || DATA.modules.general;
    const isItw = l.track === "itw";
    const app = E.itwCurrent(S);
    const viaItw = isItw && (UI.from === "itw" || S.plan.indexOf(id) < 0);
    let plan = S.plan;
    if (viaItw) {
      plan = E.itwPlan(app, { express: E.itwExpress(app) && !UI.itwFull });
      if (plan.indexOf(id) < 0) plan = E.itwPlan(app, { full: true });
    }
    const idx = plan.indexOf(id);
    const fromAttr = viaItw ? ' data-from="itw"' : "";
    const done = S.done[id];
    const ph = E.PHASE[l.phase];
    const isStruct = id === "structure";
    const why = isStruct ? m.why : l.why;
    const points = isStruct ? m.tips.map(x => [null, x]) : l.points;
    const mentorId = isStruct ? m.mentor : l.mentor;
    const blockHead = (n, label) => '<h2 class="l-h"><span class="l-num" aria-hidden="true">' + n + '</span><span>' + t(label) + "</span></h2>";
    let h = '<article class="lesson">' + (viaItw ? back("nav", "itw", "Entretiens") : back("nav", "path", "Mon parcours")) +
      '<div class="lesson-meta">' + tape(l.phase) + '<span class="h-label">' + t(ph.label) + "</span>" +
      (idx >= 0 ? '<span class="muted small">' + t((viaItw ? "Entretien · étape " : "Étape ") + (idx + 1) + " sur " + plan.length) + "</span>" : '<span class="muted small">' + t("Hors parcours") + "</span>") +
      '<span class="muted small">' + t("≈ " + l.min + " min") + "</span></div>" +
      '<h1 class="h-display">' + t(lessonTitle(id, S)) + "</h1>" +
      '<div class="tags">' + (isStruct ? (mentorId ? '<span class="tag">' + t(DATA.mentors[mentorId].name) + "</span>" : "") : mentorTags(l)) + "</div>" +
      (why ? '<p class="lead">' + t(why) + "</p>" : "");
    const hasUnderstand = (points && points.length) || id === "bilan" || isStruct;
    h += '<ol class="l-map" aria-label="' + esc("Les parties de cette étape") + '">' +
      (hasUnderstand ? '<li><button type="button" data-act="jump" data-arg="l-1"><span class="l-map-n">1</span>' + t("Comprendre") + "</button></li>" : "") +
      '<li><button type="button" data-act="jump" data-arg="todo-title"><span class="l-map-n">' + (hasUnderstand ? 2 : 1) + "</span>" + t("À toi") + "</button></li>" +
      '<li><button type="button" data-act="jump" data-arg="finish"><span class="l-map-n">' + (hasUnderstand ? 3 : 2) + "</span>" + t("Valider") + "</button></li></ol>";

    /* 1. Comprendre */
    if (hasUnderstand) {
      h += '<section class="l-block" id="l-1" aria-label="' + esc("Comprendre") + '">' + blockHead(1, "Comprendre");
      if (points && points.length) {
        h += '<dl class="points">' + points.map(p => (p[0] ? "<dt>" + t(p[0]) + "</dt>" : "") + "<dd" + (p[0] ? "" : ' class="solo"') + ">" + t(p[1]) + "</dd>").join("") + "</dl>";
      }
      if (l.source) h += '<p class="source"><span class="h-label">' + t("D'où ça vient") + "</span> " + t(l.source) + ' <button type="button" class="link" data-act="nav" data-arg="methods">' + t("Les six méthodes") + "</button></p>";
      if (id === "bilan") h += bilanBlock(S, J);
      if (isStruct) h += '<div class="panel slim"><p class="h-label">' + t("Structure : " + m.name) + '</p><ol class="structure-list">' + m.fields.map(f => {
        const v = S.notes[noteKey(f.id, sit)];
        return '<li class="' + (v ? "is-filled" : "") + '">' + t(f.label) + (v ? ' <span class="pill pill-good">' + t("rempli") + "</span>" : "") + "</li>";
      }).join("") + "</ol></div>";
      h += "</section>";
    }

    /* 2. À toi */
    const task = l.task;
    const hasRec = !!(task.studio && UI.studio && UI.studio.ctx && UI.studio.ctx.lessonId === id);
    h += '<section class="l-block todo" aria-labelledby="todo-title">' + blockHead(hasUnderstand ? 2 : 1, "À toi") + '<p class="todo-title" id="todo-title">' + t(task.title) + "</p>";
    if (task.steps && task.steps.length) h += '<ol class="todo-steps">' + task.steps.map(s => "<li>" + t(s) + "</li>").join("") + "</ol>";
    if (task.fields) h += task.fields.map(f => { const key = fieldKey(S, f); return field(key, f.label, f.ph, f.rows, S.notes[key]); }).join("");
    let checklist = task.checklist ? task.checklist.map((c, i) => [id + ":" + i, c]) : null;
    if (id === "jourj") checklist = checklist.concat((m.dayof || []).map((c, i) => [id + ":" + (task.checklist.length + i), c]));
    if (task.checklistItw) {
      const fmt = (app && app.format) || "presentiel";
      checklist = DATA.itw.veille.map((c, i) => [id + ":v" + i, c]).filter(x => x[1].f === "all" || x[1].f === fmt).map(x => [x[0], x[1].t]);
      h += '<p class="muted small">' + t("Format : " + ((DATA.itw.formats.find(f => f.id === fmt) || {}).label || "En personne") + ". Tu peux le changer dans ta fiche.") + "</p>";
    }
    if (checklist) {
      h += '<ul class="checks is-todo">' + checklist.map(([key, c]) => {
        const on = !!S.checks[key];
        return '<li><button type="button" class="check' + (on ? " is-on" : "") + '" role="checkbox" aria-checked="' + on + '" data-act="check" data-arg="' + esc(key) + '"><span class="box" aria-hidden="true">' + icon("check") + "</span><span>" + t(c) + "</span></button></li>";
      }).join("") + "</ul>";
    }
    if (id === "e-veille" && S.notes["itw.confiance"]) {
      h += '<div class="well"><p class="h-label">' + t("Ta phrase de confiance") + '</p><p class="script">' + t("Ils auraient de la chance de m'embaucher, parce que " + S.notes["itw.confiance"]) + "</p></div>";
    }
    if (id === "jourj" && (S.notes.intention || S.notes.message)) {
      h += '<div class="well">' + (S.notes.intention ? '<p class="h-label">' + t("Ton intention") + '</p><p class="script">' + t("Je parle pour que " + S.notes.intention) + "</p>" : "") +
        (S.notes.message ? '<p class="h-label">' + t("Ta phrase clé") + '</p><p class="script">' + t(S.notes.message) + "</p>" : "") + "</div>";
    }
    if (task.tool) {
      h += '<div class="row gap wrap"><button type="button" class="btn ' + (hasRec ? "btn-line" : "btn-primary btn-lg") + '" data-act="open-tool" data-arg="' + task.tool + '">' + icon(TOOLS[task.tool].icon) + t(TOOLS[task.tool].open || "Ouvrir : " + TOOLS[task.tool].label) + "</button></div>";
    }
    if (hasRec) {
      h += '<div class="lesson-rec">' + recorder(S, J, UI) + "</div>";
    } else if (task.studio) {
      h += '<div class="row gap wrap"><button type="button" class="btn btn-primary btn-lg" data-act="open-studio" data-arg="' + id + '">' + icon("video") + t("M'enregistrer") + "</button></div>";
    }
    h += "</section>";

    /* 3. Valider */
    const nextId = idx >= 0 ? plan.slice(idx + 1).find(x => !S.done[x]) || (idx < plan.length - 1 ? plan[idx + 1] : null) : null;
    h += '<section class="l-block finish' + (done ? " is-done" : "") + '" id="finish" aria-labelledby="fin-title">' + blockHead(hasUnderstand ? 3 : 2, "Valider").replace('<h2 class="l-h">', '<h2 class="l-h" id="fin-title">');
    if (done) {
      const nl = nextId && L[nextId];
      h += '<div class="bravo"><p class="bravo-title">' + icon("check") + t(UI.justDone === id ? "Bravo, étape faite !" : "Étape faite") + "</p>" +
        (nl ? '<p class="bravo-next">' + t("Prochaine étape : ") + "<strong>" + t(lessonTitle(nextId, S)) + "</strong>" + t(" · ≈ " + nl.min + " min") + "</p>" : '<p class="bravo-next">' + t(viaItw ? "Tu as fait tout le programme. Fais encore une simulation la veille." : "C'était la dernière étape de ton parcours. Bravo !") + "</p>") +
        '<div class="row gap wrap">' +
        (nl ? '<button type="button" class="btn btn-primary btn-lg" data-act="open-lesson" data-arg="' + nextId + '"' + fromAttr + ">" + t("Continuer") + icon("right") + "</button>" : "") +
        '<button type="button" class="btn btn-line" data-act="nav" data-arg="' + (viaItw ? "itw" : "path") + '">' + t(viaItw ? "Retour aux entretiens" : "Retour à mon parcours") + "</button></div>" +
        (nl && !viaItw && S.profile ? '<p class="muted small">' + t("Une étape par jour suffit. Tu peux t'arrêter là pour aujourd'hui.") + "</p>" : "") +
        '<p class="small bravo-avis"><button type="button" class="link" data-act="avis-open" data-arg="' + id + '">' + t("Une remarque sur cette étape ? Donne ton avis") + "</button></p></div>" +
        '<details class="more slim-more"><summary>' + t("Changer mon ressenti ou refaire cette étape") + "</summary>" + feelChoice(done.feel) +
        '<button type="button" class="btn btn-line btn-sm" data-act="undo-lesson" data-arg="' + id + '">' + t("Marquer comme à refaire") + "</button></details>";
    } else {
      h += '<p class="muted">' + t("Comment ça s'est passé ? (facultatif)") + "</p>" + feelChoice(UI.feel) +
        '<div class="row gap wrap"><button type="button" class="btn btn-primary btn-lg" data-act="done-lesson" data-arg="' + id + '">' + icon("check") + t("J'ai fini cette étape") + "</button>" +
        (idx < 0 && S.profile && !isItw ? '<button type="button" class="btn btn-line" data-act="add-lesson" data-arg="' + id + '">' + icon("plus") + t("Ajouter à mon parcours") + "</button>" : "") + "</div>" +
        (UI.feel === "dur" ? '<p class="muted small">' + t("Elle restera marquée « à revoir » sur ton parcours. C'est normal qu'il faille plusieurs essais.") + "</p>" : "");
    }
    h += "</section></article>";
    return h;
  }
  function feelChoice(feel) {
    return '<div class="seg-choice" role="radiogroup" aria-label="' + esc("Ressenti") + '">' +
      [["dur", "Difficile"], ["ok", "Correct"], ["facile", "Facile"]].map(([k, lab]) => '<button type="button" role="radio" aria-checked="' + (feel === k) + '" class="' + (feel === k ? "is-on" : "") + '" data-act="feel" data-arg="' + k + '">' + t(lab) + "</button>").join("") + "</div>";
  }

  function field(key, label, ph, rows, value) {
    const id = "f-" + key.replace(/[^a-z0-9]/gi, "-");
    return '<div class="field"><label for="' + id + '">' + t(label) + "</label>" +
      '<textarea id="' + id + '" class="input" rows="' + (rows || 2) + '" data-note="' + esc(key) + '" placeholder="' + esc(ph || "") + '">' + esc(value || "") + "</textarea></div>";
  }

  function baselineOf(J) { return (J.sessions || []).find(s => s.kind === "baseline") || null; }
  function latestRehearsal(J, exceptId) {
    const list = (J.sessions || []).filter(s => s.id !== exceptId && s.kind !== "baseline");
    return list.find(s => s.kind === "rehearsal") || list[0] || null;
  }
  function bilanBlock(S, J) {
    const base = baselineOf(J);
    const last = latestRehearsal(J, base && base.id);
    if (!base || !last) return '<div class="panel slim"><p class="h-label">' + t("Avant, après") + '</p><p class="muted">' + t("Pour voir la comparaison, il te faut ton point de départ (la première étape) et au moins un autre essai filmé.") + "</p></div>";
    return compareTable(base, last, "Point de départ", last.kind === "rehearsal" ? "Générale" : "Dernière séance");
  }
  function compareTable(a, b, la, lb) {
    const rows = E.compare(a, b);
    if (!rows.length) return "";
    return '<div class="panel slim"><p class="h-label">' + t("Avant, après") + '</p><div class="table-wrap"><table class="cmp"><thead><tr><th scope="col">' + t("Mesure") + '</th><th scope="col">' + t(la) + '</th><th scope="col">' + t(lb) + '</th><th scope="col"><span class="sr">' + t("Évolution") + "</span></th></tr></thead><tbody>" +
      rows.map(r => "<tr><th scope=\"row\">" + t(r.label) + "</th><td>" + esc(r.a) + "</td><td><strong>" + esc(r.b) + '</strong></td><td><span class="pill pill-' + r.tone + '">' + (r.diff > 0 ? "▲" : r.diff < 0 ? "▼" : "=") + "</span></td></tr>").join("") +
      "</tbody></table></div><p class=\"muted small\">" + t("Mesures indicatives : compare des enregistrements faits dans des conditions proches.") + "</p></div>";
  }

  /* ============================================================
     ENREGISTREUR (page Enregistrer et étapes du parcours)
     Dans claude.ai, la page ne peut pas ouvrir le micro elle-même :
     sur téléphone, le sélecteur de fichier ouvre la caméra ; sur
     ordinateur, on dépose un fichier enregistré avec l'app du système.
     ============================================================ */
  const ACCEPT = "audio/*,video/*,.m4a,.mov,.mp4,.mp3,.wav,.webm,.ogg,.aac,.3gp";
  function fileInput(id, accept, capture, extra) {
    return '<input id="' + id + '" class="rec-input" type="file" accept="' + accept + '"' + (capture ? ' capture="' + capture + '"' : "") + ' data-change="st-file"' + (extra || "") + ">";
  }

  function studio(S, J, UI) {
    const st = UI.studio;
    const ctx = st.ctx || {};
    const l = ctx.lessonId ? L[ctx.lessonId] : null;
    const title = l ? lessonTitle(ctx.lessonId, S) : (ctx.title || "Enregistre-toi");
    return '<section class="studio">' +
      (l ? back("open-lesson", ctx.lessonId, "Retour à l'étape") : ctx.back ? back(ctx.back.act, ctx.back.arg, ctx.back.label) : "") +
      '<p class="kicker"><span class="tape tape-b" aria-hidden="true"></span>' + t(ctx.kind === "baseline" ? "Ton point de départ" : ctx.kind === "rehearsal" ? "Répétition" : "Enregistrer") + "</p>" +
      '<h1 class="h-display">' + t(title) + "</h1>" +
      (st.file ? "" : '<p class="lead">' + t("Parle quelques minutes, puis revois-toi : l'app te dit ce qui va bien et ce qu'il faut travailler.") + "</p>") +
      recorder(S, J, UI) +
      "</section>";
  }

  /* Le sujet à traiter (question d'entretien, sujet au hasard…) */
  function promptCard(st, always) {
    const ctx = st.ctx || {};
    const prompt = ctx.prompt || st.topic || "";
    if (!prompt && !always) return "";
    return '<div class="prompt-card"><p class="h-label">' + t(ctx.prompt && /\?\s*$/.test(ctx.prompt) ? "La question" : "De quoi parler") + "</p>" +
      '<p class="prompt-text" id="st-prompt">' + t(prompt || "Parle de ce que tu veux.") + "</p>" +
      (!ctx.prompt && !st.file ? '<button type="button" class="btn btn-quiet btn-sm" data-act="st-topic">' + icon("dice") + t("Un autre sujet") + "</button>" : "") + "</div>";
  }

  function recorder(S, J, UI) {
    const st = UI.studio;
    if (!st) return "";
    return '<div class="recorder" id="rec">' + promptCard(st, UI.view === "studio") +
      (st.file
        ? '<div id="st-player">' + studioPlayer(S, J, UI) + '</div><div id="st-results">' + studioResults(S, J, UI) + "</div>"
        : recCapture(S, UI)) +
      "</div>";
  }

  /* Avant l'enregistrement : un seul geste à faire */
  function recCapture(S, UI) {
    const st = UI.studio;
    const dev = UI.dev || {};
    const target = (st.timer && st.timer.target) || 60;
    const dur = E.fmtDur(target);
    let h = "";
    if (dev.phone) {
      h += '<label class="rec-cta" for="rec-cam"><span class="rec-dot" aria-hidden="true"></span>' +
        '<span class="rec-cta-text"><span class="rec-cta-main">' + t("Me filmer") + '</span><span class="rec-cta-sub">' + t("La caméra de ton téléphone s'ouvre") + "</span></span>" +
        fileInput("rec-cam", "video/*", "user") + "</label>" +
        (UI.view === "lesson"
          ? '<p class="rec-how-line">' + t("Parle environ " + dur + ", arrête la vidéo, puis appuie sur « Utiliser la vidéo » (ou « OK ») : tu te revois ici, avec ce que l'app a remarqué.") + "</p>"
          : '<ol class="rec-how">' +
            "<li>" + t("Parle environ " + dur + ".") + "</li>" +
            "<li>" + t("Arrête la vidéo, puis appuie sur « Utiliser la vidéo » (ou « OK »).") + "</li>" +
            "<li>" + t("Tu te revois ici, avec ce que l'app a remarqué.") + "</li></ol>") +
        '<p class="muted small rec-note">' + t("Tu préfères ne pas te montrer ? Filme le plafond : seule ta voix compte pour l'analyse. La vidéo reste sur ton téléphone.") + "</p>" +
        '<div class="rec-links"><label class="rec-alt" for="rec-file">' + icon("folder") + "<span>" + t("Choisir une vidéo ou un son déjà enregistré") + "</span>" + fileInput("rec-file", ACCEPT, null) + "</label>" +
        '<button type="button" class="link small" data-act="dev-switch" data-arg="desk">' + t("Je suis sur un ordinateur") + "</button></div>";
    } else {
      const os = dev.os;
      const steps = os === "windows"
        ? ["Ouvre l'application « Enregistreur audio » : appuie sur la touche Windows, puis tape « enregistreur ».", "Clique sur le bouton rond, parle environ " + dur + ", puis arrête.", "Ton fichier est rangé dans Documents, dossier « Enregistrements audio » : choisis-le ci-dessous."]
        : os === "mac"
          ? ["Ouvre l'application « Dictaphone » : appuie sur Cmd et Espace, puis tape « Dictaphone ».", "Clique sur le bouton rouge, parle environ " + dur + ", puis clique sur « OK ».", "Fais glisser l'enregistrement de la liste jusqu'ici, ou dépose-le d'abord sur ton bureau puis choisis-le ci-dessous."]
          : ["Enregistre-toi avec l'application d'enregistrement de ton ordinateur, pendant environ " + dur + ".", "Choisis ensuite le fichier ci-dessous, ou fais-le glisser ici."];
      h += '<div class="rec-ways">' +
        '<div class="rec-way is-best"><span class="rec-way-ic">' + icon("phone") + '</span><div class="rec-way-body"><p class="rec-way-title">' + t("Le plus simple : ton téléphone") + "</p><p>" + t("Ouvre La Générale sur ton téléphone et appuie sur « Me filmer ». Tu te revois tout de suite, avec l'analyse.") + "</p></div></div>" +
        '<div class="rec-way"><span class="rec-way-ic">' + icon("laptop") + '</span><div class="rec-way-body"><p class="rec-way-title">' + t("Avec cet ordinateur") + '</p><ol class="rec-steps">' + steps.map(s => "<li>" + t(s) + "</li>").join("") + "</ol>" +
        '<label class="rec-drop" id="rec-drop" for="rec-file"><span class="drop-ic">' + icon("upload") + '</span><span class="drop-text"><strong>' + t("Choisir mon enregistrement") + '</strong><span class="muted small">' + t("ou fais-le glisser ici · son ou vidéo") + "</span></span>" + fileInput("rec-file", ACCEPT, null) + "</label>" +
        (UI.hosted ? "" : '<p class="muted small rec-why">' + t("Pourquoi ce détour ? Cette page n'a pas le droit d'allumer le micro de l'ordinateur elle-même.") + "</p>") +
        "</div></div></div>" +
        '<div class="rec-links"><button type="button" class="link small" data-act="dev-switch" data-arg="phone">' + t("Je suis sur un téléphone ou une tablette") + "</button></div>";
    }
    h += '<details class="more chrono-more" id="chrono-more"' + (st.timer && (st.timer.running || st.timer.elapsed) ? " open" : "") + "><summary>" + t("Pas moyen de t'enregistrer ? Juste un chrono") + "</summary>" +
      chrono(st.timer) + '<p class="muted small">' + t("Sans enregistrement, pas d'analyse : parle à voix haute et note ce que tu veux améliorer.") + "</p></details>";
    return h;
  }

  function chrono(tm) {
    tm = tm || { target: 60, elapsed: 0, running: false };
    const targets = [30, 60, 120, 300];
    if (targets.indexOf(tm.target) < 0) targets.push(tm.target);
    targets.sort((a, b) => a - b);
    const pct = Math.min(100, (tm.elapsed / Math.max(1, tm.target)) * 100);
    return '<div class="chrono" id="chrono">' +
      '<div class="seg-choice small-seg" role="radiogroup" aria-label="' + esc("Durée visée") + '">' + targets.map(v => '<button type="button" role="radio" aria-checked="' + (v === tm.target) + '" class="' + (v === tm.target ? "is-on" : "") + '" data-act="chrono-target" data-arg="' + v + '">' + t(E.fmtDur(v)) + "</button>").join("") + "</div>" +
      '<div class="clock' + (tm.elapsed > tm.target ? " is-over" : "") + '" id="chrono-clock" role="timer" aria-live="off"><span id="chrono-val">' + E.fmtClock(tm.elapsed) + '</span><span class="clock-target">/ ' + E.fmtClock(tm.target) + "</span></div>" +
      '<div class="bar"><span id="chrono-bar" style="width:' + pct + '%"></span></div>' +
      '<div class="row gap"><button type="button" class="btn btn-primary" data-act="chrono-toggle" id="chrono-btn">' + icon(tm.running ? "pause" : "play") + "<span>" + t(tm.running ? "Pause" : tm.elapsed ? "Reprendre" : "Démarrer le chrono") + "</span></button>" +
      '<button type="button" class="btn btn-line" data-act="chrono-reset" aria-label="' + esc("Remettre à zéro") + '">' + icon("reset") + "</button></div></div>";
  }

  function studioStatus(UI) {
    const st = UI.studio;
    if (st.status === "decoding") return progressBlock("Préparation de ton enregistrement…", st.progress);
    if (st.status === "analyzing") return progressBlock("Analyse de ta voix… quelques secondes", st.progress);
    if (st.status === "live") return progressBlock("Analyse pendant la lecture : laisse jouer jusqu'au bout.", st.progress) + '<button type="button" class="btn btn-line btn-sm" data-act="st-live-stop">' + icon("stop") + t("Arrêter et analyser ce qui a été lu") + "</button>";
    if (st.status === "need-live") return '<div class="notice"><p><strong>' + t("Encore une étape pour l'analyse.") + "</strong> " + t("Ce fichier doit être lu une fois en entier : l'analyse se fait pendant que tu te revois.") + '</p><button type="button" class="btn btn-primary" data-act="st-live">' + icon("play") + t("Lire et analyser") + "</button></div>";
    if (st.status === "error") return '<div class="notice is-error"><p>' + t(st.error || "Ce fichier n'a pas pu être lu.") + '</p><button type="button" class="btn btn-line btn-sm" data-act="st-new">' + icon("reset") + t("Choisir un autre enregistrement") + "</button></div>";
    return "";
  }

  /* Pendant la réécoute : compter ses « euh » d'un doigt */
  function ticBox(st) {
    return '<div class="tic-counter" id="st-tics"><div class="tic-help"><p class="h-label">' + t("Compte tes « euh »") + '</p><p class="muted small">' + t("Pendant que tu te réécoutes, appuie à chaque « euh ».") + '</p></div>' +
      '<div class="tic-ctl"><button type="button" class="btn btn-line btn-sm" data-act="st-tic" data-arg="-1" aria-label="' + esc("Retirer un « euh »") + '">−</button><span class="tic-val" id="st-tic-val" aria-live="polite">' + (st.manualTics || 0) + "</span>" +
      '<button type="button" class="btn btn-primary tic-plus" data-act="st-tic" data-arg="1">+1 ' + t("« euh »") + "</button></div></div>";
  }
  function wantsTics(S, st) {
    const f = st.ctx && st.ctx.focus;
