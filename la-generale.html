<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="La Générale : apprendre à parler en public et préparer ses entretiens, pas à pas. Version de test.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>La Générale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap">
<style>
/* La Générale — un plateau de répétition : une conduite verticale ponctuée de marques au sol
   (gaffer tape), une affiche condensée pour les titres, une machine à écrire pour le texte dit. */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --well: #E4E7EC;
  --ink: #15171C;
  --ink-2: #4B515D;
  --ink-3: #5E6573;
  --line: #D3D8DF;
  --line-2: #B7BEC9;
  --accent: #B3122E;
  --accent-hover: #970F27;
  --accent-ink: #FFFFFF;
  --accent-soft: #F8E1E5;
  --focus: #2D5FD6;
  --tape-a: #E5B400; --tape-a-ink: #15171C;
  --tape-b: #EC6A1F; --tape-b-ink: #15171C;
  --tape-c: #2D5FD6; --tape-c-ink: #FFFFFF;
  --tape-d: #11845D; --tape-d-ink: #FFFFFF;
  --tape-e: #8A3FD6; --tape-e-ink: #FFFFFF;
  --tape-f: #B3122E; --tape-f-ink: #FFFFFF;
  --good: #157A47; --good-ink: #FFFFFF; --good-soft: #DCF0E4;
  --warn: #9A5B00; --warn-soft: #F7E8CC;
  --info: #3D4B63; --info-soft: #E1E6EE;
  --bad: #B3261E; --bad-ink: #FFFFFF;
  --shadow: 0 10px 30px -12px rgba(21, 23, 28, .35);
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
  --font-stencil: "Big Shoulders Stencil Display", "Big Shoulders Display", "Arial Narrow", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-script: "Courier Prime", "Courier New", ui-monospace, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F12; --surface: #17191E; --well: #1F2229;
    --ink: #ECEDF0; --ink-2: #A9AFBA; --ink-3: #8C93A0;
    --line: #2A2E36; --line-2: #414754;
    --accent: #FF5470; --accent-hover: #FF7189; --accent-ink: #1A0207; --accent-soft: #3A1520;
    --focus: #7AA2FF;
    --tape-a: #FFD23F; --tape-a-ink: #121212;
    --tape-b: #FF8A3D; --tape-b-ink: #121212;
    --tape-c: #6C95FF; --tape-c-ink: #0B1020;
    --tape-d: #3DD68C; --tape-d-ink: #06140D;
    --tape-e: #B588FF; --tape-e-ink: #140A22;
    --tape-f: #FF5470; --tape-f-ink: #1A0207;
    --good: #4ADE80; --good-ink: #06140D; --good-soft: #10291C;
    --warn: #FBBF24; --warn-soft: #2D2310;
    --info: #A9B8D3; --info-soft: #1C2230;
    --bad: #FF6B5E; --bad-ink: #1A0302;
    --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F12; --surface: #17191E; --well: #1F2229;
  --ink: #ECEDF0; --ink-2: #A9AFBA; --ink-3: #8C93A0;
  --line: #2A2E36; --line-2: #414754;
  --accent: #FF5470; --accent-hover: #FF7189; --accent-ink: #1A0207; --accent-soft: #3A1520;
  --focus: #7AA2FF;
  --tape-a: #FFD23F; --tape-a-ink: #121212;
  --tape-b: #FF8A3D; --tape-b-ink: #121212;
  --tape-c: #6C95FF; --tape-c-ink: #0B1020;
  --tape-d: #3DD68C; --tape-d-ink: #06140D;
  --tape-e: #B588FF; --tape-e-ink: #140A22;
  --tape-f: #FF5470; --tape-f-ink: #1A0207;
  --good: #4ADE80; --good-ink: #06140D; --good-soft: #10291C;
  --warn: #FBBF24; --warn-soft: #2D2310;
  --info: #A9B8D3; --info-soft: #1C2230;
  --bad: #FF6B5E; --bad-ink: #1A0302;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea, select { font: inherit; color: inherit; }
p { margin: 0 0 12px; max-width: 68ch; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 15px; }
.fineprint { font-size: 14px; color: var(--ink-3); margin-top: 16px; }

/* ---------- barre du haut ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding-block: 10px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 2px; cursor: pointer; color: var(--ink); }
.brand-ic { width: 28px; height: 28px; color: var(--accent); stroke-width: 1.6; }
.brand-name { font-family: var(--font-stencil); font-weight: 800; font-size: 25px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: 10px; }
.tabs button { position: relative; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; background: none; border-radius: 6px; color: var(--ink-2); font-weight: 700; cursor: pointer; min-height: 44px; }
.tabs button:hover { color: var(--ink); background: var(--well); }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: -11px; height: 5px; background: var(--accent);
  clip-path: polygon(0 20%, 8% 0, 40% 15%, 70% 0, 100% 10%, 97% 100%, 60% 85%, 25% 100%, 0 90%);
}
.top-side { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sync-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; padding: 6px 13px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; min-height: 40px; }
.sync-chip .ic { width: 18px; height: 18px; }
.sync-chip::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: none; }
.sync-chip[data-state="cloud"]::after { display: block; }

/* ---------- conteneur ---------- */
.view { max-width: 900px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-block: 28px 72px; outline: none; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 14px 0; }

/* ---------- typographie ---------- */
.h-display { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 6vw, 58px); line-height: 1.02; letter-spacing: -.005em; margin: 8px 0 14px; text-wrap: balance; }
.h-section { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 40px 0 12px; text-wrap: balance; }
.h-title { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; display: flex; align-items: center; gap: 8px; }
.h-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 8px; }
.h-phase { font-family: var(--font-stencil); font-weight: 800; font-size: 21px; text-transform: uppercase; letter-spacing: .06em; margin: 0; line-height: 1.1; }
.kicker { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.lead { font-size: 20px; line-height: 1.5; max-width: 62ch; margin: 0 0 20px; }
.script { font-family: var(--font-script); font-size: 17px; }

/* ---------- ruban adhésif (marques au sol) ---------- */
.tape-a { --tp: var(--tape-a); --tp-ink: var(--tape-a-ink); }
.tape-b { --tp: var(--tape-b); --tp-ink: var(--tape-b-ink); }
.tape-c { --tp: var(--tape-c); --tp-ink: var(--tape-c-ink); }
.tape-d { --tp: var(--tape-d); --tp-ink: var(--tape-d-ink); }
.tape-e { --tp: var(--tape-e); --tp-ink: var(--tape-e-ink); }
.tape-f { --tp: var(--tape-f); --tp-ink: var(--tape-f-ink); }
.tape {
  display: inline-block; flex: none; width: 28px; height: 10px; background: var(--tp, var(--accent));
  clip-path: polygon(0 18%, 7% 0, 30% 10%, 52% 0, 76% 8%, 100% 0, 96% 50%, 100% 100%, 70% 90%, 45% 100%, 20% 92%, 0 100%, 4% 55%);
  transform: rotate(-3deg);
}

/* ---------- boutons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 6px; border: 1.5px solid transparent; font-weight: 700; font-size: 16px; line-height: 1.2; cursor: pointer; text-align: center; transition: background-color .15s, border-color .15s, color .15s; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-line { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-line:hover:not(:disabled) { border-color: var(--ink-2); }
.btn-quiet { background: transparent; color: var(--ink-2); padding-inline: 8px; }
.btn-quiet:hover:not(:disabled) { color: var(--ink); }
.btn-danger { background: var(--bad); color: var(--bad-ink); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 15px; }
.btn-lg { min-height: 52px; padding: 12px 22px; font-size: 17px; }
.btn .ic { width: 19px; height: 19px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--ink-2); font-weight: 700; padding: 6px 0; cursor: pointer; margin-bottom: 6px; min-height: 40px; }
.back:hover { color: var(--ink); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 6px; cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--bad); background: var(--well); }

/* ---------- surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; margin: 16px 0; }
.panel.slim { padding: 16px 18px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-head .h-label, .panel-head .h-title { margin: 0; }
.well { background: var(--well); border-radius: var(--r); padding: 14px 16px; margin: 12px 0; }
.notice { margin-top: 14px; padding: 14px 16px; border-radius: 6px; background: var(--info-soft); }
.notice.is-error { background: var(--warn-soft); }
.notice p:last-child { margin-bottom: 0; }

/* ---------- pastilles ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: var(--info-soft); color: var(--info); }
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-accent { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { display: inline-flex; align-items: center; padding: 5px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 14px; background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip-btn { cursor: pointer; min-height: 36px; }
.chip-btn:hover { border-color: var(--ink-2); }
.chip-btn.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip-warn { border-color: var(--warn); color: var(--warn); }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tag { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 4px; background: var(--ink); color: var(--bg); letter-spacing: .02em; }

/* ---------- champs ---------- */
.input { width: 100%; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 6px; padding: 11px 14px; min-height: 48px; }
.input::placeholder { color: var(--ink-3); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; line-height: 1.5; }
.field { margin: 14px 0; }
.field > label, .field > .h-label { display: block; font-weight: 700; margin-bottom: 6px; }
.field > .h-label { font-size: 13px; }
.script-input { font-family: var(--font-script); font-size: 16px; }
.bar { height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .25s; }
.seg-choice { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface); margin: 6px 0 12px; max-width: 100%; }
.seg-choice button { border: 0; border-right: 1px solid var(--line); background: none; padding: 9px 16px; font-weight: 700; cursor: pointer; color: var(--ink-2); min-height: 44px; }
.seg-choice button:last-child { border-right: 0; }
.seg-choice button:hover:not(:disabled) { color: var(--ink); }
.seg-choice button.is-on { background: var(--ink); color: var(--bg); }
.seg-choice button:disabled { opacity: .5; cursor: not-allowed; }
.small-seg button { padding: 6px 12px; font-size: 14px; min-height: 36px; }

/* ---------- accueil ---------- */
.hero { padding: 16px 0 6px; }
.hero .h-display { font-size: clamp(42px, 8vw, 76px); max-width: 15ch; margin-top: 14px; }
.score-wrap { position: relative; }
.score-canvas { display: block; width: 100%; height: 210px; touch-action: manipulation; }
#st-score { cursor: pointer; }
.playhead { position: absolute; top: 10px; bottom: 22px; width: 2px; background: var(--ink); opacity: .75; pointer-events: none; }
.score-demo .score-wrap::after {
  content: ""; position: absolute; top: 10px; bottom: 22px; left: 8px; width: 2px; background: var(--ink); opacity: .55;
  animation: sweep 14s linear infinite;
}
@keyframes sweep { from { left: 8px; } to { left: calc(100% - 10px); } }
.legend { list-style: none; padding: 0; margin: 12px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-2); }
.lg { display: inline-block; vertical-align: middle; margin-right: 7px; }
.lg-line { width: 20px; height: 3px; background: var(--accent); border-radius: 2px; }
.lg-rest { width: 10px; height: 5px; background: var(--ink-2); }
.lg-mono { width: 16px; height: 12px; border: 1px solid var(--warn); background: repeating-linear-gradient(45deg, var(--warn-soft) 0 3px, transparent 3px 6px); }
.how-list { list-style: none; counter-reset: how; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.how-list li { counter-increment: how; padding: 16px 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.how-list li::before { content: counter(how, decimal-leading-zero); font-family: var(--font-script); font-weight: 700; font-size: 15px; color: var(--accent); }
.how-list h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 4px 0 6px; }
.how-list p { margin: 0; color: var(--ink-2); font-size: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.mentor-list { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.mentor-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.m-name { font-family: var(--font-display); font-weight: 700; font-size: 24px; }
.m-dom { color: var(--ink-2); }

/* ---------- diagnostic ---------- */
.ob { max-width: 700px; }
.ob-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.ob-top .h-label { margin: 0; white-space: nowrap; }
.ob-top .bar { flex: 1; }
.ob-q { font-size: clamp(32px, 5vw, 46px); }
.options { display: grid; gap: 10px; margin: 18px 0; }
.option { display: flex; align-items: center; gap: 14px; text-align: left; padding: 13px 16px; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r); cursor: pointer; width: 100%; }
.option:hover { border-color: var(--ink-2); }
.option.is-on { border-color: var(--accent); background: var(--accent-soft); }
.option-mark { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; color: transparent; background: var(--surface); }
.options.is-multi .option-mark { border-radius: 5px; }
.option.is-on .option-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.option-mark .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.option-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.option-label { font-weight: 700; }
.option-hint { font-size: 15px; color: var(--ink-2); }
.ob-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.date-field { max-width: 340px; }

/* ---------- parcours ---------- */
.ready .lead { max-width: 58ch; }
.sticky-cta { position: sticky; bottom: 16px; margin-top: 20px; z-index: 5; }
.sticky-cta .btn { box-shadow: var(--shadow); max-width: 100%; }
.dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.dash-head > div:first-child { min-width: 0; }
.countdown { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.cd-num { font-family: var(--font-stencil); font-weight: 800; font-size: 68px; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
.cd-sub { font-size: 14px; color: var(--ink-2); }
.progress-line { margin: 18px 0 8px; }
.segs { display: flex; gap: 3px; margin-bottom: 8px; }
.seg { flex: 1; height: 8px; background: var(--well); border-radius: 2px; }
.seg.is-done { background: var(--tp); }
.next-card { background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); padding: 20px 22px; margin: 18px 0 22px; box-shadow: 6px 6px 0 var(--accent); }
.next-card .h-title { font-size: 30px; }
.rec { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.rec:first-of-type { border-top: 0; }
.rec p { margin: 2px 0 0; }
.coach-row { display: flex; gap: 10px; }
.coach-row .input { flex: 1; min-width: 0; }
.coach-out { margin-top: 14px; padding: 16px 18px; background: var(--well); border-radius: 6px; font-size: 16px; }
.coach-out h4 { margin: 10px 0 4px; font-size: 16px; }
.coach-out ul { margin: 4px 0 10px; padding-left: 20px; }
.coach-out li { margin: 3px 0; }
.coach-out p { margin: 0 0 8px; }
.coach-out p:last-child { margin-bottom: 0; }
.coach-out.is-error { background: var(--warn-soft); }
.coach-out.is-wait { display: flex; align-items: center; color: var(--ink-2); }
.dots { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 10px; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .2; } }

.plan { margin-top: 18px; }
.phase { margin-top: 28px; }
.phase-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.phase-sub { color: var(--ink-3); font-size: 15px; }
.steps { list-style: none; padding: 0; margin: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 21px; top: 10px; bottom: 10px; border-left: 2px dashed var(--line-2); }
.step-btn { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 4px 13px 0; background: none; border: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.step-btn:hover .step-title { text-decoration: underline; text-underline-offset: 3px; }
.mark { position: relative; z-index: 1; width: 44px; height: 40px; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 4px; font-family: var(--font-script); font-weight: 700; font-size: 15px; color: var(--ink); }
.mark::before {
  content: ""; position: absolute; top: -6px; left: 50%; width: 30px; height: 10px; transform: translateX(-50%) rotate(-4deg); background: var(--tp);
  clip-path: polygon(0 18%, 7% 0, 30% 10%, 52% 0, 76% 8%, 100% 0, 96% 50%, 100% 100%, 70% 90%, 45% 100%, 20% 92%, 0 100%, 4% 55%);
}
.mark .ic { width: 20px; height: 20px; stroke-width: 2.4; }
.step.is-done .mark { background: var(--tp); border-color: var(--tp); color: var(--tp-ink); }
.step.is-next .mark { border: 2px solid var(--ink); }
.step-body { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.step-title { font-weight: 700; font-size: 17px; }
.step-short { color: var(--ink-2); font-size: 15px; }
.step-meta { color: var(--ink-3); font-size: 13px; }
.step.is-done .step-title { color: var(--ink-2); }

/* ---------- leçon ---------- */
.lesson-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.lesson-meta .h-label { margin: 0; }
.points { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr); gap: 12px 24px; margin: 0 0 20px; }
.points dt { font-weight: 700; }
.points dd { margin: 0; }
.points dd.solo { grid-column: 1 / -1; position: relative; padding-left: 20px; }
.points dd.solo::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; background: var(--accent); }
.source { font-size: 15px; color: var(--ink-2); border-left: 3px solid var(--line-2); padding-left: 12px; max-width: 72ch; }
.source .h-label { display: inline; margin-right: 4px; }
.todo { margin: 28px 0; padding: 22px; background: var(--surface); border: 2px dashed var(--line-2); border-radius: var(--r); }
.todo-kicker { font-family: var(--font-script); font-weight: 700; text-transform: uppercase; letter-spacing: .16em; color: var(--accent); margin: 0 0 4px; }
.todo-steps { padding-left: 24px; margin: 6px 0 14px; }
.todo-steps li { margin: 7px 0; padding-left: 4px; }
.todo-steps li::marker { font-family: var(--font-script); font-weight: 700; color: var(--accent); }
.checks { list-style: none; padding: 0; margin: 8px 0 14px; display: grid; gap: 4px; }
.checks.inline { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 14px; }
.check { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 8px 6px; cursor: pointer; border-radius: 6px; }
.check:hover { background: var(--well); }
.box { width: 24px; height: 24px; flex: none; border: 1.5px solid var(--line-2); border-radius: 5px; display: grid; place-items: center; color: transparent; background: var(--surface); }
.box .ic { width: 16px; height: 16px; stroke-width: 2.6; }
.check.is-on .box { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.checks.is-todo .check.is-on > span:last-child { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.finish { margin: 28px 0 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.structure-list { margin: 0; padding-left: 22px; }
.structure-list li { margin: 6px 0; }
.structure-list li.is-filled { color: var(--ink-2); }
.table-wrap { overflow-x: auto; }
.cmp { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.cmp th, .cmp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.cmp thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.cmp tbody th { font-weight: 400; }

/* ---------- studio ---------- */
.studio-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 8px; }
.studio-grid > .panel { margin: 0; }
.prompt-text { font-family: var(--font-script); font-size: 19px; line-height: 1.45; }
.clock { font-family: var(--font-script); font-weight: 700; font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; margin: 10px 0 12px; }
.clock-target { font-size: 18px; color: var(--ink-3); margin-left: 6px; }
.clock.is-over #chrono-val { color: var(--warn); }
.chrono .bar { margin-bottom: 4px; }
.chrono .row { margin-bottom: 0; }
.drop { position: relative; display: flex; align-items: center; gap: 14px; padding: 18px; border: 2px dashed var(--line-2); border-radius: var(--r); cursor: pointer; background: var(--well); }
.drop:hover { border-color: var(--accent); }
.drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop strong { display: block; }
.drop-ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent); flex: none; }
.file-name { overflow-wrap: anywhere; }
.media-box { position: relative; border-radius: 6px; overflow: hidden; background: #000; }
.media-box video { display: block; width: 100%; max-height: min(70vh, 560px); object-fit: contain; background: #000; }
.media-box.is-audio { background: none; overflow: visible; }
.media-box audio { width: 100%; display: block; }
.cover { position: absolute; inset: 0 0 58px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--ink); color: var(--bg); text-align: center; padding: 16px; font-weight: 700; }
.cover .ic { width: 38px; height: 38px; }
.progress { margin-top: 14px; }
.progress .bar { margin-top: 6px; height: 8px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
.metric { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; background: var(--bg); min-width: 0; }
.m-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 4px; }
.m-value { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.m-note { font-size: 13px; color: var(--ink-3); margin: 6px 0 0; }
.recs { margin-top: 8px; }
.passes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.pass-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 6px; font-weight: 700; cursor: pointer; min-height: 48px; text-align: center; }
.pass-btn:hover:not(:disabled) { border-color: var(--ink-2); }
.pass-btn.is-on { border-color: var(--accent); background: var(--accent-soft); }
.pass-btn:disabled { opacity: .45; cursor: not-allowed; }
.rates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 16px 0; }
.rate { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 0; }
.rate-label { font-size: 15px; }
.rate-btns { display: flex; gap: 4px; }
.rate-btns button { width: 34px; height: 34px; border: 1.5px solid var(--line-2); background: var(--surface); border-radius: 6px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.rate-btns button:hover { border-color: var(--ink-2); }
.rate-btns button.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.text-stats { margin: 8px 0; }
.tic-counter { display: flex; justify-content: space-between; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); margin-top: 14px; }
.tic-counter p { margin: 0; }
.tic-counter .row { margin: 0; }
.tic-val { font-family: var(--font-script); font-weight: 700; font-size: 28px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.saved .h-title .ic { color: var(--good); width: 24px; height: 24px; }

/* ---------- outils ---------- */
.tool-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.tool-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; min-height: 160px; }
.tool-card:hover { border-color: var(--ink-2); }
.tool-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 8px; background: var(--well); color: var(--accent); }
.tool-ic .ic { width: 22px; height: 22px; }
.tool-name { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.1; }
.tool-desc { color: var(--ink-2); font-size: 15px; }
.breath-stage { position: relative; width: min(320px, 78vw); max-width: 100%; aspect-ratio: 1; margin: 20px auto; display: grid; place-items: center; }
.orb { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, var(--tape-a) 0%, var(--tape-a) 38%, transparent 71%); opacity: .5; transform: scale(.32); }
.orb-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px dashed var(--line-2); }
.breath-text { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.br-phase { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.1; max-width: 13ch; text-wrap: balance; }
.br-count { font-family: var(--font-script); font-weight: 700; font-size: 34px; color: var(--ink-2); min-height: 1.2em; }
.breath-foot { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.breath-foot .seg-choice { margin: 0; }
.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.builder-out { position: sticky; top: 84px; }
.builder-out .panel:first-child { margin-top: 14px; }
.est { margin: 0 0 10px; }
.script-out { font-family: var(--font-script); font-size: 16px; line-height: 1.55; background: var(--well); border-radius: 6px; padding: 16px; max-height: 58vh; overflow: auto; }
.sc-label { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--accent); margin: 14px 0 2px; }
.sc-label:first-child { margin-top: 0; }
.sc-text { margin: 0 0 6px; white-space: pre-wrap; }
.memo { display: grid; gap: 10px; max-height: 58vh; overflow: auto; }
.memo-item { padding: 12px 14px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; }
.memo-label { display: block; font-family: var(--font-stencil); font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.memo-text { display: block; font-family: var(--font-script); font-size: 20px; font-weight: 700; line-height: 1.3; }
.qa-q { font-family: var(--font-display); font-weight: 700; font-size: clamp(27px, 4vw, 36px); line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }
.small-clock { font-size: 24px; margin: 0; }
.qa-card .bar { margin: 4px 0 10px; }
.method-list { margin: 0; padding-left: 22px; }
.method-list li { margin: 6px 0; }
.tap-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
.big-tap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 124px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); cursor: pointer; padding: 12px; touch-action: manipulation; user-select: none; }
.big-tap:active { background: var(--accent-soft); }
.bt-label { font-weight: 700; text-align: center; }
.bt-val { font-family: var(--font-script); font-weight: 700; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.ladder { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
.ladder li { display: flex; align-items: center; gap: 8px; }
.ladder .check { width: auto; padding: 8px; }
.ladder-input { flex: 1; min-width: 0; }
.ladder li.is-done .ladder-input { color: var(--ink-2); text-decoration: line-through; }
.ladder-add { margin-top: 4px; }
.ladder-add .input { flex: 1; min-width: 0; }
.impro-card .clock { margin-top: 18px; }

/* ---------- progrès ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; min-width: 0; }
.stat-v { font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat-l { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
.chart-box { width: 100%; overflow: hidden; }
.chart-box svg { display: block; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-text { fill: var(--ink-3); font-size: 12px; font-family: var(--font-body); }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.ch-area { fill: var(--accent-soft); opacity: .7; }
.ch-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.ch-end { fill: var(--accent); }
.ch-val { fill: var(--ink); font-weight: 700; font-size: 13px; font-family: var(--font-body); }
.journal { list-style: none; padding: 0; margin: 0 0 18px; border-top: 1px solid var(--line); }
.j-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.j-main { min-width: 0; }
.j-title { font-weight: 700; margin: 0 0 2px; }
.j-note { margin: 6px 0 0; font-style: italic; }
.j-item .row { margin: 0; flex-wrap: nowrap; }

/* ---------- méthodes, profil ---------- */
.mentor { padding: 20px 0 14px; border-top: 1px solid var(--line); }
.mentor .h-title { font-size: 30px; }
.take { margin: 6px 0 12px; padding-left: 20px; }
.take li { margin: 4px 0; }
.kv { display: grid; grid-template-columns: minmax(120px, 190px) minmax(0, 1fr); gap: 8px 18px; margin: 0 0 16px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 700; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 8px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- espace Entretiens ---------- */
.itw-teaser { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: center; margin: 28px 0 8px; padding: 24px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); box-shadow: 6px 6px 0 var(--tape-c); }
.itw-teaser .h-section { margin-top: 10px; }
.teaser-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.teaser-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
.teaser-list .ic { color: var(--good); flex: none; margin-top: 2px; stroke-width: 2.4; }
.itw-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-left: 6px solid var(--tape-c); }
.itw-card-main { min-width: 0; flex: 1; }
.itw-card-main p { margin: 0; }
.itw-card-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: 2px 0 8px !important; }
.mini-meter { height: 6px; background: var(--well); border-radius: 3px; overflow: hidden; max-width: 260px; margin-bottom: 4px; }
.mini-meter > span { display: block; height: 100%; background: var(--good); }
.itw-note p:last-of-type { margin-bottom: 10px; }
.tool-status { margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.dh-main { min-width: 0; flex: 1 1 420px; }
.dash-head .countdown { flex: 0 0 auto; }
.dh-main .chips { margin: 0 0 6px; }
.dh-main .row { margin: 6px 0 0; }
.nudge, .express { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.nudge p, .express p { margin: 0; }
.express { border-left: 6px solid var(--accent); }
.phase-strip { list-style: none; padding: 0; margin: 24px 0 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.phase-strip li { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--tp); border-radius: var(--r); }
.ps-num { font-family: var(--font-script); font-weight: 700; font-size: 14px; color: var(--ink-3); }
.ps-label { font-family: var(--font-stencil); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .05em; line-height: 1.15; }
.ps-sub { color: var(--ink-2); font-size: 15px; }
.meter { border: 1.5px solid var(--ink); }
.meter-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.meter-top .h-label { margin: 0 0 6px; }
.meter-pct { margin: 0; line-height: .9; font-family: var(--font-stencil); font-weight: 800; color: var(--good); font-variant-numeric: tabular-nums; }
.meter-num { font-size: 64px; }
.meter-unit { font-size: 30px; margin-left: 4px; }
.meter-segs { margin: 10px 0 6px; }
.meter-segs .seg { height: 10px; }
.meter-segs .seg.is-done { background: var(--good); }
.ready-list { list-style: none; padding: 0; margin: 8px 0 0; }
.ready-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.rl-mark { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; background: var(--surface); }
.rl-mark .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.ready-list li.is-done .rl-mark { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.rl-text { display: flex; flex-direction: column; min-width: 0; }
.rl-label { font-weight: 700; }
.ready-list li.is-done .rl-label { color: var(--ink-2); }
.rl-hint { font-size: 14px; color: var(--ink-3); }
.credit { margin: 32px 0 0; padding: 16px 18px; border: 1px dashed var(--line-2); border-radius: var(--r); font-size: 15px; color: var(--ink-2); }
.credit p { margin: 0; max-width: none; }
.tag-soft { background: var(--well); color: var(--ink-2); }
.tag-pap { background: var(--tape-c); color: var(--tape-c-ink); }
.chip-n { font-family: var(--font-script); font-weight: 700; font-size: 13px; color: var(--ink-3); margin-left: 2px; }
.chip-btn.is-on .chip-n { color: inherit; opacity: .75; }
.h-sm { font-size: 24px; margin-top: 26px; }

/* fiche */
.fiche { max-width: 760px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.options.compact { grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 6px 0; }
.options.compact .option { padding: 10px 12px; }
.form-error { color: var(--bad); font-weight: 700; }
select.input { appearance: auto; }

/* style */
.quiz { max-width: 700px; }
.quiz-q { font-size: 30px; margin: 10px 0 4px; }
.style-mini { list-style: none; padding: 0; margin: 14px 0 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.style-mini li { padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 2px; }
.sm-name { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.sm-want { color: var(--ink-2); font-size: 15px; }
.style-card { margin: 8px 0 18px; padding: 22px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r); box-shadow: 6px 6px 0 var(--tape-c); }
.style-name { font-family: var(--font-stencil); font-weight: 800; font-size: clamp(38px, 7vw, 56px); line-height: 1; text-transform: uppercase; letter-spacing: .03em; margin: 2px 0 2px; }
.style-bars { display: grid; gap: 8px; margin: 6px 0; }
.sb-row { display: grid; grid-template-columns: minmax(110px, 170px) minmax(0, 1fr) 48px; align-items: center; gap: 12px; }
.sb-label { font-size: 15px; }
.sb-track { height: 10px; background: var(--well); border-radius: 5px; overflow: hidden; }
.sb-track > span { display: block; height: 100%; background: var(--tape-c); border-radius: 5px; }
.sb-val { font-family: var(--font-script); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

/* offre */
.jd-ai { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.jd-ai .h-label { margin-top: 14px; }
.comp-list { list-style: none; padding: 0; margin: 10px 0; counter-reset: comp; display: grid; gap: 8px; }
.comp-list li { counter-increment: comp; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 8px; }
.comp-list li::before { content: counter(comp, decimal-leading-zero); font-family: var(--font-script); font-weight: 700; color: var(--ink-3); }
.comp-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 100px; gap: 8px; align-items: center; }
.comp-pill { justify-self: start; }

/* colonnes */
.two-col { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.col-side { position: sticky; top: 84px; display: flex; flex-direction: column; }
.col-side > .panel:first-child { margin-top: 14px; }
.pitch-field label { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 22px; margin-bottom: 0; }
.pitch-field p { margin: 2px 0 8px; }
.pf-num { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--tape-d); color: var(--tape-d-ink); font-family: var(--font-script); font-size: 16px; }
.big-num { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; margin: 2px 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.dur-track { position: relative; height: 12px; background: var(--well); border-radius: 6px; }
.dur-zone { position: absolute; top: 0; bottom: 0; left: 50%; width: 25%; background: var(--good-soft); border-left: 2px solid var(--good); border-right: 2px solid var(--good); }
.dur-mark { position: absolute; top: -5px; width: 4px; height: 22px; margin-left: -2px; background: var(--ink); border-radius: 2px; }
.dur-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin: 4px 0 6px; font-variant-numeric: tabular-nums; }
.dur-scale span:nth-child(2) { margin-left: 22%; }
.dur-scale span:nth-child(3) { margin-right: 12%; }
.pitch-preview { margin-top: 12px; padding: 14px; background: var(--well); border-radius: 6px; font-family: var(--font-script); font-size: 16px; line-height: 1.5; max-height: 40vh; overflow: auto; }
.pitch-preview p { margin: 0 0 10px; }
.pitch-preview p:last-child { margin-bottom: 0; }

/* histoires */
.theme-grid { list-style: none; padding: 0; margin: 4px 0 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.theme-grid li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1.5px dashed var(--line-2); border-radius: 6px; font-size: 15px; color: var(--ink-2); }
.theme-grid li.is-core { border-style: solid; }
.theme-grid li.is-on { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
.th-mark { width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; }
.theme-grid li.is-on .th-mark { background: var(--good); border-color: var(--good); color: var(--good-ink); }
.th-mark .ic { width: 13px; height: 13px; stroke-width: 2.8; }
.story-editor { border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--tape-d); }
.lint { padding: 12px 14px; background: var(--well); border-radius: 6px; margin: 6px 0 10px; }
.lint p { margin: 0 0 4px; }
.lint-list { margin: 4px 0 0; padding-left: 20px; font-size: 15px; }
.lint-list li { margin: 3px 0; }
.story-list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 10px; }
.story-card { display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--tape-d); border-radius: var(--r); }
.story-card.is-editing { border-color: var(--ink); }
.story-card .sc-main { min-width: 0; }
.story-card .sc-title { font-weight: 700; font-size: 18px; margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.story-card .sc-result { margin: 0 0 6px; color: var(--ink-2); }
.story-card .chips { margin: 4px 0; }
.story-card .sc-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }

/* questions */
.pq-list { list-style: none; padding: 0; margin: 12px 0 20px; border-top: 1px solid var(--line); }
.pq-item { border-bottom: 1px solid var(--line); }
.pq-head { display: grid; grid-template-columns: minmax(0, 1fr) auto 24px; align-items: center; gap: 12px; width: 100%; padding: 14px 4px; background: none; border: 0; text-align: left; cursor: pointer; }
.pq-head:hover .pq-q { text-decoration: underline; text-underline-offset: 3px; }
.pq-q { font-weight: 700; font-size: 17px; }
.pq-meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.pq-chev { color: var(--ink-3); transition: transform .15s; display: grid; place-items: center; }
.pq-head[aria-expanded="true"] .pq-chev { transform: rotate(90deg); }
.pq-body { padding: 4px 4px 20px; }
.pq-dl { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 8px 20px; margin: 4px 0 12px; }
.pq-dl dt { font-weight: 700; color: var(--ink-2); font-size: 15px; }
.pq-dl dd { margin: 0; }
.pq-ex { margin: 12px 0; padding: 14px 16px; background: var(--well); border-left: 4px solid var(--tape-c); border-radius: 0 6px 6px 0; }
.pq-ex p:last-child { margin-bottom: 0; }
.check-inline { width: auto; padding: 6px 10px; border: 1.5px solid var(--line-2); border-radius: 6px; align-items: center; }
.add-form { flex-wrap: nowrap; }
.add-form .input { flex: 1; min-width: 0; }
.simple-list { list-style: none; padding: 0; margin: 8px 0 0; }
.simple-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.simple-list li span { min-width: 0; }

/* simulateur */
.mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 14px 0 6px; }
.mode-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r); cursor: pointer; }
.mode-card:hover:not(:disabled) { border-color: var(--ink-2); }
.mode-card.is-on { border-color: var(--accent); background: var(--accent-soft); }
.mode-card:disabled { opacity: .55; cursor: not-allowed; }
.mc-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1; }
.mc-desc { color: var(--ink-2); font-size: 15px; }
.tip { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; padding: 14px 16px; background: var(--info-soft); border-radius: 6px; }
.tip .ic { flex: none; color: var(--info); margin-top: 2px; }
.tip p { margin: 0; font-size: 15px; }
.sim-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; }
.sim-top .h-label { margin: 0; }
.sim-dots { display: flex; gap: 4px; margin: 8px 0 4px; }
.sim-dots span { flex: 1; height: 6px; border-radius: 3px; background: var(--well); }
.sim-dots span.is-done { background: var(--ink-3); }
.sim-dots span.is-cur { background: var(--accent); }
.sim-check-title { margin-top: 16px; }
.chat { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.bubble { max-width: min(560px, 88%); padding: 12px 14px; border-radius: 12px; }
.bubble.rec { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--accent-soft); border: 1px solid transparent; border-bottom-right-radius: 4px; }
.b-who { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 4px; }
.b-text { white-space: normal; overflow-wrap: anywhere; }
.bubble.rec .b-text { font-family: var(--font-script); font-size: 17px; }
.bubble.is-typing .b-text { display: flex; align-items: center; color: var(--ink-2); font-family: var(--font-body); font-size: 15px; }
.chat-form { padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.chat-form .h-label { display: block; }
.scorecard { border: 1.5px solid var(--ink); }
.scorecard .sc-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; }
.scorecard .sc-note { display: flex; align-items: baseline; font-family: var(--font-stencil); font-weight: 800; color: var(--accent); line-height: .9; font-variant-numeric: tabular-nums; }
.scorecard .sc-num { font-size: 72px; }
.scorecard .sc-den { font-size: 28px; margin-left: 4px; }
.scorecard .sc-verdict { margin: 0; font-size: 18px; flex: 1; min-width: 220px; }
.scorecard .sc-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

/* questions à poser */
.ask-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ask-text .tag { align-self: flex-start; margin-top: 4px; }
.ask-q { font-weight: 700; }
.ask-note { font-size: 14px; color: var(--ink-2); }
.check.is-on .ask-text { text-decoration: none; }
.check.is-on .ask-q { color: var(--ink); text-decoration: none; }
.avoid { border-left: 6px solid var(--warn); }
.avoid-list { list-style: none; padding: 0; margin: 8px 0; }
.avoid-list li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 18px; padding: 9px 0; border-top: 1px solid var(--line); }
.av-q { font-weight: 700; text-decoration: line-through; text-decoration-color: var(--warn); text-decoration-thickness: 2px; }
.av-why { color: var(--ink-2); font-size: 15px; }

/* salaire */
.sal-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 12px; }
.sal-grid.sal-one { grid-template-columns: minmax(0, 260px); }
.input-unit { display: flex; align-items: stretch; }
.input-unit .input { border-top-right-radius: 0; border-bottom-right-radius: 0; min-width: 0; font-variant-numeric: tabular-nums; }
.input-unit .unit { display: grid; place-items: center; padding: 0 10px; border: 1.5px solid var(--line-2); border-left: 0; border-radius: 0 6px 6px 0; background: var(--well); color: var(--ink-2); font-size: 13px; font-weight: 700; white-space: nowrap; }
.sal-bar { position: relative; height: 26px; margin: 16px 0 8px; background: var(--well); border-radius: 6px; }
.sal-bar .sb-market { position: absolute; top: 6px; bottom: 6px; background: var(--line-2); border-radius: 4px; }
.sal-bar .sb-ask { position: absolute; top: 2px; bottom: 2px; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 5px; }
.sal-bar .sb-mark { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; border-radius: 2px; }
.sal-bar .sb-target { background: var(--accent); }
.sal-bar .sb-floor { background: var(--warn); }
.lg-market { width: 18px; height: 10px; background: var(--line-2); border-radius: 2px; }
.lg-ask { width: 18px; height: 10px; background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 3px; }
.lg-target { width: 4px; height: 14px; background: var(--accent); }
.lg-floor { width: 4px; height: 14px; background: var(--warn); }
.warn-list { margin: 8px 0; padding: 10px 14px 10px 30px; background: var(--warn-soft); border-radius: 6px; font-size: 15px; }
.scripts-title { margin-top: 20px; }
.scripts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 8px 0; }
.script-card { padding: 14px 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; }
.script-card .sc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.script-card .h-label { margin: 0 0 6px; }
.script-card .script { margin: 0 0 8px; flex: 1; }
.script-card .btn { align-self: flex-start; padding-left: 0; }
.info-box { border-left: 6px solid var(--tape-c); }
.info-box p:last-child { margin-bottom: 0; }

/* remerciement */
.email { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
.email-subj { margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.email-subj span { color: var(--ink-3); font-weight: 400; margin-right: 6px; }
.email-body { padding: 12px 14px; font-family: var(--font-script); font-size: 16px; line-height: 1.5; }
.script-card .email-body { padding: 4px 0 8px; }
.email-body p { margin: 0; }
.email-body .gap-line { height: .8em; }
.two-lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

/* candidatures */
.stats.stats-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.app-list { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 10px; }
.app-card { display: flex; justify-content: space-between; gap: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.app-card.is-current { border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--accent); }
.ac-main { min-width: 0; }
.ac-main p { margin: 0 0 4px; }
.ac-title { font-weight: 700; font-size: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ac-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.ac-side .row { margin: 0; justify-content: flex-end; }
.input-sm { min-height: 38px; padding: 6px 10px; width: auto; font-size: 15px; }


/* ---------- enregistreur ---------- */
.prompt-card { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--tape-b); border-radius: var(--r); }
.prompt-card .h-label { margin-bottom: 4px; }
.prompt-card .prompt-text { margin: 0 0 4px; }
.prompt-card .btn { margin-left: -8px; }
.recorder { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.recorder > .panel, .recorder #st-player > .panel, .recorder #st-results > .panel, .recorder #st-coach > .panel { margin: 0; }
.recorder #st-results { display: flex; flex-direction: column; gap: 14px; }
.recorder > div, .recorder #st-results > div { scroll-margin-top: 84px; }
.recorder #st-results:empty, .recorder #st-coach:empty { display: none; }
.rec-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.rec-cta {
  position: relative; display: flex; align-items: center; gap: 18px; width: 100%; min-height: 88px; padding: 18px 22px;
  background: var(--accent); color: var(--accent-ink); border-radius: 16px; cursor: pointer; box-shadow: var(--shadow);
  -webkit-tap-highlight-color: transparent; user-select: none; transition: background-color .15s, transform .1s;
}
.rec-cta:hover { background: var(--accent-hover); }
.rec-cta:active { transform: scale(.985); }
.rec-cta:focus-within { outline: 3px solid var(--focus); outline-offset: 3px; }
.rec-dot { position: relative; width: 50px; height: 50px; border-radius: 50%; background: var(--accent-ink); flex: none; display: grid; place-items: center; }
.rec-dot::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent-ink); opacity: .55; animation: recring 1.8s ease-out infinite; }
.rec-dot::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); }
@keyframes recring { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }
.rec-cta-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rec-cta-main { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: .01em; }
.rec-cta-sub { font-size: 15px; font-weight: 700; opacity: .92; }
.rec-how { margin: 0; padding-left: 24px; display: grid; gap: 4px; }
.rec-how li::marker { font-family: var(--font-script); font-weight: 700; color: var(--accent); }
.rec-note { margin: 0; }
.rec-how-line { margin: 0; font-size: 16px; }
.rec-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.rec-alt { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border: 1.5px solid var(--line-2); border-radius: 8px; background: var(--surface); font-weight: 700; cursor: pointer; }
.rec-alt:hover { border-color: var(--ink-2); }
.rec-alt:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.rec-ways { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 12px; align-items: start; }
.rec-way { display: flex; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.rec-way.is-best { border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--accent); }
.rec-way-body { min-width: 0; flex: 1; }
.rec-way-body p { margin: 0 0 6px; }
.rec-way-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--well); color: var(--accent); flex: none; }
.rec-way-ic .ic { width: 24px; height: 24px; }
.rec-way-title { font-weight: 700; font-size: 18px; }
.rec-steps { margin: 6px 0 14px; padding-left: 22px; display: grid; gap: 6px; font-size: 16px; }
.rec-drop { position: relative; display: flex; align-items: center; gap: 14px; padding: 16px; border: 2px dashed var(--line-2); border-radius: var(--r); cursor: pointer; background: var(--well); transition: border-color .15s, background-color .15s; }
.rec-drop:hover, .rec-drop.is-over { border-color: var(--accent); background: var(--accent-soft); }
.rec-drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.drop-text { display: flex; flex-direction: column; min-width: 0; }
.rec-why { margin: 10px 0 0 !important; }
.chrono { padding: 4px 0 8px; }
.chrono .seg-choice { margin-top: 2px; }
.player .h-title .ic { width: 24px; height: 24px; color: var(--accent); }
.pass-row { margin-top: 12px; }
.pass-row p { margin: 0 0 6px; }
.pass-btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; max-width: 460px; }
.pass-btns .pass-btn { min-height: 46px; padding: 8px 12px; }
.take-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 8px; }
.take-head .h-label { margin: 0; }
.take-dur { font-size: 15px; font-weight: 700; color: var(--ink); }
.tic-counter { justify-content: space-between; }
.tic-help { min-width: 0; flex: 1 1 220px; }
.tic-ctl { display: flex; align-items: center; gap: 10px; }
.tic-plus { min-height: 52px; padding-inline: 20px; font-size: 18px; }

/* ce qu'on a remarqué */
.verdict { border: 1.5px solid var(--ink); }
.verdict.is-error { border-color: var(--warn); }
.verdict-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4.4vw, 38px); line-height: 1.05; margin: 2px 0 6px; text-wrap: balance; }
.verdict-sub { color: var(--ink-2); margin: 0 0 14px; }
.findings { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.finding { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 8px; background: var(--bg); border-left: 5px solid var(--line-2); }
.finding.is-good { border-left-color: var(--good); }
.finding.is-warn { border-left-color: var(--warn); background: var(--warn-soft); }
.f-mark { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.finding.is-good .f-mark { background: var(--good); color: var(--good-ink); }
.finding.is-warn .f-mark { background: var(--warn); color: var(--surface); }
.f-mark .ic { width: 18px; height: 18px; stroke-width: 2.4; }
.f-body { min-width: 0; }
.f-title { font-weight: 700; font-size: 18px; margin: 3px 0 2px; }
.f-text { margin: 0; color: var(--ink-2); font-size: 16px; }
.advice { display: flex; gap: 14px; align-items: flex-start; margin-top: 16px; padding: 16px 18px; background: var(--info-soft); border-radius: 8px; }
.advice-ic { color: var(--info); flex: none; }
.advice-ic .ic { width: 28px; height: 28px; }
.advice .h-label { margin-bottom: 4px; }
.advice-text { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
.since { margin-top: 16px; }
.since-list { list-style: none; padding: 0; margin: 0; }
.since-list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 16px; }
.since-v { font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.since-list li.is-good .ic { color: var(--good); stroke-width: 2.6; width: 18px; height: 18px; }
.coach-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.coach-head .h-title { font-size: 22px; margin-bottom: 2px; }
.coach-head .h-title .ic { color: var(--accent); }
.coach-head p { margin: 0; }
.coach-head .row { margin: 0; }
